<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessLab — Openings Trainer &amp; Free Game Review</title>
<meta name="description" content="Practice openings against Stockfish from your own move orders, and review your chess.com games automatically — free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2381b64c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='19' fill='white'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
/* ================= TOKENS (chess.com palette) ================= */
:root{
  --green:#81b64c; --green-dark:#5d8534; --green-soft:rgba(129,182,76,.14);
  --bg:#f7f6f5; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f5f3f1;
  --border:#e3e1df; --border-soft:#edebe9;
  --text:#312e2b; --text-2:#6b6a67; --text-3:#9a9894;
  --nav-bg:#262421; --nav-text:#c8c6c4; --nav-text-active:#ffffff;
  --shadow:0 1px 2px rgba(49,46,43,.06),0 4px 16px -6px rgba(49,46,43,.10);
  --shadow-lg:0 8px 30px -8px rgba(49,46,43,.22);
  --r:10px; --r-lg:14px;
  --sq-l:#f0d9b5; --sq-d:#b58863; --board-border:#3d3933;
  --best:#81b64c; --brill:#26c2a3; --great:#26c2a3; --exc:#95bb4a;
  --good:#95bb4a; --book:#a88865; --inac:#f7c631; --mist:#ffa459; --blun:#fa412d;
  --eval-white:#f7f6f5; --eval-black:#4b4847;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="dark"] .coord-file,html[data-theme="dark"] .coord-rank{color:inherit}
html[data-theme="dark"]{
  --bg:#21201e; --bg-2:#2a2826; --surface:#2a2826; --surface-2:#312e2c;
  --border:#3d3a37; --border-soft:#3a3734;
  --text:#f0f0ee; --text-2:#b3b0ad; --text-3:#8a8784;
  --nav-bg:#262421; --nav-text:#c8c6c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px -6px rgba(0,0,0,.35);
  --sq-l:#ebecd0; --sq-d:#739552; --board-border:#3d3933;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.skip{position:absolute;left:-9999px;top:0;background:var(--green);color:#fff;padding:8px 14px;border-radius:8px;z-index:300}
.skip:focus{left:12px;top:12px}

/* ================= TOP NAV (chess.com style) ================= */
.topnav{background:var(--nav-bg);height:56px;display:flex;align-items:center;padding:0 20px;gap:8px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:0 14px 0 4px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:17px}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{color:var(--nav-text);font-weight:600;font-size:14px;padding:0 16px;height:100%;position:relative;transition:color .15s}
.tabs button:hover{color:var(--nav-text-active)}
.tabs button[aria-current="page"]{color:var(--nav-text-active)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--green);border-radius:3px 3px 0 0}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ver-badge{color:rgba(255,255,255,.45);font-size:11px;font-weight:700;padding:0 6px}
.nav-chip{color:var(--nav-text);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);padding:5px 11px;border-radius:999px}
.nav-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3,#8a8784)}
.nav-chip .dot.ok{background:var(--green)}
.nav-chip .dot.err{background:#fa412d}
.nav-chip .dot.warn{background:#f7c631}
html,body{overflow-x:hidden}
.pagewrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}

/* ================= GENERIC ================= */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:18px}
h1{font-size:22px;letter-spacing:-.02em}
h2{font-size:16px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:12.5px}
.mt-8{margin-top:8px}.mt-14{margin-top:14px}.mt-20{margin-top:20px}
hr.sep{border:none;border-top:1px solid var(--border-soft);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;min-height:40px;transition:filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dark)}
.btn-ghost{border-color:var(--border);color:var(--text);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{border-color:#f0c4bd;color:#d63c1e;background:var(--surface)}
.btn-danger:hover{background:#fdf1ee}
.btn-sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;min-height:40px;font-size:14px}
.input:focus{outline:none;border-color:var(--green)}
textarea.input{resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
label,.field-label{font-size:13px;font-weight:600;color:var(--text-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-2)}
.err{color:#d63a2f;font-size:12.5px;font-weight:600;display:none}
.err.show{display:block}
.empty{padding:40px 20px;text-align:center}
.empty h3{font-size:16px;margin-bottom:4px}
.empty p{color:var(--text-2);font-size:14px;max-width:420px;margin:0 auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--border-soft)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border-soft)}
table.tbl tr:last-child td{border-bottom:none}

/* toast + modal */
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center}
.toast{background:var(--nav-bg);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:tIn .22s ease both}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.out{animation:tOut .22s ease both}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(30,28,26,.55);z-index:90;display:grid;place-items:center;padding:20px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.modal-head h2{font-size:16px}
.modal-body{padding:14px 20px 20px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);cursor:pointer;font-size:16px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* ================= BOARD (chess.com style) ================= */
.board-wrap{display:flex;gap:12px;align-items:stretch}
.board-outer{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px -6px rgba(49,46,43,.35);flex:none}
#board,#builder-board,#review-board{position:relative;width:min(560px,92vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
#board .squares,#builder-board .squares,#review-board .squares{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
#board .sq,#builder-board .sq,#review-board .sq{position:relative}
#board .sq.l,#builder-board .sq.l,#review-board .sq.l{background:var(--sq-l)} #board .sq.d,#builder-board .sq.d,#review-board .sq.d{background:var(--sq-d)}
#board .sq .coord-f,#board .sq .coord-r{position:absolute;font-size:calc(var(--bw,560px)/56);font-weight:700;opacity:.9}
#board .coord-file{bottom:2%;right:4%}
#board .coord-rank{top:3%;left:5%}
#board .sq.l .coord{color:var(--sq-d)} #board .sq.d .coord{color:var(--sq-l)}
#board .hl,#builder-board .hl,#review-board .hl{position:absolute;inset:0;background:rgba(255,255,51,.42)}
#board .hl-sel,#builder-board .hl-sel,#review-board .hl-sel{position:absolute;inset:0;background:rgba(255,255,51,.5)}
#board .hl-check,#builder-board .hl-check,#review-board .hl-check{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,60,40,.75) 20%,rgba(255,60,40,.28) 55%,transparent 75%)}
#board .hint-dot,#builder-board .hint-dot,#review-board .hint-dot{position:absolute;width:31%;height:31%;left:34.5%;top:34.5%;border-radius:50%;background:rgba(20,20,10,.22)}
#board .hint-ring,#builder-board .hint-ring,#review-board .hint-ring{position:absolute;inset:5%;border-radius:50%;border:6px solid rgba(20,20,10,.28);background:none}
/* pieces: absolutely-positioned divs, transformed — CSS transition makes moves glide */
.piece{position:absolute;width:12.5%;height:12.5%;left:0;top:0;z-index:10;will-change:transform;pointer-events:none}
.piece svg{width:100%;height:100%;display:block;pointer-events:none}
.piece.dragging{z-index:30;transition:none!important;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.piece.snapped{transition:transform .13s ease}
.piece.moving{transition:transform .16s cubic-bezier(.2,.85,.3,1)}
.piece.captured{transition:opacity .12s ease,transform .16s ease;opacity:0}
#board .arrow-layer,#builder-board .arrow-layer,#review-board .arrow-layer{position:absolute;inset:0;z-index:20;pointer-events:none}
#board .coord-layer,#builder-board .coord-layer,#review-board .coord-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.piece svg .pc-w{--pc-fill:#ffffff;--pc-stroke:#2b2926;--pc-detail:#2b2926}
.piece svg .pc-b{--pc-fill:#3d3a37;--pc-stroke:#211f1d;--pc-detail:#e8e4dc}
.piece svg path[stroke],.piece svg path:not([stroke]){stroke-width:1.45;stroke-linejoin:round}
.evalbar{width:20px;border-radius:5px;overflow:hidden;background:var(--eval-black);position:relative;flex:none;border:1px solid var(--border-soft)}
.evalbar .white{position:absolute;bottom:0;left:0;right:0;background:var(--eval-white);transition:height .35s ease}
.eval-num{font-weight:800;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}

/* game layout */
.game-grid{display:grid;grid-template-columns:minmax(auto,600px) minmax(320px,400px);gap:22px;justify-content:center;align-items:start}
.board-col{display:flex;flex-direction:column;gap:10px}
.players-strip{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.players-strip .avatar{width:34px;height:34px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;border:1px solid var(--border)}
.panel{display:flex;flex-direction:column;gap:12px}
.moves-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);max-height:400px;overflow:auto}
.moves-grid{display:grid;grid-template-columns:38px 1fr 1fr;font-size:14px}
.moves-grid .mv-row{display:contents}
.mv-num{color:var(--text-3);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.mv{padding:6px 10px;font-weight:600;display:flex;align-items:center;gap:7px;border-radius:0;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-size:14px}
.mv:hover{background:var(--surface-2)}
.mv.cur{background:rgba(129,182,76,.16);box-shadow:inset 0 0 0 2px var(--green)}
.mv-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cls-best,.cls-brilliant,.cls-great{background:#26c2a3}.cls-excellent{background:#95bb4a}
.cls-good{background:#95bb4a}.cls-book{background:#a88865}.cls-inaccuracy{background:#f7c631}
.cls-mistake{background:#ffa459}.cls-blunder{background:#fa412d}.cls-q{background:#c8c6c4}
.cls-badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 13px;border-radius:8px;background:var(--surface-2)}
.cls-badge i{width:10px;height:10px;border-radius:50%}
.review-ctl{display:flex;gap:6px;justify-content:center}
.ctl{width:42px;height:42px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:15px;display:grid;place-items:center;cursor:pointer}
.ctl:hover{border-color:var(--green);color:var(--text)}
.ctl[disabled]{opacity:.4;cursor:default}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

/* cards for lists */
.gm-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:13.5px;cursor:pointer}
.gm-row:last-child{border-bottom:none}
.gm-row:hover{background:var(--surface-2)}
.res-win{color:var(--green);font-weight:700}.res-loss{color:#e0392a;font-weight:700}.res-draw{color:var(--text-2);font-weight:700}
.progress-wrap{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress-wrap i{display:block;height:100%;background:var(--green);transition:width .25s}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(129,182,76,.12);border:1px solid var(--green);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
.banner.warn{background:rgba(247,198,49,.13);border-color:#f7c631}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:16px}
.stat .label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--text-3)}

@media (max-width:980px){
  .game-grid{grid-template-columns:1fr}
  #board,#builder-board,#review-board{width:min(94vw,560px)}
}
@media (max-width:880px){
  .logo span.name{display:none}
  .tabs button{padding:0 10px;font-size:12.5px}
  .nav-chip{display:none}
  .pagewrap{padding:12px 12px 40px}
  #board{--bw:min(94vw,560px)}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat .value{font-size:20px}

@media (max-width:560px){
  .topnav{padding:0 8px;gap:2px}
  .tabs{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:0 11px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .pagewrap{padding:10px 10px 36px}
  .game-grid{gap:14px}
}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="topnav">
  <div class="logo"><span class="mark">♞</span><span class="name">ChessLab</span></div>
  <nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
  <div class="nav-right" id="nav-chips"></div>
<span class="ver-badge" title="ChessLab version">v2.6</span>
</header>
<main id="main" class="pagewrap" tabindex="-1"></main>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="chess.js"></script>
<script>
'use strict';
/* ChessLab v2 — chess.com-style UI + engine/logic overhaul
   (this script tag intentionally left minimal; layers follow in subsequent script blocks) */
</script>

<script>
'use strict';
/* =================== STORE + HELPERS =================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast'+(kind==='err'?' err':'');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),260); }, 2600);
}
function openModal(title, bodyHTML, onMount){
  const root = $('#modal-root');
  const previous = document.activeElement;
  // bodyHTML is reserved for trusted, static templates; never pass imported/user data here.
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body"></div></div></div>`;
  root.querySelector('.modal-body').innerHTML=String(bodyHTML||'');
  let closed = false;
  const close = ()=>{
    if(closed) return; closed = true;
    document.removeEventListener('keydown', keydown, true);
    root.innerHTML='';
    if(previous && typeof previous.focus === 'function' && document.contains(previous)) previous.focus();
  };
  const keydown = e=>{
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const focusable = [...root.querySelectorAll('button,input,textarea,select,[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled);
    if(!focusable.length) return;
    const first=focusable[0], last=focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  };
  root.querySelector('[data-close]').addEventListener('click', close);
  root.querySelector('.modal-backdrop').addEventListener('mousedown', e=>{ if(e.target.classList.contains('modal-backdrop')) close(); });
  document.addEventListener('keydown', keydown, true);
  if(onMount) onMount(root, close);
  const f = root.querySelector('input,textarea,button'); if(f) f.focus({preventScroll:true});
  return close;
}

/* Store — same localStorage key as v1 so analyzed games/settings survive the upgrade */
const STORAGE_VERSION = 3;
const DEFAULT_SETTINGS = { username:'IM_AshayRane', reviewMovetime:700, theme:'light', skill:8, color:'w', showEvalInReview:true, boardFlipped:false };
const SAFE_ID = /^[A-Za-z0-9_-]{1,96}$/;
const SAFE_UCI = /^[a-h][1-8][a-h][1-8][qrbn]?$/i;
const UNSAFE_OBJECT_KEYS = new Set(['__proto__','prototype','constructor','toString','valueOf','hasOwnProperty','isPrototypeOf','propertyIsEnumerable','toLocaleString']);
const CLASSES = new Set(['brilliant','great','best','excellent','good','book','inaccuracy','mistake','blunder','q','?']);
function defaultState(){
  return { version:STORAGE_VERSION, settings:{...DEFAULT_SETTINGS}, openingLines:[], analyzed:{}, playbook:null, practiceGames:[] };
}
function isRecord(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function boundedInt(v, min, max, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(min, Math.min(max, Math.round(n))) : fallback;
}
function boundedNumber(v, min, max, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
}
function safeString(v, max=500){ return typeof v === 'string' ? v.slice(0, max) : ''; }
function safeRecordKey(value, fallback='record'){
  const s=safeString(value,500).trim();
  return s && !UNSAFE_OBJECT_KEYS.has(s) ? s : fallback;
}
function normalizeEval(raw){
  if(!isRecord(raw)) return null;
  const out = {};
  // v1 used cpWhite/mate/bestUci; v2 uses the explicit best* names.
  const cp = raw.bestCpWhite ?? raw.cpWhite;
  const mate = raw.bestMateWhite ?? raw.mate;
  const best = raw.best ?? raw.bestUci;
  if(cp !== null && cp !== undefined) out.bestCpWhite = boundedNumber(cp, -100000, 100000, null);

      this.worker.postMessage('setoption name Threads value 1');

        best: bestUci,

        bestMateWhite: r1.mateWhite ?? null,
        bestPv: r1.pvUci || null,
        secondCpWhite: r2.cpWhite ?? null,
        secondPv: r2.pvUci || null,

  },
  /* Cancel only play-owned work; analysis requests remain queued. */
  cancelPlay(){
    if(this._cur && this._cur.play){
      this._stopCurrent(this._cur, null, null);
    }

  },
  /* For play: set Skill Level, then a single-PV search */
  playMove(fen, skill){
    return new Promise((resolve,reject)=>{
      this._queue.push({fen, movetime:900, resolve, reject, skill, play:true, kind:'play'});
      this._pump();
    });
  },

   Brilliant: best move + material sacrifice >= 2 pawns + not already winning. */

  if(!hist.length) throw new Error('No moves in game');
  const plies = [];
  for(let i=0;i<hist.length;i++){
    const m = hist[i];
    const fenBefore = rep.fen();
    const uci = sanToUci(rep, m.san);
    const mv = rep.moves({verbose:true}).find(x=>x.san===m.san);
    if(!uci || !mv) throw new Error('Could not replay PGN at move '+(i+1));
    rep.move({from:mv.from,to:mv.to,promotion:mv.promotion});
    pliesPush();
    function pliesPush(){
      plies.push({ i, san:m.san, uci, fenBefore, mover:m.color, moveNum:Math.floor(i/2)+1,
                   evalBefore:null, evalAfter:null, cls:'?', delta:null });
    }
  }
  // engine pass: analyse positions 0..N. A terminal final position is represented
  // explicitly so a checkmating move is never left as an unknown classification.
  const positions = plies.map(p=>p.fenBefore);
  positions.push(rep.fen());
  let done = 0;
  const results = new Array(positions.length).fill(null);
  for(let i=0;i<positions.length;i++){
    if(isCancelled()) throw new Error('cancelled');
    const terminal = new Chess(positions[i]);
    if(terminal.in_checkmate()){
      results[i] = {best:null, bestCpWhite:null, bestMateWhite:terminal.turn()==='w' ? -1 : 1};
    }else if(terminal.in_draw() || terminal.in_stalemate() || terminal.insufficient_material()){
      results[i] = {best:null, bestCpWhite:0, bestMateWhite:null};
    }else{
      results[i] = await Engine.analyse(positions[i], movetime, 2);
      if(!isEval(results[i])) throw new Error('Engine returned no evaluation for position '+(i+1));
    }
    onProgress(i+1, positions.length);
  }
  for(let i=0;i<plies.length;i++){
    const prevEval = results[i];
    const curEval = results[i+1];
    plies[i].evalBefore = prevEval;
    plies[i].evalAfter = curEval;
    if(prevEval && prevEval.best){
      const bs = uciToSan(plies[i].fenBefore, prevEval.best);
      if(!bs) throw new Error('Invalid best move at move '+(i+1));
      plies[i].bestSan = bs;
      plies[i].bestUci = prevEval.best;
    }
    if(isEval(prevEval) && isEval(curEval)){
      const c = classifyPly(plies[i], prevEval, curEval, plies[i].mover, plies[i].moveNum);
      Object.assign(plies[i], c);
      if(plies[i].cls === '?') throw new Error('Incomplete analysis at move '+(i+1));
      plies[i].evalAfterShown = { bestCpWhite:curEval.bestCpWhite, bestMateWhite:curEval.bestMateWhite };
    } else {
      throw new Error('Incomplete analysis at move '+(i+1));
    }
  }
  const summarize = color=>{
    const list = plies.filter(p=>p.mover===color && p.cls && p.cls!=='?');
    if(!list.length) return null;
    const acc = 100 - 5*list.reduce((a,p)=>a+Math.min(20,Math.max(0,p.delta||0)),0)/list.length;
    const count = c=>list.filter(p=>p.cls===c).length;
    return { accuracy:Math.round(acc*10)/10, moves:list.length,
      brilliant:count('brilliant'), great:count('great'), best:count('best'),
      excellent:count('excellent'), good:count('good'), book:count('book'),
      inaccuracy:count('inaccuracy'), mistake:count('mistake'), blunder:count('blunder') };
  };
  return {
    headers:{ White:headers.White, Black:headers.Black, WhiteElo:headers.WhiteElo, BlackElo:headers.BlackElo,
      Result:headers.Result, ECO:headers.ECO, Date:headers.Date, TimeControl:headers.TimeControl,
      Termination:headers.Termination, Link:headers.Link },
    plies, summary:{ white:summarize('w'), black:summarize('b') }, movetime,
  };
}

function pieceSVG(type, color){
  const geo = (PIECE_SVG2[type] || {})[color === 'w' ? 'w' : 'b'] || '';
  return '<svg viewBox="0 0 45 45" aria-hidden="true"><g class="' + (color==='w' ? 'pc-w' : 'pc-b') + '">' + geo + '</g></svg>';
}
function squareToXY(sq){ return { x:'abcdefgh'.indexOf(sq[0]), y: 8-(+sq[1]) }; }

const Board = {
  el:null, chess:null, flipped:false,
  pieces:new Map(),     // key -> {el, sq, type, color}
  selected:null,
  interactive:false, onUserMove:null, color:'w',
  lastMove:null, bestMove:null,
  init(el, chess, {color='w', interactive=false}={}){
    el.setAttribute('role','grid'); el.setAttribute('aria-label','Chess board'); el.setAttribute('aria-rowcount','8'); el.setAttribute('aria-colcount','8'); el.setAttribute('tabindex','0');
    const sameEl = this.el === el;
    if(!sameEl) this._teardownEvents();
    this.el = el;
    this.color = color;
    this.interactive = interactive;
    this.chess = chess;
    this.pieces.clear();
    el.innerHTML = '';  // wipe any previous board DOM (squares, overlays, pieces)
    this.selected = null;
    this.lastMove = null; this.bestMove = null;
    this._buildSquaresOnce();
    this._syncPieces(true);
    if(interactive) this._bindEvents();
  },
  _buildSquaresOnce(){
    // squares layer built once
    if(this.el.querySelector('.squares')) return;
    const layer = document.createElement('div');
    layer.className = 'squares';
    let html = '';
    for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
      const dark = (r+c2)%2===1;
      const file = 'abcdefgh'[c2], rank = 8-r;
      const sq = file+rank;
      layer.innerHTML += `<div class="sq ${dark?'d':'l'}" data-sq="${sq}" role="gridcell" aria-label="${sq}" tabindex="-1"></div>`;
    }
    this.el.appendChild(layer);
  },
  render(opts={}){
    this._buildSquaresOnce();
    if(opts.lastMove!==undefined) this.lastMove = opts.lastMove;
    if(opts.bestMove!==undefined) this.bestMove = opts.bestMove;
    this._syncPieces();
    this._renderOverlays();
  },
  /* diff current FEN against rendered pieces; animate differences */
  _syncPieces(instant=false){
    const board = this.chess.board();
    const wanted = [];
    for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
      const s = board[r][c2];
      if(s) wanted.push({ type:s.type, color:s.color, sq:'abcdefgh'[c2]+(8-r) });
    }
    const oldEntries = [...this.pieces.entries()];
    const usedOld = new Set();
    const matched = new Map();
    for(let wi=0; wi<wanted.length; wi++){
      const w = wanted[wi];
      let bestK=null, bestDist=Infinity;
      for(const [k, p] of oldEntries){
        if(usedOld.has(k)) continue;
        if(p.type!==w.type || p.color!==w.color) continue;
        const d = Math.abs('abcdefgh'.indexOf(p.sq[0])-'abcdefgh'.indexOf(w.sq[0])) + Math.abs((+p.sq[1])-(+w.sq[1]));
        if(d < bestDist){ bestDist=d; bestK=k; }
      }
      if(bestK!=null){ usedOld.add(bestK); matched.set(wi, bestK); }
    }
    for(const [wi, key] of matched){
      const w = wanted[wi];
      const p = this.pieces.get(key);
      this._applyTransform(p, w.sq, instant);
      p.sq = w.sq; p.type = w.type; p.color = w.color;
    }
    for(const [k, p] of oldEntries){
      if(usedOld.has(k)) continue;
      const el = p.el;
      el.classList.add('captured');
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
      this.pieces.delete(k);
    }
    for(let wi=0; wi<wanted.length; wi++){
      if(matched.has(wi)) continue;
      const w = wanted[wi];
      this._addPiece(w.type, w.color, w.sq, true);
    }
  },
  _applyTransform(p, sq, instant){
    const to = this._xy(sq);
    const target = 'translate('+(to.x*100)+'%,'+(to.y*100)+'%)';
    if(instant){
      p.el.style.transition='none';
      p.el.style.transform = target;
      void p.el.offsetWidth;
      p.el.style.transition='';
    } else if(p.el.style.transform !== target){
      p.el.classList.add('moving');
      p.el.style.transform = target;
      setTimeout(()=>p.el.classList.remove('moving'), 200);
    }
  },
  _positionStyle(sq){
    const { x, y } = this._xy(sq);
    return `transform:translate(${x*100}%,${y*100}%)`;
  },
  _xy(sq){
    const f = 'abcdefgh'.indexOf(sq[0]);
    const r = 8-(+sq[1]);
    return this.color==='b' ? {x:7-f, y:7-r} : {x:f, y:r};
  },
  _addPiece(type, color, sq, instant){
    const el = document.createElement('div');
    el.className = 'piece';
    el.innerHTML = pieceSVG(type, color);
    const {x,y} = this._xy(sq);
    if(instant){ el.style.transition='none'; }
    el.style.transform = 'translate('+(x*100)+'%,'+(y*100)+'%)';
    this.el.appendChild(el);
    if(instant){ void el.offsetWidth; el.style.transition=''; }
    const key = type+color+'_'+uid();
    this.pieces.set(key, {el, sq, type, color});
  },
  _movePiece(p, newSq){
    const from = this._xy(p.sq), to = this._xy(newSq);
    if(from.x===to.x && from.y===to.y) return;
    p.el.classList.add('moving');
    p.el.style.transform = `translate(${to.x*100}%, ${to.y*100}%)`;
    setTimeout(()=>p.el.classList.remove('moving'), 180);
  },
  _renderOverlays(){
    let layer = this.el.querySelector('.overlay');
    if(!layer){
      layer = document.createElement('div');
      layer.className = 'overlay';
      layer.style.cssText = 'position:absolute;inset:0;z-index:6;pointer-events:none;';
      this.el.appendChild(layer);
    }
    let html = '';
    this.el.querySelectorAll('.sq').forEach(sqEl=>sqEl.removeAttribute('aria-selected'));
    if(this.lastMove){
      for(const sq of [this.lastMove.from, this.lastMove.to]){
        const {x,y} = this._xy(sq);
        html += `<div class="hl" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
      }
    }
    if(this.selected){
      const {x,y} = this._xy(this.selected);
      html += `<div class="hl-sel" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
      const selectedEl=this.el.querySelector(`.sq[data-sq="${this.selected}"]`);
      if(selectedEl) selectedEl.setAttribute('aria-selected','true');
    }
    if(this.selected){
      for(const m of this.chess.moves({square:this.selected, verbose:true})){
        const {x,y} = this._xy(m.to);
        const occ = this.chess.get(m.to);
        html += occ ? `<div class="hint-ring" style="position:absolute;left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%;border-radius:50%;border:calc(var(--bw)/70) solid rgba(20,20,10,.3);box-sizing:border-box"></div>`
                    : `<div class="hint-dot" style="left:${(x)*12.5}%;top:${(y)*12.5}%;width:12.5%;height:12.5%;position:absolute"></div>`;
      }
    }
    // check highlight
    if(this.chess.in_check()){
      const b = this.chess.board();
      for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
        const s=b[r][c2];
        if(s && s.type==='k' && s.color===this.chess.turn()){
          const {x,y} = this._xy('abcdefgh'[c2]+(8-r));
          html += `<div class="hl-check" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
        }
      }
    }
    layer.innerHTML = html;
    // best-move arrow layer
    let al = this.el.querySelector('.arrow-layer');
    if(!al){ al = document.createElementNS('http://www.w3.org/2000/svg','svg'); al.setAttribute('class','arrow-layer'); this.el.appendChild(al); }
    if(this.bestMove){
      const {x:x1,y:y1} = this._xy(this.bestMove.from);
      const {x:x2,y:y2} = this._xy(this.bestMove.to);
      const S=12.5, cx1=x1*S+S/2, cy1=y1*S+S/2, cx2=x2*S+S/2, cy2=y2*S+S/2;
      const dx=cx2-cx1, dy=cy2-cy1, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
      const sx=cx1+ux*S*0.32, sy=cy1+uy*S*0.32, ex=cx2-ux*S*0.3, ey=cy2-uy*S*0.3;
      al.setAttribute('viewBox','0 0 100 100'); al.setAttribute('preserveAspectRatio','none');
      al.innerHTML = `<defs><marker id="arw" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="rgba(129,182,76,.85)"/></marker></defs>
        <line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="rgba(129,182,76,.85)" stroke-width="1.6" marker-end="url(#arw)" stroke-linecap="round"/>`;
      al.style.display='';
    } else al.style.display='none';
  },
  _teardownEvents(){
    if(this._boundEl && this._handlers) for(const [type, fn, opts] of this._handlers) this._boundEl.removeEventListener(type, fn, opts);
    this._boundEl=null; this._eventsBound=false; this._handlers=null; this._keyboardHandler=null; this._drag=null;
  },
  _bindEvents(){
    if(this._eventsBound && this._boundEl === this.el) return;
    this._teardownEvents();
    this._eventsBound=true; this._boundEl=this.el;
    this._handlers=[];
    const listen=(type, fn, opts)=>{ this.el.addEventListener(type, fn, opts); this._handlers.push([type, fn, opts]); };
    this.el.setAttribute('tabindex','0');
    const keyboardHandler = e=>{
      if(!this.interactive || !this.selected) return;
      const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
      const d=dirs[e.key]; if(!d) return;
      e.preventDefault();
      const f='abcdefgh'.indexOf(this.selected[0]), r=+this.selected[1];
      const nf=Math.max(0,Math.min(7,f+d[0])), nr=Math.max(1,Math.min(8,r+d[1]));
      this._onSquare('abcdefgh'[nf]+nr);
    };
    this._keyboardHandler=keyboardHandler;
    this._handlers.push(['keydown',keyboardHandler,undefined]);
    const sqFromEvent = e=>{
      const rect = this.el.getBoundingClientRect();
      const x = Math.floor((e.clientX-rect.left)/rect.width*8);
      const y = Math.floor((e.clientY-rect.top)/rect.height*8);
      if(x<0||x>7||y<0||y>7) return null;
      const f = this.color==='b' ? 'hgfedcba'[x] : 'abcdefgh'[x];
      const r = this.color==='b' ? y+1 : 8-y;
      return f+r;
    };
    this._sqFromEvent = sqFromEvent;
    listen('click', e=>{
      if(!this.interactive) return;
      if(this._suppressClick && Date.now()-this._suppressClick < 150) return;
      try{
        const sq = sqFromEvent(e);
        if(!sq) return;
        this._onSquare(sq);
      }catch(err){ this._reportErr(err); }
    });
    /* ---- drag & drop ---- */
    listen('pointerdown', e=>{
      if(!this.interactive || this._drag) return;
      if(e.button!==undefined && e.button!==0 && e.pointerType==='mouse') return;
      try{
        const sq = sqFromEvent(e);
        if(!sq) return;
        const s = this.chess.get(sq);
        if(!s || s.color!==this.chess.turn()) return;   // drag only own, side-to-move pieces
        let pieceEl = null;
        for(const p of this.pieces.values()){ if(p.sq===sq){ pieceEl = p.el; break; } }
        if(!pieceEl) return;
        this._drag = { from:sq, el:pieceEl, sx:e.clientX, sy:e.clientY, moved:false };
        this.selected = sq;               // show legal-move dots while dragging
        try{ this.el.setPointerCapture(e.pointerId); }catch(err){}
        pieceEl.style.transition='none';
        pieceEl.style.zIndex='40';
        this._renderOverlays();
      }catch(err){ this._reportErr(err); }
    });
    listen('pointermove', e=>{
      if(!this._drag) return;
      try{
        const rect = this.el.getBoundingClientRect();
        const size = rect.width/8;
        const px = e.clientX - rect.left - size/2;
        const py = e.clientY - rect.top - size/2;
        if(Math.abs(e.clientX-this._drag.sx)>4 || Math.abs(e.clientY-this._drag.sy)>4) this._drag.moved = true;
        this._drag.el.style.transform = 'translate('+px+'px,'+py+'px)';
      }catch(err){}
    });
    const finishDrag = e=>{
      const d = this._drag; if(!d) return;
      this._drag = null;
      try{
        d.el.style.zIndex='';
        d.el.style.transition='';
        const sq = (e && sqFromEvent(e)) || null;
        if(d.moved && sq && sq!==d.from){
          this._suppressClick = Date.now();
          // seed BOTH selection stores — play view reads Board.selected, builder reads App.builder.selected
          this.selected = d.from;
          if(App.builder) App.builder.selected = d.from;
          this._onSquare(sq);           // view decides legality + plays
        }else{
          this.selected = null;
          if(App.builder) App.builder.selected = null;
          this.render();
        }
      }catch(err){ this._reportErr(err); }
    };
    listen('pointerup', finishDrag);
    listen('pointercancel', finishDrag);
  },
  _reportErr(err){
    try{
      let b = document.getElementById('err-banner');
      if(!b){
        b = document.createElement('div');
        b.id = 'err-banner';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b3261e;color:#fff;font:12px/1.4 system-ui;padding:8px 14px;white-space:pre-wrap';
        (document.body||document.documentElement).appendChild(b);
      }
      b.textContent = 'Board error: ' + (err && err.message ? err.message : err);
    }catch(e){}
  },
  _onSquare(sq){
    // external hook (view decides legality)
    const target=this.el && this.el.querySelector(`.sq[data-sq="${sq}"]`);
    if(target) target.focus({preventScroll:true});
    if(this.onSquare) this.onSquare(sq);
  },
};
</script>

<script>
'use strict';
/* =================== PLAY (continued) + BUILDER + REVIEW + PROGRESS + SETTINGS + WIRING =================== */

/* =================== REVIEW =================== */
const Review = {
  data:null, nav:0,
  open(rec){
    if(!rec || typeof rec.pgn!=='string' || !Array.isArray(rec.plies)){ toast('Could not load game','err'); return; }
    const g = new Chess();
    if(!g.load_pgn(rec.pgn,{sloppy:true}) || !Array.isArray(rec.plies) || rec.plies.length !== g.history({verbose:true}).length){ toast('Could not load game','err'); return; }
    const hist = g.history({verbose:true});
    for(let i=0;i<hist.length;i++){
      const p=rec.plies[i];
      if(!p || p.san!==hist[i].san || p.mover!==hist[i].color || !p.uci || sanToUci(new Chess(p.fenBefore),p.san)!==p.uci){ toast('Could not load game','err'); return; }
    }
    this.data = rec; this.chess = g; this.hist = hist; this.startFen = pgnStartFen(rec.pgn, g.header() || {});
    this.plys = rec.plies; this.summary = rec.summary || {}; this.headers = rec.headers || {};
    this.nav = 0; this.branch = null; this.flipped = false;
    App.view='review'; render();
  },
  positionAt(ply){
    const target=Math.max(0,Math.min(ply,this.hist.length));
    const g=new Chess(this.startFen || new Chess().fen()); let last=null;
    for(let i=0;i<target;i++){
      const vm=g.moves({verbose:true}).find(x=>x.san===this.hist[i].san);
      if(!vm) break;
      g.move({from:vm.from,to:vm.to,promotion:vm.promotion});
      last={from:vm.from,to:vm.to};
    }
    return {g,last};
  },
  boardAt(ply){
    if(this.branch && ply>=this.branch.basePly){
      const offset=ply-this.branch.basePly;
      if(offset<=this.branch.moves.length){
        const g=new Chess(this.branch.fen); let last=null;
        for(let i=0;i<offset;i++){ const u=this.branch.moves[i]; const vm=g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===u); if(vm){g.move({from:vm.from,to:vm.to,promotion:vm.promotion}); last={from:vm.from,to:vm.to};} }
        return {g,last};
      }
    }
    return this.positionAt(ply);
  },
  setPly(ply){
    this.nav=Math.max(0,Math.min(ply,this.hist.length));
    if(this.branch && this.nav!==this.branch.basePly+1) this.branch=null;
    render();
  },
  flip(){ this.flipped=!this.flipped; this.data && render(); },
  playBest(){
    if(this.branch && this.nav > this.branch.basePly) return false;
    const ply=this.plys[this.nav];
    if(!ply || !ply.bestUci || this.nav>=this.hist.length) return false;
    const {g}=this.positionAt(this.nav);
    const vm=g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===ply.bestUci);
    if(!vm) return false;
    const next=new Chess(g.fen()); next.move({from:vm.from,to:vm.to,promotion:vm.promotion});
    const nextHistory=next.history();
    const san=nextHistory[nextHistory.length-1];
    if(!san) return false;
    const mover=g.turn();
    this.branch={basePly:this.nav,fen:g.fen(),moves:[ply.bestUci],move:{san,uci:ply.bestUci,mover,moveNum:Math.floor(this.nav/2)+1}};
    this.nav=this.nav+1; render(); return true;
  },
};
function renderReview(){
  if(App.analyzing){
    const a = App.analyzing;
    return `<h1>Reviewing</h1>
      <div class="card card-pad mt-14" style="max-width:520px">
        <div style="display:flex;justify-content:space-between"><b>${esc(a.label)}</b><span class="small muted" id="ana-count">position ${a.done}/${a.total}</span></div>
        <div class="progress-wrap mt-8"><i style="width:${a.total?Math.round(a.done/a.total*100):0}%"></i></div>
        <button class="btn btn-danger btn-sm mt-14" data-act="cancel-analysis">Cancel</button>
      </div>`;
  }
  if(Review.data) return renderReviewReport();
  const imp = App.importState;
  let list='';
  if(imp.loading) list = '<div class="card card-pad muted">Loading your games...</div>';
  else if(imp.error) list = `<div class="banner warn">Could not load games: ${esc(imp.error)} — paste PGN still works.</div>`;
  else if(imp.games){
    const visibleGames = imp.games.filter(g=>imp.filter==='all'||g.time_class===imp.filter);
    const rows = visibleGames.map(gm=>{
      const color=myColorOf(gm); const opp=color==='w'?gm.black:gm.white; if(!opp) return '';
      const idx=imp.games.indexOf(gm);
      return `<label class="gm-row" style="cursor:default">
        <input type="checkbox" data-gm="${idx}" ${imp.selected.has(idx)?'checked':''}>
        <span class="small" style="width:12px;height:12px;border-radius:3px;background:${color==='w'?'#fff':'#312e2b'};border:1px solid var(--border)"></span>
        <span style="flex:1">vs <b>${esc(opp.username||'?')}</b> <span class="faint">(${esc(String(opp.rating||'?'))})</span></span>
        <span class="chip">${esc(gm.time_class||'unknown')}</span>
        ${gm.url && Object.prototype.hasOwnProperty.call(Store.state.analyzed,gm.url)?'<span class="chip">✓</span>':''}
      </label>`;
    }).join('');
    list = `<div class="card">
      <div style="display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap">
        <button class="icon-btn" data-act="prev-month" aria-label="Previous month">◀</button>
        <b>${esc(MONTH_NAMES[imp.month]||'')} ${esc(String(imp.year||''))}</b>
        <button class="icon-btn" data-act="next-month" aria-label="Next month">▶</button>
        <span style="flex:1"></span>
        <div class="seg">${['all','rapid','blitz','bullet'].map(f=>`<button data-tc="${f}" aria-pressed="${imp.filter===f}">${f}</button>`).join('')}</div>
      </div>
      ${visibleGames.length?rows:'<p class="muted small" style="padding:14px">No games this month.</p>'}
    </div>
    <div class="mt-14" style="display:flex;justify-content:space-between;align-items:center">
      <span class="small muted">${imp.selected.size} selected</span>
      <button class="btn btn-green" data-act="analyze-selected" ${imp.selected.size?'':'disabled'}>Analyze ${imp.selected.size||''} selected</button>
    </div>`;
  }
  else list = '';
  const analyzed = Object.values(Store.state.analyzed).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<h1>Game Review</h1>
    <p class="muted mt-8">Free automatic Stockfish review of your chess.com games — chess.com-style classifications, eval bar, best-move arrows.</p>
    <div class="row mt-14" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-green" data-act="load-games" ${Engine.ready?'':'disabled'}>Load my chess.com games</button>
      <button class="btn btn-ghost" data-act="paste-pgn">Paste PGN</button>
    </div>
    ${Engine.offline?'<div class="banner warn mt-14">Engine offline — paste-PGN analysis unavailable. Openings practice still works.</div>':''}
    <div class="mt-14">${list}</div>
    ${analyzed.length?`<div class="mt-20"><h2 style="font-size:16px">Analyzed games</h2><div class="card mt-8">
      ${analyzed.map(g=>`<div class="gm-row" data-act="open-analyzed" data-key="${esc(g.key)}">
        <span class="small faint">${esc(g.date||'')}</span>
        <span style="flex:1"><b>${esc((g.headers||{}).White||'?')}</b> vs <b>${esc((g.headers||{}).Black||'?')}</b> <span class="faint">${esc((g.headers||{}).ECO||'')}</span></span>
        <span class="chip">${g.summary? esc(String((g.summary.white&&g.summary.white.accuracy)||(g.summary.black&&g.summary.black.accuracy)||'?'))+'%' : ''}</span>
      </div>`).join('')}</div>`:''}`;
}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function myColorOf(gm){
  const u = Store.state.settings.username.toLowerCase();
  if(gm?.white && typeof gm.white.username==='string' && gm.white.username.toLowerCase()===u) return 'w';
  if(gm?.black && typeof gm.black.username==='string' && gm.black.username.toLowerCase()===u) return 'b';
  return null;
}
function myColorOfHeaders(h){
  const u = Store.state.settings.username.toLowerCase();
  const white=String(h?.White||'').toLowerCase(), black=String(h?.Black||'').toLowerCase();
  if(white===u) return 'w';
  if(black===u) return 'b';
  return null;
}
function renderReviewReport(){
  const R = Review;
  const ply = Math.min(R.nav, R.hist.length);
  const {g, last} = Review.boardAt(ply);
  const branchMove = R.branch && ply===R.branch.basePly+1 ? R.branch.move : null;
  const curPly = branchMove || (ply>0 ? R.plys[ply-1] : null);
  const nextPly = branchMove ? null : (ply<R.plys.length ? R.plys[ply] : null);
  const ev = nextPly ? nextPly.evalBefore : (curPly && curPly.evalAfter) || (R.plys[R.plys.length-1] ? R.plys[R.plys.length-1].evalAfter : null);
  const wp = ev && isEval(ev) ? wpWhiteOf({bestCpWhite:ev.bestCpWhite, bestMateWhite:ev.bestMateWhite}) : 50;
  const showEval = Store.state.settings.showEvalInReview !== false;
  const myColor = myColorOfHeaders(R.headers||{});
  const h = R.headers||{};
  const CLS_LABEL = {brilliant:'Brilliant',great:'Great',best:'Best',excellent:'Excellent',good:'Good',book:'Book',inaccuracy:'Inaccuracy',mistake:'Mistake',blunder:'Blunder',q:'?'};
  let detail = '<p class="small muted">Start position — use arrows or click a move.</p>';
  if(branchMove){
    detail = `<p class="small"><b>Best line:</b> ${branchMove.moveNum}${branchMove.mover==='w'?'.':'...'} ${esc(branchMove.san)}</p>`;
  }else if(curPly){
    const cls = curPly.cls||'q';
    detail = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="cls-badge"><i class="cls-dot cls-${cls}"></i>${CLS_LABEL[cls]||'?'}</span>
      <b>${curPly.moveNum}${curPly.mover==='w'?'.':'...'} ${esc(curPly.san)}</b></div>`;
    if(cls!=='?'){
      detail += `<p class="small muted mt-8">Best: <b>${esc(curPly.bestSan||'?')}</b>${curPly.bestUci===curPly.uci?' (this move)':''}</p>
        <p class="small">Eval: ${evalLabel(curPly.evalBefore)} → ${evalLabel(curPly.evalAfter)}</p>
        ${curPly.delta>0?`<p class="small" style="color:${curPly.delta>20?'var(--blun)':curPly.delta>10?'var(--mist)':'var(--inac)'}">You lost ${curPly.delta}% win chance</p>`:''}
        ${curPly.sacPawns>=2?`<p class="small faint">Material invested: ${curPly.sacPawns} pawns</p>`:''}`;
    }
  }
  const mySum = myColor && R.summary ? R.summary[myColor] : null;
  let rows='';
  for(let i=0;i<R.hist.length;i+=2){
    const a=R.plys[i], b2=R.plys[i+1];
    rows += `<div class="mv-row"><span class="mv-num">${i/2+1}</span>
      <button class="mv${ply===i+1?' cur':''}" data-ply="${i+1}"><span class="mv-dot cls-${a?a.cls:'q'}"></span>${esc(R.hist[i].san)}</button>

  }
  const res = (h.Result==='1-0')?(myColor==='w'?'Win':'Loss'):(h.Result==='0-1')?(myColor==='b'?'Win':'Loss'):'Draw';

  return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">

        <div class="board-row" style="display:flex;gap:10px">
        ${showEval?`<div class="evalbar" style="align-self:stretch"><i class="white" style="height:${wp}%"></i></div>`:''}

        <div class="review-ctl">
          <button class="ctl" data-act="nav-start" aria-label="Start">⏮</button>
          <button class="ctl" data-act="nav-prev" aria-label="Previous">◀</button>

          <button class="ctl" data-act="nav-end" aria-label="End">⏭</button>

      <button class="ctl" data-act="flip-review" aria-label="Flip board" title="Flip board">↕</button>
        </div>
      </div>
      <div class="panel">
        <div class="card card-pad">${detail}</div>
        <div class="moves-box" style="max-height:340px"><div class="moves-grid">${rows}</div></div>
        ${mySum?`<div class="card card-pad">
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="small muted">Your accuracy</span><b style="font-size:18px">${mySum.accuracy}%</b></div>
          <div class="legend mt-8">
            <span><i class="cls-brilliant"></i>${mySum.brilliant||0} Brilliant</span>
            <span><i class="cls-great"></i>${mySum.great||0} Great</span>
            <span><i class="cls-best"></i>${mySum.best||0} Best</span>
            <span><i class="cls-excellent"></i>${mySum.excellent||0} Excellent</span>
            <span><i class="cls-good"></i>${mySum.good||0} Good</span>
            <span><i class="cls-book"></i>${mySum.book||0} Book</span>
            <span><i class="cls-inaccuracy"></i>${mySum.inaccuracy||0} Inacc.</span>
            <span><i class="cls-mistake"></i>${mySum.mistake||0} Mist.</span>
            <span><i class="cls-blunder"></i>${mySum.blunder||0} Blunder</span>
          </div></div>`:''}
      </div>
    </div>`;
}
function renderProgress(){
  const games = Object.values(Store.state.analyzed);
  if(!games.length) return `<h1>Progress</h1><div class="card empty mt-14"><h3>Nothing to measure yet</h3><p>Analyze games in the Review tab — accuracy, blunder rate and weak openings appear here.</p></div>`;
  const rows = games.map(g=>{
    const c = myColorOfHeaders(g.headers||{});
    return {g, sum: c&&g.summary?g.summary[c]:null, date:g.date||''};
  }).filter(x=>x.sum).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!rows.length) return `<h1>Progress</h1><div class="card empty mt-14"><h3>Not your games</h3><p>Analyzed games are missing your username in headers.</p></div>`;
  const n = rows.length;
  const avg = Math.round(rows.reduce((a,x)=>a+x.sum.accuracy,0)/n);
  const bpg = rows.reduce((a,x)=>a+x.sum.blunder,0)/n;
  const mpg = rows.reduce((a,x)=>a+x.sum.mistake,0)/n;
  // weakness by ECO
  const groups={};
  for(const x of rows){
    let key = (x.g.headers||{}).ECO;
    if(!key) key = (x.g.plies? x.g.plies.slice(0,6).map(p=>p.san).join(' '):'') || '?';
    (groups[key] ||= {name:key,n:0,acc:0,b:0});
    groups[key].n++; groups[key].acc+=x.sum.accuracy; groups[key].b+=x.sum.blunder;
  }
  const weak = Object.values(groups).map(g=>({...g, avg:g.acc/g.n, bpg:g.b/g.n})).sort((a,b)=>a.avg-b.avg);
  const worst = weak[0];
  return `<h1>Progress</h1><p class="muted mt-8">${n} game${n===1?'':'s'} analyzed</p>
    <div class="stat-grid mt-14">
      <div class="card stat"><div class="label">Avg accuracy</div><div class="value">${avg}%</div></div>
      <div class="card stat"><div class="label">Blunders / game</div><div class="value">${bpg.toFixed(1)}</div><div class="sub">mistakes ${mpg.toFixed(1)}</div></div>
      <div class="card stat"><div class="label">Games</div><div class="value">${n}</div></div>
    </div>
    ${worst?`<div class="banner mt-14">Weakest opening: <b>${esc(worst.name)}</b> — ${worst.n} game(s) at ${Math.round(worst.avg)}% avg, ${worst.bpg.toFixed(1)} blunders/game <button class="btn btn-ghost btn-sm" data-act="go-openings">Practice openings</button></div>`:''}
    <div class="card mt-14" style="overflow:auto"><table class="tbl">
      <thead><tr><th>Opening</th><th>Games</th><th>Avg accuracy</th><th>Blunders/game</th></tr></thead>
      <tbody>${weak.map(w=>`<tr><td><b>${esc(w.name)}</b></td><td>${w.n}</td><td>${Math.round(w.avg)}%</td><td>${w.bpg.toFixed(1)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

  return `<h1>Settings</h1>
    <div class="mt-14" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
      <div class="card card-pad">

          <input type="range" id="s-mt" min="200" max="2000" step="100" value="${s.reviewMovetime}" style="width:100%;accent-color:var(--green)">
          <span class="small muted">Fast (300 ms) reviews a 60-ply game in about 30 seconds. Higher = more accurate.</span></div>

        <div class="field"><label>Board orientation</label><select class="input" data-setting="boardFlipped"><option value="0" ${!s.boardFlipped?'selected':''}>White at bottom</option><option value="1" ${s.boardFlipped?'selected':''}>Black at bottom</option></select></div>
      </div>
      <div class="card card-pad">
        <h2 style="font-size:15px;margin-bottom:12px">Data</h2>
        <p class="small muted mb-8">${Object.keys(Store.state.analyzed).length} analyzed games · ${Store.state.openingLines.length} saved lines</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" data-act="export">Export</button>
          <button class="btn btn-ghost btn-sm" data-act="import-json">Import</button>
          <button class="btn btn-danger btn-sm" data-act="reset-data">Clear all</button>

      </div>

    <div class="mt-20"><button class="btn btn-green" data-act="save-settings">Save</button></div>`;

</script>
<script>
'use strict';
/* =================== WIRING + BOOT =================== */
function sanitizeMoves(text){
  let s = String(text||'');
  s = s.replace(/\{[^}]*\}/g,' ').replace(/\([^)]*\)/g,' ').replace(/;[^\n]*/g,' ').replace(/\$\d+/g,' ');
  s = s.replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g,' ');
  s = s.replace(/\d+\s*\.{1,3}(\.\.)?/g,' ');
  return s.split(/[\s,]+/).filter(t=>t && /^[a-zA-Z0-9+#=\-]+$/.test(t));
}
/* ---- board mounting helpers ---- */
function mountPlayBoard(){
  const S=Play.session;
  const el = $('#board');
  if(!el || !S) return;
  Board.init(el, S.chess, { color: S.flipped ? (S.color==='w'?'b':'w') : S.color, interactive:true });
  const hist = S.chess.history({verbose:true});
  Board.render({ lastMove: hist.length? {from:hist[hist.length-1].from,to:hist[hist.length-1].to}:null });
  Board.onSquare = null;
  Board._onSquare = function(sq){
    const current = Play.session;
    if(!current || current.finished || Play._thinking) return;
    if(current.chess.turn()!==current.color) return;
    if(Board.selected){
      const mv = current.chess.moves({verbose:true}).find(m=>m.from===Board.selected && m.to===sq);
      if(mv){
        Play.userPlay(Board.selected, sq);
        Board.selected = null;
        mountPlayBoard();
        return;
      }
    }
    const own = current.chess.moves({verbose:true}).some(m=>m.from===sq);
    Board.selected = own? sq : null;
    Board.render();
  };
  updatePlayPanels();
}
function mountBuilderBoard(){
  const el = $('#builder-board');
  if(!el) return;
  if(!App.builder) App.builder = {chess:new Chess(), name:''};
  restorePlaybook();
  const B = App.builder;
  Board.init(el, B.chess, { color: Store.state.settings.boardFlipped ? 'b' : 'w', interactive:true });
  Board.render();
  Board.onSquare = null;
  Board._onSquare = function(sq){
    const B = App.builder;
    if(B.selected){
      const mv = B.chess.moves({verbose:true}).find(m=>m.from===B.selected && m.to===sq);
      if(mv){
        B.chess.move({from:B.selected, to:sq, promotion:mv.promotion});
        B.selected=null;
        Board.selected=null;
        Board.render({lastMove:{from:mv.from,to:mv.to}});
        savePlaybook();
        refreshBuilderUI();
        return;
      }
    }
    const own = B.chess.moves({verbose:true}).some(m=>m.from===sq);
    B.selected = own? sq : null;
    Board.selected = B.selected;   // drives the yellow highlight + legal-move dots
    Board.render();
  };
  updateBuilderPanels();
}
function updateBuilderPanels(){
  const B = App.builder;
  const cnt = $('#bb-count'); if(cnt && B) cnt.textContent = B.chess.history().length;
}
function refreshBuilderUI(){
  updateBuilderPanels();
  if(App.view==='openings') render();   // refreshes moves grid + lines list; render re-mounts the board
}
function mountReviewBoard(){
  const el = $('#review-board');
  if(!el || !Review.data) return;
  const ply = Math.min(Review.nav, Review.hist.length);
  const {g} = Review.boardAt(ply);
  const myColor = myColorOfHeaders(Review.headers||{});
  Board.init(el, g, { color: Review.flipped ? (myColor==='b'?'w':'b') : (myColor||'w'), interactive:false });
    const nextPly = Review.plys[ply];
    if(nextPly && nextPly.bestUci){
      Board.render({ bestMove: {from:nextPly.bestUci.slice(0,2), to:nextPly.bestUci.slice(2,4)} });
    } else Board.render();
  }

/* =================== VIEW BINDING =================== */
function refreshAccountChip(){
  const chip = $('#chip-account'); if(!chip) return;
  const username=Store.state.settings.username;
  const requestId=++App.accountRequestId;
  chip.textContent = username;
  Importer.stats(username).then(j=>{
    if(requestId!==App.accountRequestId || Store.state.settings.username!==username) return;
    if(!j) return;
    const r = j.chess_rapid;
    if(r && r.last && r.best && $('#chip-account')){
      const current=$('#chip-account'); current.textContent='';
      const dot=document.createElement('span'); dot.className='dot ok'; current.appendChild(dot);
      current.appendChild(document.createTextNode(username+' · '+String(r.last.rating)+' rapid (peak '+String(r.best.rating)+')'));
    }
  }).catch(()=>{});
}
function bindView(){
  const view = $('#main .view') || $('#main');
  // top chips
  const chips = $('#nav-chips');
  if(!$('#chip-engine')){
    chips.innerHTML = `<span class="nav-chip" id="chip-engine"><span class="dot warn"></span>Engine: ${Engine.status}</span>
      <span class="nav-chip" id="chip-account">${esc(Store.state.settings.username)}</span>`;
    App.onEngineStatus(); refreshAccountChip();
  }
  /* tabs are outside #main: direct listeners */
  $$('#tabs button').forEach(b=>{ if(!b._bound){ b._bound=true; b.addEventListener('click',()=>go(b.dataset.view)); } });

  view.addEventListener('click', e=>{
    const t = e.target.closest('button[data-theme]');
    if(t){ Store.state.settings.theme = t.dataset.theme; Store.save(); applyTheme(); render(); return; }
    const pc = e.target.closest('[data-pcolor]');
    if(pc){ Store.state.settings.color = pc.dataset.pcolor; Store.save(); render(); return; }
    const tc = e.target.closest('[data-tc]');
    if(tc){ App.importState.filter=tc.dataset.tc; App.importState.selected.clear(); render(); return; }
    const mvBtn = e.target.closest('[data-ply]');
    if(mvBtn && App.view==='review' && Review.data){ Review.setPly(+mvBtn.dataset.ply); return; }
    const gm = e.target.closest('input[data-gm]');
    if(gm){ const i=+gm.dataset.gm; if(gm.checked) App.importState.selected.add(i); else App.importState.selected.delete(i);
      const btn = document.querySelector('[data-act="analyze-selected"]');
      if(btn){ btn.textContent = 'Analyze '+App.importState.selected.size+' selected'; btn.disabled = !App.importState.selected.size; }
      return; }
    const act = e.target.closest('[data-act]');
    if(act) handleAction(act, e);
  });
  view.addEventListener('input', e=>{
    const t=e.target;
    if(t.id==='bb-name'){ if(App.builder) App.builder.name = t.value; savePlaybook(); }
    if(t.id==='s-mt'){ $('#s-mt-lab').textContent = t.value+' ms'; Store.state.settings.reviewMovetime=+t.value; Store.save(); }
    if(t.id==='s-skill'){ Store.state.settings.skill=+t.value; Store.save(); }
    if(t.id==='pf-skill'){ const lab=$('#pf-skill-lab'); if(lab) lab.textContent=skillLabel(+t.value); }
    if(t.matches && t.matches('[data-setting]')){
      const key=t.dataset.setting;
      if(key==='boardFlipped') Store.state.settings[key]=t.value==='1';
      else if(key==='showEvalInReview') Store.state.settings[key]=t.checked;
      Store.save();
    }
  });
  if(document && !document._kb){
    document._kb = true;
    document.addEventListener('keydown', e=>{
      if(App.view!=='review'||!Review.data) return;
      if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const h = Review.hist.length;
      if(e.key==='ArrowRight'){ e.preventDefault(); Review.setPly(Review.nav+1); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); Review.setPly(Review.nav-1); }
      if(e.key==='Home'){ e.preventDefault(); Review.setPly(0); }
      if(e.key==='End'){ e.preventDefault(); Review.setPly(h); }
    });
  }
}
/* =================== ACTIONS =================== */
function handleAction(t, e){
  const act = t.dataset.act;
  switch(act){
    case 'start-play': {
      const line = $('#pf-line') ? $('#pf-line').value : '';
      const pfSkill = $('#pf-skill');
      const skill = pfSkill ? Math.max(0, Math.min(20, +pfSkill.value || 0)) : Store.state.settings.skill;
      Play.start({ color:Store.state.settings.color, skill, lineMoves:line });
      break;
    }
    case 'new-game': Play.cancel(); go('play'); break;
    case 'flip-board': {
      const S=Play.session;
      if(S){
        S.flipped=!S.flipped;
        Board.color=S.flipped ? (S.color==='w'?'b':'w') : S.color;
        Board.render();
        const label=document.querySelector('[data-act="flip-board"]');
        if(label) label.setAttribute('aria-pressed',String(S.flipped));
      }
      break;
    }
    case 'end-play': {
      const S=Play.session;
      if(S&&!S.finished) Play.finishSession(S,'loss','resignation');
      break;
    }
    case 'review-play': {
      const S=Play.session;
      if(S&&S.pgn) runAnalysis([{url:null, pgn:S.pgn, time_class:'practice'}], {jumpTo:true});
      else toast('Finish or resign the game before reviewing it','err');
      break;
    }
    case 'bb-undo': { const B=App.builder; if(B){ B.chess.undo(); Board.selected=null; B.selected=null; savePlaybook(); refreshBuilderUI(); } break; }
    case 'bb-seek': {
      const B=App.builder; const target=+t.dataset.ply;
      if(B){ while(B.chess.history().length >= target && B.chess.history().length>0) B.chess.undo();
        B.selected=null; Board.selected=null; savePlaybook(); refreshBuilderUI(); }
      break;
    }
    case 'bb-flip': { Store.state.settings.boardFlipped=!Store.state.settings.boardFlipped; Store.save(); refreshBuilderUI(); break; }
    case 'bb-clear': { const B=App.builder; if(B){ B.chess=new Chess(); B.selected=null; Board.selected=null; Store.state.playbook=null; Store.save(); refreshBuilderUI(); } break; }
    case 'bb-save': saveBuilderLine(); break;
    case 'bb-practice': practiceFromChess(); break;
    case 'practice-line': {
      const line = Store.state.openingLines.find(l=>l.id===t.dataset.id);
      if(line){ Play.start({color:Store.state.settings.color, skill:Store.state.settings.skill, lineName:line.name, lineFen:line.fen, lineMoves:line.moves}); }
      break;
    }
    case 'del-line': {
      Store.state.openingLines = Store.state.openingLines.filter(l=>l.id!==t.dataset.id);
      Store.save(); render(); toast('Line deleted');
      break;
    }
    case 'load-games': {
      const now=new Date();
      const requestId = ++App.importRequestId;
    if(App.importAbort) App.importAbort.abort();
    const controller = new AbortController(); App.importAbort = controller;
    App.importState = {year:now.getFullYear(), month:now.getMonth(), games:null, filter:'all', selected:new Set(), loading:true, error:null, requestId};
    render();
    Importer.month(Store.state.settings.username, App.importState.year, App.importState.month, controller.signal)
      .then(g=>{ if(App.importState.requestId!==requestId) return; App.importState.games=g; App.importState.loading=false; render(); })
      .catch(err=>{ if(err.name==='AbortError' || App.importState.requestId!==requestId) return; App.importState.loading=false; App.importState.error=err.message||String(err); render(); });
      break;
    }
    case 'prev-month': case 'next-month': {
      const imp=App.importState;
      let {year,month}=imp;
      month += act==='prev-month'?-1:1;
      if(month<0){month=11;year--;} if(month>11){month=0;year++;}
      Object.assign(imp,{year,month,games:null,loading:true,selected:new Set(),error:null});
      const requestId=++App.importRequestId;
      if(App.importAbort) App.importAbort.abort();
      const controller=new AbortController(); App.importAbort=controller; imp.requestId=requestId;
      render();
      Importer.month(Store.state.settings.username, year, month, controller.signal)
        .then(g=>{ if(imp.requestId!==requestId) return; imp.games=g; imp.loading=false; render(); })
        .catch(err=>{ if(err.name==='AbortError' || imp.requestId!==requestId) return; imp.loading=false; imp.error=err.message||String(err); render(); });
      break;
    }
    case 'analyze-selected': {
      const imp=App.importState;
      const picked=[...imp.selected].map(i=>imp.games[i]).filter(Boolean);
      if(picked.length) runAnalysis(picked, {});
      break;
    }
    case 'paste-pgn': openPasteModal(); break;
    case 'open-analyzed': {
      const key = String(t.dataset.key||'');
      const rec = key && Object.prototype.hasOwnProperty.call(Store.state.analyzed,key) ? Store.state.analyzed[key] : null;
      if(rec) Review.open(rec);
      break;
    }
    case 'back-list': Review.data=null; go('review'); break;
    case 'nav-start': if(Review.data) Review.setPly(0); break;
    case 'nav-end': if(Review.data) Review.setPly(Review.hist.length); break;
    case 'nav-prev': if(Review.data) Review.setPly(Review.nav-1); break;
    case 'nav-next': if(Review.data) Review.setPly(Review.nav+1); break;
    case 'play-best': if(Review.data && !Review.playBest()) toast('No legal best move at this position','err'); break;
    case 'flip-review': if(Review.data) Review.flip(); break;
    case 'cancel-analysis': App.analysisCancelled = true; break;
    case 'save-settings': {
      const u = $('#s-user').value.trim();
      if(u){ Store.state.settings.username=u; Store.save(); refreshAccountChip(); toast('Saved'); }
      break;
    }
    case 'export': {
      const blob=new Blob([JSON.stringify(Store.state,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='chesslab-export.json'; a.click();
      URL.revokeObjectURL(a.href); toast('Exported');
      break;
    }
    case 'import-json': {
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
        const r=new FileReader();
        r.onload=()=>{ try{
          const d=validateState(JSON.parse(r.result), {strict:true});
          Store.state=d; Store.save({immediate:true}); applyTheme(); render(); toast('Imported');
        }
          catch(e){ toast('Invalid file','err'); } };
        r.readAsText(f); };
      inp.click(); break;
    }
    case 'reset-data': {
      openModal('Clear all data?','<p class="muted">Deletes analyzed games, saved lines and settings.</p>',(root,close)=>{
        root.querySelector('.modal-body').insertAdjacentHTML('beforeend','<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-ghost btn-sm" data-x>Cancel</button><button class="btn btn-danger btn-sm" id="do-reset">Delete everything</button></div>');

        root.querySelector('#do-reset').addEventListener('click',()=>{ Store.reset(); close(); applyTheme(); render(); toast('All data cleared'); });
      });
      break;
    }
    case 'go-openings': go('openings'); break;
  }
}

/* =================== ANALYSIS RUNNER =================== */
async function runAnalysis(list, {jumpTo=false}={}){
  if(!Engine.ready){ toast('Engine not ready yet','err'); return; }
  App.analysisCancelled = false;
  const mt = Store.state.settings.reviewMovetime;
  for(const gm of list){
    if(!gm || typeof gm.pgn!=='string' || !gm.pgn.trim()){ toast('Invalid game data','err'); return; }
    const rawKey = typeof gm.url==='string' ? gm.url : '';
    const fallbackKey = 'pgn:'+hashStr(gm.pgn);
    const key = safeRecordKey(rawKey || fallbackKey, fallbackKey);
    const white = gm.white && typeof gm.white.username==='string' ? gm.white.username : 'Unknown';
    const black = gm.black && typeof gm.black.username==='string' ? gm.black.username : 'Unknown';
    const label = gm.white || gm.black ? white+' vs '+black : 'Pasted game';
    const rawDate = Number(gm.end_time);
    const date = Number.isFinite(rawDate) && Math.abs(rawDate) <= 8640000000000
      ? new Date(rawDate*1000).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
    App.analyzing = {label, done:0, total:1};
    App.view='review'; render();
    try{
        const res = await analyzeGame(gm.pgn, {
      movetime: mt,
      onProgress:(d,tot)=>{ if(!App.analyzing) return; App.analyzing.done=d; App.analyzing.total=tot;
        const bar=document.querySelector('.progress-wrap i'); if(bar) bar.style.width=Math.round(d/tot*100)+'%';
        const lbl=document.querySelector('#ana-count'); if(lbl) lbl.textContent='position '+d+'/'+tot; },
        isCancelled:()=>App.analysisCancelled,
      });
      const normalized = validateState({settings:Store.state.settings, analyzed:{[key]:{ key, url:rawKey||null, pgn:gm.pgn,
                date, headers:res.headers, plies:res.plies, summary:res.summary, movetime:mt }}}, {strict:true}).analyzed[key];
      if(!normalized) throw new Error('Analysis record failed validation');
      Store.state.analyzed[key] = normalized;
      Store.save();
      App.analyzing=null;
      if(jumpTo){ Review.open(Store.state.analyzed[key]); }
      else render();
    }catch(err){
      App.analyzing=null;
      if(String(err.message)==='cancelled'){ toast('Analysis cancelled'); render(); return; }
      toast('Analysis failed: '+err.message,'err');
      render();
    }
  }
}

/* =================== IMPORTER =================== */
const Importer = {
  async _get(url, signal){
    const attempts = [
      ()=>fetch(url, {headers:{'Accept':'application/json'}, signal}),
      ()=>fetch('https://corsproxy.io/?'+encodeURIComponent(url), {signal}),
      ()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url), {signal}),
    ];
    let lastErr;
    for(const a of attempts){
      try{ const r = await a(); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
      catch(e){ lastErr=e; if(e && e.name==='AbortError') throw e; }
    }
    throw lastErr||new Error('network error');
  },
  month(u,y,m,signal){ return this._get(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/games/${y}/${String(m+1).padStart(2,'0')}`, signal).then(j=>Array.isArray(j.games)?j.games:[]); },
  stats(u){ return this._get(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/stats`).catch(()=>null); },
};

  importRequestId:0, importAbort:null, accountRequestId:0,

      chip.innerHTML = '<span class="dot '+cls+'"></span>Engine: '+Engine.status;
    }
  },
};
const Play = {
  session:null, _thinking:false, _generation:0,
  cancel(){
    this._generation++;
    Engine.cancelPlay();
    this._thinking=false;
    if(this.session) this.session.cancelled=true;
    this.session=null;
  },
  start({color, skill, lineName, lineFen, lineMoves}){
    let chess;
    try{ chess = lineFen? new Chess(lineFen) : new Chess(); }
    catch(e){ toast('Invalid start position','err'); return; }
    const tokens = sanitizeMoves(lineMoves||'');
    let err=null; const lineUci=[];
    for(const tok of tokens){
      let mv=null;
      try{ mv = chess.move(tok); }catch(e){}
      if(!mv && /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(tok)){
        mv = chess.move({from:tok.slice(0,2), to:tok.slice(2,4), promotion:tok[4]||undefined});
      }
      if(!mv){ err = 'Move "'+tok+'" is not legal in this position.'; break; }
      lineUci.push(mv.from+mv.to+(mv.promotion||''));
    }
    if(err){ toast(err,'err'); return; }
    const generation=++this._generation;
    this.session = { id:uid(), generation, chess, color:color==='b'?'b':'w', skill:Math.max(0,Math.min(20,+skill||0)), lineName:lineName||null, lineUci, lineErr:err, finished:false, cancelled:false, result:null, termination:null, pgn:null, flipped:false };
    this._thinking=false;
    this.checkEnd(this.session);
    App.view='play'; render();
    if(!this.session.finished) this.engineTurn();
  },
  _valid(S){ return !!(S && this.session===S && S.generation===this._generation && !S.cancelled); },
  engineTurn(){
    const S=this.session;
    if(!this._valid(S) || S.finished || S.chess.turn()===S.color) return;
    const ply = S.chess.history().length;
    if(ply < S.lineUci.length){
      const scripted = S.lineUci[ply];
      const legal = S.chess.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===scripted);
      if(legal){
        const generation=S.generation;
        this._thinking=true; updatePlayPanels();
        setTimeout(()=>{ if(this._valid(S) && S.generation===generation){ this._thinking=false; this._apply(scripted); } }, 350);
        return;
      }
    }
    this._thinking = true; updatePlayPanels();
    const generation=S.generation;
    Engine.playMove(S.chess.fen(), S.skill).then(uci=>{
      if(!this._valid(S) || S.generation!==generation) return;
      this._thinking=false;
      if(uci){ this._apply(uci); return; }
      const ms = S.chess.moves({verbose:true});
      if(ms.length){
        const caps = ms.filter(m=>m.captured);
        const pick = (caps.length && Math.random()<0.7) ? caps[Math.floor(Math.random()*caps.length)] : ms[Math.floor(Math.random()*ms.length)];
        this._apply(pick.from+pick.to+(pick.promotion||''));
      } else updatePlayPanels();
    }).catch(()=>{
      if(!this._valid(S) || S.generation!==generation) return;
      const ms=S.chess.moves({verbose:true}).filter(m=>m && m.from && m.to);
      if(ms.length){
        const captures=ms.filter(m=>S.chess.isAttacked(m.to,m.color));
        const pool=captures.length?captures:ms;
        const pick=pool[Math.floor(Math.random()*pool.length)];
        this._apply(pick.from+pick.to+(pick.promotion||''));
      } else { this._thinking=false; updatePlayPanels(); }
    });
  },
  _apply(uci){
    const S=this.session;
    if(!this._valid(S) || S.finished) return;
    this._thinking=false;
    let mv = S.chess.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===uci);
    if(!mv){
      const legal=S.chess.moves({verbose:true});
      const caps=legal.filter(m=>m && m.from && m.to && m.captured);
      const pool=caps.length && Math.random()<0.7 ? caps : legal;
      mv=pool[Math.floor(Math.random()*pool.length)];
    }
    if(!mv){ this.checkEnd(S); this.renderBoard(); return; }
    try{ S.chess.move({from:mv.from,to:mv.to,promotion:mv.promotion}); }catch(e){ return; }
    this.checkEnd(S);
    this.renderBoard();
    if(!S.finished) this.engineTurn();
  },
  userPlay(from,to){
    const S=this.session;
    if(!this._valid(S) || S.finished || this._thinking) return false;
    if(S.chess.turn()!==S.color) return false;
    const mv = S.chess.moves({verbose:true}).find(m=>m.from===from&&m.to===to);
    if(!mv) return false;
    S.chess.move({from,to,promotion:mv.promotion});
    this.checkEnd(S);
    this.renderBoard();
    if(!S.finished) this.engineTurn();
    return true;
  },
  finishSession(S, result, termination='normal'){
    if(!S || S.finished) return false;
    const g=S.chess;
    S.finished=true; S.result=result; S.termination=termination;
    const resultMarker = result==='draw' ? '1/2-1/2' : (result==='win' ? (S.color==='w'?'1-0':'0-1') : (S.color==='w'?'0-1':'1-0'));
    g.header('Event','ChessLab','White', S.color==='w'?'You':'Stockfish ('+S.skill+')',
      'Black', S.color==='b'?'You':'Stockfish ('+S.skill+')',
      'Date', new Date().toISOString().slice(0,10).replace(/-/g,'.'),
      'Termination', termination, 'Result', resultMarker);
    S.pgn=g.pgn(); savePlayGameLocal(S); this._thinking=false; updatePlayPanels();
    return true;
  },
  checkEnd(S){
    const g=S.chess;
    if(g.in_checkmate()) this.finishSession(S, g.turn()===S.color?'loss':'win', 'checkmate');
    else if(g.in_draw()||g.in_stalemate()||g.in_threefold_repetition()||g.insufficient_material()) this.finishSession(S, 'draw', g.in_stalemate()?'stalemate':g.insufficient_material()?'insufficient material':g.in_threefold_repetition()?'threefold repetition':'draw');
  },
  renderBoard(){
    const b=document.getElementById('board');
    if(!b||!this.session) return;
    const hist=this.session.chess.history({verbose:true});
    const last = hist.length? {from:hist[hist.length-1].from,to:hist[hist.length-1].to} : null;
    Board.render({lastMove:last}); updatePlayPanels();
  },
};

    '<div class="card card-pad"><div class="field"><label for="bb-name">Line name</label>'+
    '<input class="input" id="bb-name" placeholder="e.g. My Alapin setup" value="'+esc(B.name||'')+'"></div>'+
    '<div class="small muted">Moves: <b id="bb-count">'+B.chess.history().length+'</b> plies</div></div>'+
    '<div class="moves-box" style="max-height:240px"><div class="moves-grid">'+(rows||'<p class="small muted" style="grid-column:1/-1;padding:12px">Play moves on the board to build your line.</p>')+'</div></div>'+
    linesHTML+
    '</div></div>';
}
</script>
<script>boot();</script>
</body>
</html>
