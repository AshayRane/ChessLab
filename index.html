function pieceSVG(type, color){
  const geo = (PIECE_SVG2[type] || {})[color === 'w' ? 'w' : 'b'] || '';
  return '<svg viewBox="0 0 45 45" aria-hidden="true"><g class="' + (color==='w' ? 'pc-w' : 'pc-b') + '">' + geo + '</g></svg>';
}
function squareToXY(sq){ return { x:'abcdefgh'.indexOf(sq[0]), y: 8-(+sq[1]) }; }

const Board = {
  el:null, chess:null, flipped:false,
  pieces:new Map(),     // key -> {el, sq, type, color}
  selected:null,
  focusSquare:null,
  interactive:false, onUserMove:null, color:'w',
  lastMove:null, bestMove:null, arrows:[], cls:null,
  init(el, chess, {color='w', interactive=false}={}){
    el.setAttribute('role','grid'); el.setAttribute('aria-label','Chess board'); el.setAttribute('aria-rowcount','8'); el.setAttribute('aria-colcount','8'); el.setAttribute('tabindex','0');
    const sameEl = this.el === el;
    if(!sameEl) this._teardownEvents();
    this.el = el;
    this.color = color;
    this.interactive = interactive;
    this.chess = chess;
    this.pieces.clear();
    el.innerHTML = '';  // wipe any previous board DOM (squares, overlays, pieces)
    this.selected = null; this.arrows = sameEl ? (this.arrows || []) : [];
    this.focusSquare = this.color==='b' ? 'e8' : 'e2';
    this.lastMove = null; this.bestMove = null;
    this._buildSquaresOnce();
    this._syncPieces(true);
    if(interactive) this._bindEvents();
  },
  _buildSquaresOnce(){
    // squares layer built once
    if(this.el.querySelector('.squares')) return;
    const layer = document.createElement('div');
    layer.className = 'squares';
    let html = '';
    for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
      const dark = (r+c2)%2===1;
      const file = 'abcdefgh'[c2], rank = 8-r;
      const sq = file+rank;
      layer.innerHTML += `<div class="sq ${dark?'d':'l'}" data-sq="${sq}" role="gridcell" aria-label="${sq}" tabindex="-1"></div>`;
    }
    this.el.appendChild(layer);
  },
  render(opts={}){
    this._buildSquaresOnce();
    if(opts.lastMove!==undefined) this.lastMove = opts.lastMove;
    if(opts.bestMove!==undefined) this.bestMove = opts.bestMove;
    if(opts.clearBest) this.bestMove = null;
    // The badge class is per-move state, not a view preference: any render
    // that does not name a class drops it. Without this a Review badge would
    // stay stuck on the board after switching to Play or Openings, because
    // Board is a single shared instance.
    this.cls = (opts.cls !== undefined) ? opts.cls : null;
    this._syncPieces();
    this._renderOverlays();
  },
  /* diff current FEN against rendered pieces; animate differences */
  _syncPieces(instant=false){
    const board = this.chess.board();
    const wanted = [];
    for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
      const s = board[r][c2];
      if(s) wanted.push({ type:s.type, color:s.color, sq:'abcdefgh'[c2]+(8-r) });
    }
    const oldEntries = [...this.pieces.entries()];
    const usedOld = new Set();
    const matched = new Map();
    for(let wi=0; wi<wanted.length; wi++){
      const w = wanted[wi];
      let bestK=null, bestDist=Infinity;
      for(const [k, p] of oldEntries){
        if(usedOld.has(k)) continue;
        if(p.type!==w.type || p.color!==w.color) continue;
        const d = Math.abs('abcdefgh'.indexOf(p.sq[0])-'abcdefgh'.indexOf(w.sq[0])) + Math.abs((+p.sq[1])-(+w.sq[1]));
        if(d < bestDist){ bestDist=d; bestK=k; }
      }
      if(bestK!=null){ usedOld.add(bestK); matched.set(wi, bestK); }
    }
    for(const [wi, key] of matched){
      const w = wanted[wi];
      const p = this.pieces.get(key);
      this._applyTransform(p, w.sq, instant);
      p.sq = w.sq; p.type = w.type; p.color = w.color;
    }
    for(const [k, p] of oldEntries){
      if(usedOld.has(k)) continue;
      const el = p.el;
      el.classList.add('captured');
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
      this.pieces.delete(k);
    }
    for(let wi=0; wi<wanted.length; wi++){
      if(matched.has(wi)) continue;
      const w = wanted[wi];
      this._addPiece(w.type, w.color, w.sq, true);
    }
  },
  _applyTransform(p, sq, instant){
    const to = this._xy(sq);
    const target = 'translate('+(to.x*100)+'%,'+(to.y*100)+'%)';
    if(instant){
      p.el.style.transition='none';
      p.el.style.transform = target;
      void p.el.offsetWidth;
      p.el.style.transition='';
    } else if(p.el.style.transform !== target){
      p.el.classList.add('moving');
      p.el.style.transform = target;
      setTimeout(()=>p.el.classList.remove('moving'), 200);
    }
  },
  _positionStyle(sq){
    const { x, y } = this._xy(sq);
    return `transform:translate(${x*100}%,${y*100}%)`;
  },
  _xy(sq){
    const f = 'abcdefgh'.indexOf(sq[0]);
    const r = 8-(+sq[1]);
    return this.color==='b' ? {x:7-f, y:7-r} : {x:f, y:r};
  },
  _addPiece(type, color, sq, instant){
    const el = document.createElement('div');
    el.className = 'piece';
    el.innerHTML = pieceSVG(type, color);
    const {x,y} = this._xy(sq);
    if(instant){ el.style.transition='none'; }
    el.style.transform = 'translate('+(x*100)+'%,'+(y*100)+'%)';
    this.el.appendChild(el);
    if(instant){ void el.offsetWidth; el.style.transition=''; }
    const key = type+color+'_'+uid();
    this.pieces.set(key, {el, sq, type, color});
  },
  _movePiece(p, newSq){
    const from = this._xy(p.sq), to = this._xy(newSq);
    if(from.x===to.x && from.y===to.y) return;
    p.el.classList.add('moving');
    p.el.style.transform = `translate(${to.x*100}%, ${to.y*100}%)`;
    setTimeout(()=>p.el.classList.remove('moving'), 180);
  },
  addArrow(from,to){
    if(!/^[a-h][1-8]$/.test(String(from)) || !/^[a-h][1-8]$/.test(String(to)) || from===to) return false;
    const i=this.arrows.findIndex(a=>a.from===from && a.to===to);
    if(i>=0) this.arrows.splice(i,1); else this.arrows.push({from,to});
    this.render(); return true;
  },
  clearArrows(){ this.arrows=[]; if(this.el) this._renderOverlays(); },
  _renderOverlays(){
    let layer = this.el.querySelector('.overlay');
    if(!layer){
      layer = document.createElement('div');
      layer.className = 'overlay';
      layer.style.cssText = 'position:absolute;inset:0;z-index:6;pointer-events:none;';
      this.el.appendChild(layer);
    }
    let html = '';
    this.el.querySelectorAll('.sq').forEach(sqEl=>sqEl.removeAttribute('aria-selected'));
    // The badge needs its own layer ABOVE the pieces (z-index 10). The shared
    // overlay sits at 6, so a badge drawn there would be hidden behind the very
    // piece it is marking. Arrows are at 20, so the badge stays under them.
    let badgeLayer = this.el.querySelector('.badge-layer');
    if(!badgeLayer){
      badgeLayer = document.createElement('div');
      badgeLayer.className = 'badge-layer';
      badgeLayer.style.cssText = 'position:absolute;inset:0;z-index:15;pointer-events:none;';
      this.el.appendChild(badgeLayer);
    }
    let badgeHtml = '';
    if(this.lastMove){
      for(const sq of [this.lastMove.from, this.lastMove.to]){
        const {x,y} = this._xy(sq);
        html += `<div class="hl" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
      }
      // Quality badge on the square the piece landed on, so the piece that
      // was actually played carries its own mark. Only the destination is
      // badged: the origin square is where the piece used to be.
      const cls = clsOf(this.cls, null);
      if(cls){
        const {x,y} = this._xy(this.lastMove.to);
        const label = CLS_LABEL[cls] || '';
        // aria-hidden: the board is role="grid" and expects only row/gridcell
        // children, so a role="img" here is an invalid child -- and the same
        // quality is already named on the move button and the detail badge, so
        // announcing it twice would just be noise. The glyph is decorative.
        // NOTE: `title` is a DOM-level hint only -- the badge is
        // pointer-events:none so it cannot be hovered and no native tooltip
        // appears. The real accessible name lives on the move button and the
        // detail badge.
  // Pinned INSIDE the square's top-right corner. The inset must be at least
  // the FULL box width, not half of it: half centres the badge ON the edge,
  // which is exactly straddling -- with a 3.75% box that put 0.85% of it
  // outside the square on every file, and off the board on the h-file.
  // .board-outer{overflow:hidden} would have hidden this, but nothing ever
  // renders that class, so nothing clips. 4.6% = the 3.75% box + 0.85% margin.
  // Vertically the box starts 1.1% down, so it sits in the square's upper band
  // and leaves the piece glyph readable rather than covering it.
        badgeHtml += `<span class="mv-badge cls-${cls}" style="left:calc(${x*12.5}% + 12.5% - var(--mv-badge,3.75%) - 0.85%);top:${y*12.5+1.1}%"`
             + ` title="${esc(label)}" aria-hidden="true">${esc(CLS_ICON[cls])}</span>`;
      }
    }
    if(this.selected){
      const {x,y} = this._xy(this.selected);
      html += `<div class="hl-sel" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
      const selectedEl=this.el.querySelector(`.sq[data-sq="${this.selected}"]`);
      if(selectedEl) selectedEl.setAttribute('aria-selected','true');
    }
    if(this.selected){
      for(const m of this.chess.moves({square:this.selected, verbose:true})){
        const {x,y} = this._xy(m.to);
        const occ = this.chess.get(m.to);
        html += occ ? `<div class="hint-ring" style="position:absolute;left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%;border-radius:50%;border:calc(var(--bw,560px)/70) solid rgba(20,20,10,.3);box-sizing:border-box"></div>`
                    : `<div class="hint-dot" style="left:${(x)*12.5}%;top:${(y)*12.5}%;width:12.5%;height:12.5%;position:absolute"></div>`;
      }
    }
    // check highlight
    if(this.chess.in_check()){
      const b = this.chess.board();
      for(let r=0;r<8;r++) for(let c2=0;c2<8;c2++){
        const s=b[r][c2];
        if(s && s.type==='k' && s.color===this.chess.turn()){
          const {x,y} = this._xy('abcdefgh'[c2]+(8-r));
          html += `<div class="hl-check" style="left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%"></div>`;
        }
      }
    }
    layer.innerHTML = html;
    badgeLayer.innerHTML = badgeHtml;
    // best-move arrow layer
    let al = this.el.querySelector('.arrow-layer');
    if(!al){ al = document.createElementNS('http://www.w3.org/2000/svg','svg'); al.setAttribute('class','arrow-layer'); this.el.appendChild(al); }
    if(this.bestMove || (this.arrows && this.arrows.length)){
      const S=12.5;
      const markerId = 'arw'+(this.el && this.el.id ? this.el.id.replace(/[^A-Za-z0-9_-]/g,'') : '');
      const lineFor = (from,to,color,opacity,marker)=>{
        const {x:x1,y:y1} = this._xy(from), {x:x2,y:y2} = this._xy(to);
        const cx1=x1*S+S/2, cy1=y1*S+S/2, cx2=x2*S+S/2, cy2=y2*S+S/2;
        const dx=cx2-cx1, dy=cy2-cy1, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
        const sx=cx1+ux*S*0.32, sy=cy1+uy*S*0.32, ex=cx2-ux*S*0.3, ey=cy2-uy*S*0.3;
        return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-opacity="${opacity}" stroke-width="1.6" marker-end="url(#${marker||markerId})" stroke-linecap="round"/>`;
      };
      al.setAttribute('viewBox','0 0 100 100'); al.setAttribute('preserveAspectRatio','none');
      const userMarkerId = markerId+'User';
      al.innerHTML = `<defs><marker id="${markerId}" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="rgba(129,182,76,.85)"/></marker><marker id="${userMarkerId}" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#f7c631"/></marker></defs>`+
        (this.arrows||[]).map(a=>lineFor(a.from,a.to,'#f7c631','.9',userMarkerId)).join('')+
        (this.bestMove?lineFor(this.bestMove.from,this.bestMove.to,'rgba(129,182,76,.85)','1',markerId):'');
      al.style.display='';
    } else al.style.display='none';
  },
  _teardownEvents(){
    if(this._boundEl && this._handlers) for(const [type, fn, opts] of this._handlers) this._boundEl.removeEventListener(type, fn, opts);
    this._boundEl=null; this._eventsBound=false; this._handlers=null; this._keyboardHandler=null; this._drag=null; this._arrowDrag=null;
  },
  _bindEvents(){
    if(this._eventsBound && this._boundEl === this.el) return;
    this._teardownEvents();
    this._eventsBound=true; this._boundEl=this.el;
    this._handlers=[];
    const listen=(type, fn, opts)=>{ this.el.addEventListener(type, fn, opts); this._handlers.push([type, fn, opts]); };
    this.el.setAttribute('tabindex','0');
    const keyboardHandler = e=>{
      if(!this.interactive) return;
      if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        if(this.focusSquare) this._onSquare(this.focusSquare, e);
        return;
      }
      const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
      const d=dirs[e.key]; if(!d) return;
      e.preventDefault();
      const current=this.focusSquare || (this.color==='b' ? 'e7' : 'e2');
      const f='abcdefgh'.indexOf(current[0]), r=+current[1];
      const nf=Math.max(0,Math.min(7,f+d[0]));
      const nr=Math.max(1,Math.min(8,r+(this.color==='b' ? -d[1] : d[1])));
      this.focusSquare='abcdefgh'[nf]+nr;
      const target=this.el.querySelector(`.sq[data-sq="${this.focusSquare}"]`);
      if(target) target.focus({preventScroll:true});
    };
    this._keyboardHandler=keyboardHandler;
    listen('keydown', keyboardHandler, undefined);
    const sqFromEvent = e=>{
      const rect = this.el.getBoundingClientRect();
      const x = Math.floor((e.clientX-rect.left)/rect.width*8);
      const y = Math.floor((e.clientY-rect.top)/rect.height*8);
      if(x<0||x>7||y<0||y>7) return null;
      const f = this.color==='b' ? 'hgfedcba'[x] : 'abcdefgh'[x];
      const r = this.color==='b' ? y+1 : 8-y;
      return f+r;
    };
    this._sqFromEvent = sqFromEvent;
    listen('contextmenu', e=>{ if(this.interactive) e.preventDefault(); });
    listen('click', e=>{
      if(!this.interactive) return;
      if(this._suppressClick && Date.now()-this._suppressClick < 150) return;
      try{
        const sq = sqFromEvent(e);
        if(!sq) return;
        this._onSquare(sq, e);
      }catch(err){ this._reportErr(err); }
    });
    /* ---- drag & drop ---- */
    listen('pointerdown', e=>{
      if(!this.interactive) return;
      if(e.button===2 && e.pointerType==='mouse'){
        const from=sqFromEvent(e);
        if(!from) return;
        this._arrowDrag={from,to:from};
        try{ this.el.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
        return;
      }
      if(this._drag) return;
      if(e.button!==undefined && e.button!==0 && e.pointerType==='mouse') return;
      try{
        const sq = sqFromEvent(e);
        if(!sq) return;
        const s = this.chess.get(sq);
        if(!s || s.color!==this.chess.turn()) return;   // drag only own, side-to-move pieces
        let pieceEl = null;
        for(const p of this.pieces.values()){ if(p.sq===sq){ pieceEl = p.el; break; } }
        if(!pieceEl) return;
        this._drag = { from:sq, el:pieceEl, sx:e.clientX, sy:e.clientY, moved:false };
        this.selected = sq;               // show legal-move dots while dragging
        try{ this.el.setPointerCapture(e.pointerId); }catch(err){}
        pieceEl.style.transition='none';
        pieceEl.style.zIndex='40';
        this._renderOverlays();
      }catch(err){ this._reportErr(err); }
    });
    listen('pointermove', e=>{
      if(this._arrowDrag){
        const to=sqFromEvent(e);
        if(to){ this._arrowDrag.to=to; this._renderOverlays(); }
        return;
      }
      if(!this._drag) return;
      try{
        const rect = this.el.getBoundingClientRect();
        const size = rect.width/8;
        const px = e.clientX - rect.left - size/2;
        const py = e.clientY - rect.top - size/2;
        if(Math.abs(e.clientX-this._drag.sx)>4 || Math.abs(e.clientY-this._drag.sy)>4) this._drag.moved = true;
        this._drag.el.style.transform = 'translate('+px+'px,'+py+'px)';
      }catch(err){}
    });
    const finishArrow = e=>{
      const a=this._arrowDrag; if(!a) return;
      this._arrowDrag=null;
      if(a.from!==a.to) this.addArrow(a.from,a.to);
    };
    listen('pointerup', finishArrow);
    listen('pointercancel', finishArrow);
    const finishDrag = e=>{
      const d = this._drag; if(!d) return;
      this._drag = null;
      try{
        d.el.style.zIndex='';
        d.el.style.transition='';
        const sq = (e && sqFromEvent(e)) || null;
        if(d.moved && sq && sq!==d.from){
          this._suppressClick = Date.now();
          // seed BOTH selection stores — play view reads Board.selected, builder reads App.builder.selected
          this.selected = d.from;
          if(App.builder) App.builder.selected = d.from;
          this._onSquare(sq, e);           // view decides legality + plays
        }else{
          this.selected = null;
          if(App.builder) App.builder.selected = null;
          this.render();
        }
      }catch(err){ this._reportErr(err); }
    };
    listen('pointerup', finishDrag);
    listen('pointercancel', finishDrag);
  },
  _reportErr(err){
    try{
      let b = document.getElementById('err-banner');
      if(!b){
        b = document.createElement('div');
        b.id = 'err-banner';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b3261e;color:#fff;font:12px/1.4 system-ui;padding:8px 14px;white-space:pre-wrap';
        (document.body||document.documentElement).appendChild(b);
      }
      b.textContent = 'Board error: ' + (err && err.message ? err.message : err);
    }catch(e){}
  },
  _onSquare(sq,e){
    // external hook (view decides legality)
    const target=this.el && this.el.querySelector(`.sq[data-sq="${sq}"]`);
    if(target) target.focus({preventScroll:true});
    if(this.onSquare) this.onSquare(sq,e);
  },
};
</script>

<script>
'use strict';
/* =================== PLAY (continued) + BUILDER + REVIEW + PROGRESS + SETTINGS + WIRING =================== */

/* =================== REVIEW =================== */
const Review = {
  data:null, nav:0,
  open(rec){
    if(!rec || typeof rec.pgn!=='string' || !Array.isArray(rec.plies)){ toast('Could not load game','err'); return; }
    this._altRequestId=(this._altRequestId||0)+1;
    const g = new Chess();
    if(!g.load_pgn(rec.pgn,{sloppy:true}) || !Array.isArray(rec.plies) || rec.plies.length !== g.history({verbose:true}).length){ toast('Could not load game','err'); return; }
    const hist = g.history({verbose:true});
    const startFen = pgnStartFen(rec.pgn, g.header() || {});
    try{ validateAnalyzedChain(rec.plies, hist, startFen); }
    catch(e){ toast('Could not load game','err'); return; }
    this.data = rec; this.chess = g; this.hist = hist; this.startFen = startFen;
    this.plys = rec.plies; this.summary = rec.summary || {}; this.headers = rec.headers || {};
    this.nav = 0; this.branch = null; this.flipped = false;
    App.view='review'; render();
  },
  positionAt(ply){
    const target=Math.max(0,Math.min(ply,this.hist.length));
    const g=new Chess(this.startFen || new Chess().fen()); let last=null;
    for(let i=0;i<target;i++){
      const vm=g.moves({verbose:true}).find(x=>x.san===this.hist[i].san);
      if(!vm) break;
      g.move({from:vm.from,to:vm.to,promotion:vm.promotion});
      last={from:vm.from,to:vm.to};
    }
    return {g,last};
  },
  boardAt(ply){
    if(this.branch && ply>=this.branch.basePly){
      const offset=ply-this.branch.basePly;
      if(offset<=this.branch.moves.length){
        const g=new Chess(this.branch.fen); let last=null;
        for(let i=0;i<offset;i++){ const u=this.branch.moves[i]; const vm=g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===u); if(vm){g.move({from:vm.from,to:vm.to,promotion:vm.promotion}); last={from:vm.from,to:vm.to};} }
        return {g,last};
      }
    }
    return this.positionAt(ply);
  },
  setPly(ply){
    this._altRequestId=(this._altRequestId||0)+1;
    const maxPly=this.branch ? Math.max(this.hist.length, this.branch.basePly+this.branch.moves.length) : this.hist.length;
    this.nav=Math.max(0,Math.min(ply,maxPly));
    if(this.branch && (this.nav<this.branch.basePly || this.nav>this.branch.basePly+this.branch.moves.length)) this.branch=null;
    render();
  },
  flip(){ this.flipped=!this.flipped; this.data && render(); },
  async playAlternative(from,to){
    if(!this.data || this.nav<0 || this.nav>this.hist.length || App.analyzing) return false;
    const requestId=(this._altRequestId||0)+1; this._altRequestId=requestId;
    const basePly=this.nav;
    const baseData=this.data;
    const {g}=this.boardAt(basePly);
    const vm=g.moves({verbose:true}).find(m=>m.from===from && m.to===to);
    if(!vm) return false;
    const next=new Chess(g.fen()); const moved=next.move({from:vm.from,to:vm.to,promotion:vm.promotion});
    const uci=vm.from+vm.to+(vm.promotion||'');
    let result=null;
    try{ result=await Engine.analyse(next.fen(), Store.state.settings.reviewMovetime, 2); }catch(e){}
    if(requestId!==this._altRequestId || this.data!==baseData || this.nav!==basePly) return false;
    if(!result) return false;
    const currentPly=this.plys[this.nav] || (this.nav===this.hist.length ? this.plys[this.nav-1] : null);
    const before=currentPly && (this.nav===this.hist.length ? currentPly.evalAfter : currentPly.evalBefore);
    const after=result;
    const mover=g.turn();
    const wpForMover=ev=>{ if(!ev || !isEval(ev)) return null; const wpWhite=wpWhiteOf(ev); return mover==='w' ? wpWhite : 100-wpWhite; };
    const wpBefore=wpForMover(before);
    const wpAfter=wpForMover(after);
    this.branch={kind:'alternative',basePly:this.nav,fen:g.fen(),moves:[uci],move:{san:moved.san,uci,mover,moveNum:Math.floor(this.nav/2)+1},evalBefore:before,evalAfter:after,wpBefore,wpAfter};
    this.nav=this.nav+1; render(); return true;
  },
  playBest(){
    if(this.branch && this.nav > this.branch.basePly) return false;
    const ply=this.plys[this.nav];
    if(!ply || !ply.bestUci || this.nav>=this.hist.length) return false;
    const {g}=this.positionAt(this.nav);
    const vm=g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===ply.bestUci);
    if(!vm) return false;
    const next=new Chess(g.fen()); next.move({from:vm.from,to:vm.to,promotion:vm.promotion});
    const nextHistory=next.history();
    const san=nextHistory[nextHistory.length-1];
    if(!san) return false;
    const mover=g.turn();
    // The stored evalAfter belongs to the played move, not to the engine's
    // recommendation; do not present it as the best continuation's result.
    this.branch={kind:'best',basePly:this.nav,fen:g.fen(),moves:[ply.bestUci],move:{san,uci:ply.bestUci,mover,moveNum:Math.floor(this.nav/2)+1},evalBefore:null,evalAfter:null,wpBefore:null,wpAfter:null};
    this.nav=this.nav+1; render(); return true;
  },
};
function renderReview(){
  if(App.analyzing){
    const a = App.analyzing;
    return `<h1>Reviewing</h1>
      <div class="card card-pad mt-14" style="max-width:520px">
        <div style="display:flex;justify-content:space-between"><b>${esc(a.label)}</b><span class="small muted" id="ana-count">position ${a.done}/${a.total}</span></div>
        <div class="progress-wrap mt-8"><i style="width:${a.total?Math.round(a.done/a.total*100):0}%"></i></div>
        <button class="btn btn-danger btn-sm mt-14" data-act="cancel-analysis">Cancel</button>
      </div>`;
  }
  if(Review.data) return renderReviewReport();
  const imp = App.importState;
  let list='';
  if(imp.loading) list = '<div class="card card-pad muted">Loading your games...</div>';
  else if(imp.error) list = `<div class="banner warn">${imp.errorKind==='validation'?'':'Could not load games: '}${esc(String(imp.error))}${Engine.ready?' — paste PGN still works.':''}</div>`;
  else if(imp.games){
        const games = Array.isArray(imp.games)?imp.games:[];
        const visibleGames = games.filter(gm=>imp.filter==='all'||gm.time_class===imp.filter);
        const rows = visibleGames.map(gm=>{
      const color=myColorOf(gm, imp.loadedUsername || reviewUsername()); const opp=color==='w'?gm.black:gm.white; if(!opp) return '';
      const idx=imp.games.indexOf(gm);
      return `<label class="gm-row" style="cursor:default">
        <input type="checkbox" data-gm="${idx}" ${imp.selected.has(idx)?'checked':''}>
        <span class="small" style="width:12px;height:12px;border-radius:3px;background:${color==='w'?'#fff':'#312e2b'};border:1px solid var(--border)"></span>
        <span style="flex:1">vs <b>${esc(opp.username||'?')}</b> <span class="faint">(${esc(String(opp.rating||'?'))})</span></span>
        <span class="chip">${esc(gm.time_class||'unknown')}</span>
        ${gm.url && Object.prototype.hasOwnProperty.call(Store.state.analyzed,gm.url)?'<span class="chip">✓</span>':''}
      </label>`;
    }).join('');
    list = `<div class="card">
      <div style="display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap">
        <button class="icon-btn" data-act="prev-month" aria-label="Previous month">◀</button>
        <b>${esc(MONTH_NAMES[imp.month]||'')} ${esc(String(imp.year||''))}</b>
        <button class="icon-btn" data-act="next-month" aria-label="Next month">▶</button>
        <span style="flex:1"></span>
        <div class="seg">${['all','rapid','blitz','bullet'].map(f=>`<button data-tc="${f}" aria-pressed="${imp.filter===f}">${f}</button>`).join('')}</div>
      </div>
      ${visibleGames.length?rows:'<p class="muted small" style="padding:14px">No games this month.</p>'}
    </div>
    <div class="mt-14" style="display:flex;justify-content:space-between;align-items:center">
      <span class="small muted">${imp.selected.size} selected</span>
      <button class="btn btn-green" data-act="analyze-selected" ${imp.selected.size?'':'disabled'}>Analyze ${imp.selected.size||''} selected</button>
    </div>`;
  }
  else list = '';
  const analyzed = Object.values(Store.state.analyzed).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<h1>Game Review</h1>
    <p class="muted mt-8">Click a piece and destination to test a different move. ChessLab analyzes that continuation and shows the evaluation change; right-drag the board to draw your own arrows.</p>
    <div class="card card-pad mt-14">
      <div class="field"><label for="review-username">chess.com username</label><input class="input" id="review-username" value="${esc(reviewUsername())}" placeholder="Enter a chess.com username" autocomplete="username"></div>
      <div class="small muted">Enter any username to fetch that player's games. This does not change your saved account.</div>
    </div>
    <div class="row mt-14" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-green" data-act="load-games">Load chess.com games</button>
      <button class="btn btn-ghost" data-act="paste-pgn">Paste PGN</button>
    </div>
    ${Engine.offline?'<div class="banner warn mt-14">Engine offline — paste-PGN analysis unavailable. Openings practice still works.</div>':''}
    <div class="mt-14">${list}</div>
    ${analyzed.length?`<div class="mt-20"><h2 style="font-size:16px">Analyzed games</h2><div class="card mt-8">
      ${analyzed.map(g=>`<div class="gm-row" data-act="open-analyzed" data-key="${esc(g.key)}">
        <span class="small faint">${esc(g.date||'')}</span>
        <span style="flex:1"><b>${esc((g.headers||{}).White||'?')}</b> vs <b>${esc((g.headers||{}).Black||'?')}</b> <span class="faint">${esc((g.headers||{}).ECO||'')}</span></span>
        <span class="chip">${g.summary? esc(String((g.summary.white&&g.summary.white.accuracy)||(g.summary.black&&g.summary.black.accuracy)||'?'))+'%' : ''}</span>
      </div>`).join('')}</div>`:''}`;
}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function reviewUsername(){

function myColorOf(gm, username=reviewUsername()){
  const u = String(username || '').trim().toLowerCase();
  if(!u) return null;
  if(gm?.white && typeof gm.white.username==='string' && gm.white.username.toLowerCase()===u) return 'w';
  if(gm?.black && typeof gm.black.username==='string' && gm.black.username.toLowerCase()===u) return 'b';
  return null;
}
function myColorOfHeaders(h, username=Store.state.settings.username){
  const u = String(username || '').trim().toLowerCase();
  if(!u) return null;
  const white=String(h?.White||'').toLowerCase(), black=String(h?.Black||'').toLowerCase();
  if(white===u) return 'w';
  if(black===u) return 'b';
  return null;
}
function renderReviewReport(){
  const R = Review;
  const branchEnd = R.branch ? R.branch.basePly + R.branch.moves.length : -1;
  const ply = R.branch && R.nav>=R.branch.basePly && R.nav<=branchEnd ? R.nav : Math.min(R.nav, R.hist.length);
  const {g, last} = Review.boardAt(ply);
  const branchMove = R.branch && ply===R.branch.basePly+1
    ? {...R.branch.move, evalBefore:R.branch.evalBefore, evalAfter:R.branch.evalAfter, wpBefore:R.branch.wpBefore, wpAfter:R.branch.wpAfter}
    : null;
  const branchActive = !!(R.branch && ply>R.branch.basePly && ply<=branchEnd);
  const curPly = branchActive ? branchMove : (ply>0 ? R.plys[ply-1] : null);
  const nextPly = branchActive ? null : (ply<R.plys.length ? R.plys[ply] : null);
  const ev = branchActive ? (branchMove && branchMove.evalAfter || null) : (nextPly ? nextPly.evalBefore : (curPly && curPly.evalAfter) || (R.plys[R.plys.length-1] ? R.plys[R.plys.length-1].evalAfter : null));
  const wp = ev && isEval(ev) ? wpWhiteOf({bestCpWhite:ev.bestCpWhite, bestMateWhite:ev.bestMateWhite}) : 50;
  const showEval = Store.state.settings.showEvalInReview !== false;
  const myColor = myColorOfHeaders(R.headers||{}, R.data?.username || Store.state.settings.username);
  const h = R.headers||{};
  let detail = '<p class="small muted">Start position — use arrows or click a move.</p>';
  if(branchActive){
    const bdelta = (branchMove.wpBefore!=null && branchMove.wpAfter!=null) ? Math.round(branchMove.wpAfter-branchMove.wpBefore) : null;
    const branchLabel = R.branch && R.branch.kind==='best' ? 'Best line' : 'Alternative line';
    detail = `<p class="small"><b>${branchLabel}:</b> ${branchMove.moveNum}${branchMove.mover==='w'?'.':'...'} ${esc(branchMove.san)}</p>`+
      (branchMove.evalAfter?`<p class="small">Eval: ${evalLabel(branchMove.evalBefore)} → ${evalLabel(branchMove.evalAfter)}${bdelta!=null?` · <b style="color:${bdelta>=0?'var(--green)':'var(--blun)'}">${bdelta>=0?'+':''}${bdelta}% ${branchMove.mover==='w'?'White':'Black'} win chance</b>`:''}</p>`:'');
  }else if(curPly){
    const cls = clsOf(curPly.cls, 'q');
    detail = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="cls-badge"><i class="cls-dot cls-${cls}"></i><span class="mv-ico cls-ink-${cls}" aria-hidden="true">${CLS_ICON[cls]||''}</span>${CLS_LABEL[cls]||'?'}</span>
      <b>${curPly.moveNum}${curPly.mover==='w'?'.':'...'} ${esc(curPly.san)}</b></div>`;
    if(cls!=='?'){
      detail += `<p class="small muted mt-8">Best: <b>${esc(curPly.bestSan||'?')}</b>${curPly.bestUci===curPly.uci?' (this move)':''}</p>
        <p class="small">Eval: ${evalLabel(curPly.evalBefore)} → ${evalLabel(curPly.evalAfter)}</p>
        ${curPly.delta>0?`<p class="small" style="color:${curPly.delta>20?'var(--blun)':curPly.delta>10?'var(--mist)':'var(--inac)'}">You lost ${curPly.delta}% win chance</p>`:''}
        ${curPly.sacPawns>=2?`<p class="small faint">Material invested: ${curPly.sacPawns} pawns</p>`:''}`;
    }
  }
  const mySum = myColor && R.summary ? (R.summary[myColor==='w'?'white':'black'] || null) : null;
  let rows='';
  const moveBtn=(idx)=>{
    const pl = R.plys[idx];
    // Fall back to the neutral class for anything unexpected, so a stored or
    // unrecognised value can never emit an unstyled `cls-<value>`.
    const cls = clsOf(pl && pl.cls, 'q');
    const label = CLS_LABEL[cls] || '?';
    return `<button class="mv${ply===idx+1?' cur':''}" data-ply="${idx+1}" title="${esc(R.hist[idx].san)} — ${label}" aria-label="${esc(R.hist[idx].san)}, ${label}"><span class="mv-dot cls-${cls}"></span><span class="mv-ico cls-ink-${cls}" aria-hidden="true">${CLS_ICON[cls]||''}</span>${esc(R.hist[idx].san)}</button>`;
  };
  for(let i=0;i<R.hist.length;i+=2){
    rows += `<div class="mv-row"><span class="mv-num">${i/2+1}</span>${moveBtn(i)}${R.hist[i+1]?moveBtn(i+1):'<span></span>'}</div>`;
  }
  const res = (h.Result==='1-0')?(myColor==='w'?'Win':'Loss'):(h.Result==='0-1')?(myColor==='b'?'Win':'Loss'):'Draw';
  void res;
  return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h1>${esc(h.White||'?')} vs ${esc(h.Black||'?')}</h1>

      <button class="btn btn-ghost btn-sm" data-act="back-list">← All games</button>
    </div>
    <div class="game-grid mt-14">

        <div class="board-row" style="display:flex;gap:10px">

function renderProgress(){
  const games = Object.values(Store.state.analyzed);
  if(!games.length) return `<h1>Progress</h1><div class="card empty mt-14"><h3>Nothing to measure yet</h3><p>Analyze games in the Review tab — accuracy, blunder rate and weak openings appear here.</p></div>`;
  const knownUsernames=[...new Set(games.map(g=>String(g.username||'').trim()).filter(Boolean))];
  if(App.progressScope && !knownUsernames.some(u=>u.toLowerCase()===String(App.progressScope).toLowerCase())) App.progressScope='';
  const settingsScope=String(Store.state.settings.username||'').trim();
  const loadedScope=String(App.importState.loadedUsername||'').trim();
  const reviewScope=App.importState.games && App.importState.usernameExplicit ? String(App.importState.username||'').trim() : '';
  const explicitScope=String(App.progressScope||'').trim();
  const scope=explicitScope || settingsScope || loadedScope || reviewScope || (knownUsernames.length===1?knownUsernames[0]:'');
  const scopeBar=`<div class="card card-pad mt-14" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${scope?`<span class="muted">Viewing ${esc(scope)}</span>`:'<span class="muted">Choose a player</span>'}${explicitScope?'<button class="btn btn-ghost btn-sm" data-act="progress-scope-clear">Use default player</button>':''}${knownUsernames.map(u=>`<button class="btn btn-ghost btn-sm" data-act="progress-scope" data-username="${esc(u)}">${esc(u)}</button>`).join('')}</div>`;
  if(!scope && knownUsernames.length>1){
    return `<h1 id="progress-scope-current" tabindex="-1">Progress</h1>${scopeBar}`;
  }
  const rows = games.map(g=>{
    const c = myColorOfHeaders(g.headers||{}, scope);
    return {g, sum: c && g.summary ? (g.summary[c==='w'?'white':'black'] || null) : null, date:g.date||''};
  }).filter(x=>x.sum).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!rows.length) return `<h1 id="progress-scope-current" tabindex="-1">Progress</h1>${knownUsernames.length?scopeBar:''}<div class="card empty mt-14"><h3>Not your games</h3><p>Set your chess.com username in Settings, or choose the player whose analysed games you want to measure.</p></div>`;
  const n = rows.length;
  const avg = Math.round(rows.reduce((a,x)=>a+x.sum.accuracy,0)/n);
  const bpg = rows.reduce((a,x)=>a+x.sum.blunder,0)/n;
  const mpg = rows.reduce((a,x)=>a+x.sum.mistake,0)/n;
  // weakness by ECO
  const groups=Object.create(null);
  for(const x of rows){
    let key = (x.g.headers||{}).ECO;
    if(!key) key = (x.g.plies? x.g.plies.slice(0,6).map(p=>p.san).join(' '):'') || '?';
    key=safeString(key, 120).trim() || '?';
    if(!Object.prototype.hasOwnProperty.call(groups,key)) groups[key]={name:key,n:0,acc:0,b:0};
    groups[key].n++; groups[key].acc+=x.sum.accuracy; groups[key].b+=x.sum.blunder;
  }
  const weak = Object.values(groups).map(g=>({...g, avg:g.acc/g.n, bpg:g.b/g.n})).sort((a,b)=>a.avg-b.avg);
  const worst = weak[0];
  const head=`<h1 id="progress-scope-current" tabindex="-1">Progress</h1>${knownUsernames.length>1?scopeBar:''}`;
  return `${head}<p class="muted mt-8">${n} game${n===1?'':'s'} analyzed</p>
    <div class="stat-grid mt-14">
      <div class="card stat"><div class="label">Avg accuracy</div><div class="value">${avg}%</div></div>
      <div class="card stat"><div class="label">Blunders / game</div><div class="value">${bpg.toFixed(1)}</div><div class="sub">mistakes ${mpg.toFixed(1)}</div></div>
      <div class="card stat"><div class="label">Games</div><div class="value">${n}</div></div>
    </div>
    ${worst?`<div class="banner mt-14">Weakest opening: <b>${esc(worst.name)}</b> — ${worst.n} game(s) at ${Math.round(worst.avg)}% avg, ${worst.bpg.toFixed(1)} blunders/game <button class="btn btn-ghost btn-sm" data-act="go-openings">Practice openings</button></div>`:''}
    <div class="card mt-14" style="overflow:auto"><table class="tbl">
      <thead><tr><th>Opening</th><th>Games</th><th>Avg accuracy</th><th>Blunders/game</th></tr></thead>
      <tbody>${weak.map(w=>`<tr><td><b>${esc(w.name)}</b></td><td>${w.n}</td><td>${Math.round(w.avg)}%</td><td>${w.bpg.toFixed(1)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

<script>
'use strict';
/* =================== WIRING + BOOT =================== */
function sanitizeMoves(text){
  let s = String(text||'');
  s = s.replace(/\{[^}]*\}/g,' ').replace(/\([^)]*\)/g,' ').replace(/;[^\n]*/g,' ').replace(/\$\d+/g,' ');
  s = s.replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g,' ');
  s = s.replace(/\d+\s*\.{1,3}(\.\.)?/g,' ');
  return s.split(/[\s,]+/).filter(t=>t && /^[a-zA-Z0-9+#=\-]+$/.test(t));
}
/* ---- board mounting helpers ---- */
function mountPlayBoard(){
  const S=Play.session;
  const el = $('#board');
  if(!el || !S) return;
  Board.init(el, S.chess, { color: S.flipped ? (S.color==='w'?'b':'w') : S.color, interactive:true });
  const hist = S.chess.history({verbose:true});
  Board.render({ lastMove: hist.length? {from:hist[hist.length-1].from,to:hist[hist.length-1].to}:null });
  Board.onSquare = null;
  Board._onSquare = function(sq){
    const current = Play.session;
    if(!current || current.finished || Play._thinking) return;
    if(current.chess.turn()!==current.color) return;
    if(Board.selected){
      const mv = current.chess.moves({verbose:true}).find(m=>m.from===Board.selected && m.to===sq);
      if(mv){
        Play.userPlay(Board.selected, sq);
        Board.selected = null;
        mountPlayBoard();
        return;
      }
    }
    const own = current.chess.moves({verbose:true}).some(m=>m.from===sq);
    Board.selected = own? sq : null;
    Board.render();
  };
  updatePlayPanels();
}
function mountBuilderBoard(){
  const el = $('#builder-board');
  if(!el) return;
  if(!App.builder) App.builder = {chess:new Chess(), name:''};
  ensureBuilderModel(App.builder);
  restorePlaybook();
  const B = ensureBuilderModel(App.builder);
  Board.init(el, B.chess, { color: Store.state.settings.boardFlipped ? 'b' : 'w', interactive:true });
  Board.render();
  Board.onSquare = null;
  Board._onSquare = function(sq,e){
    const B = ensureBuilderModel(App.builder);
    if(B.selected){
      const mv = B.chess.moves({verbose:true}).find(m=>m.from===B.selected && m.to===sq);
      if(mv){
        if(recordBuilderMove(B, mv.san)){
          Board.render({lastMove:{from:mv.from,to:mv.to}});
          savePlaybook();
          refreshBuilderUI();
          return;
        }
      }
    }
    if(Board.selected && Board.selected!==sq && e && e.altKey){
      Board.addArrow(Board.selected, sq);
      Board.selected=null; B.selected=null; Board.render(); return;
    }
    const own = B.chess.moves({verbose:true}).some(m=>m.from===sq);
    B.selected = own? sq : null;
    Board.selected = B.selected;   // drives the yellow highlight + legal-move dots
    Board.render();
  };
  updateBuilderPanels();
}
function updateBuilderPanels(){
  const B = App.builder;
  const cnt = $('#bb-count'); if(cnt && B) cnt.textContent = B.chess.history().length;
}
function refreshBuilderUI(){
  updateBuilderPanels();
  if(App.view==='openings') render();   // refreshes moves grid + lines list; render re-mounts the board
}
function mountReviewBoard(){
  const el = $('#review-board');
  if(!el || !Review.data) return;
  const branchEnd = Review.branch ? Review.branch.basePly + Review.branch.moves.length : -1;
  const ply = Review.branch && Review.nav>=Review.branch.basePly && Review.nav<=branchEnd ? Review.nav : Math.min(Review.nav, Review.hist.length);
  const {g} = Review.boardAt(ply);
  const myColor = myColorOfHeaders(Review.headers||{}, Review.data?.username || Store.state.settings.username);
  Board.init(el, g, { color: Review.flipped ? (myColor==='b'?'w':'b') : (myColor||'w'), interactive:true });
  Board.onSquare = null;
  Board._onSquare = function(sq){
    const current=Review.boardAt(Review.nav).g;
    if(Board.selected){
      const from=Board.selected;
      const mv=current.moves({verbose:true}).find(m=>m.from===from && m.to===sq);
      if(mv){
        Board.selected=null;
        Review.playAlternative(from, sq).then(ok=>{ if(ok) mountReviewBoard(); });
        return;
      }
    }
    const own=current.moves({verbose:true}).some(m=>m.from===sq);
    Board.selected=own?sq:null;
    Board.render();
  };
  // The badge belongs to the move that was PLAYED, which is ply-1 in the
  // current position -- not the next move waiting to be made. At ply 0 there
  // is no played move and nothing is badged.
  // One predicate governs the square, the arrow and the class. playedUci used
  // to test `Review.branch && ply>basePly` without the upper bound branchActive
  // has, so if the clamp and this guard ever diverged the square could come
  // from a branch while the class came from the main line -- the exact bug
  // this was fixed for.
  const branchActive = !!(Review.branch && ply>Review.branch.basePly && ply<=branchEnd);
  const playedUci = ply>0
    ? (branchActive
        ? Review.branch.moves[ply-Review.branch.basePly-1]
        : (Review.hist[ply-1] ? Review.hist[ply-1].uci : null))
    : null;
  // Inside a branch the played move is NOT Review.plys[ply-1]: that array only
  // ever holds the main line, so plys[ply-1] describes a different move and
  // its class would be asserted about the branch move. A branch move is
  // unanalysed, so it gets no class and therefore no badge -- the same call
  // renderReviewReport makes with branchActive.
  const playedPly = (branchActive || ply<1) ? null : Review.plys[ply-1];
  const nextPly = Review.plys[ply];
  const branchUci = branchActive ? Review.branch.moves[ply-Review.branch.basePly-1] : null;
  const shownCls = playedPly ? clsOf(playedPly.cls, null) : null;
  if(playedUci){
    const opts = { lastMove:{ from:playedUci.slice(0,2), to:playedUci.slice(2,4) }, cls: shownCls };
    if(branchUci) opts.bestMove = {from:branchUci.slice(0,2), to:branchUci.slice(2,4)};
    else if(nextPly && nextPly.bestUci) opts.bestMove = {from:nextPly.bestUci.slice(0,2), to:nextPly.bestUci.slice(2,4)};
    else opts.clearBest = true;
    Board.render(opts);
  }else{
    Board.render({ lastMove:null, cls:null, clearBest:true });
  }
}

function refreshAccountChip(){
  const chip = $('#chip-account'); if(!chip) return;
  const username=Store.state.settings.username;

  chip.textContent = username;
  Importer.stats(username).then(j=>{
    if(requestId!==App.accountRequestId || Store.state.settings.username!==username) return;
    if(!j) return;
    const r = j.chess_rapid;
    if(r && r.last && r.best && $('#chip-account')){
      const current=$('#chip-account'); current.textContent='';
      const dot=document.createElement('span'); dot.className='dot ok'; current.appendChild(dot);
      current.appendChild(document.createTextNode(username+' · '+String(r.last.rating)+' rapid (peak '+String(r.best.rating)+')'));
    }
  }).catch(()=>{});
}
function bindView(){

  // top chips
  const chips = $('#nav-chips');

  }
  /* tabs are outside #main: direct listeners */
  $$('#tabs button').forEach(b=>{ if(!b._bound){ b._bound=true; b.addEventListener('click',()=>go(b.dataset.view)); } });

  view.addEventListener('click', e=>{
    const t = e.target.closest('button[data-theme]');
    if(t){ Store.state.settings.theme = t.dataset.theme; Store.save(); applyTheme(); render(); return; }
    const pc = e.target.closest('[data-pcolor]');
    if(pc){ Store.state.settings.color = pc.dataset.pcolor; Store.save(); render(); return; }
    const tc = e.target.closest('[data-tc]');
    if(tc){ App.importState.filter=tc.dataset.tc; App.importState.selected.clear(); render(); return; }
    const mvBtn = e.target.closest('[data-ply]');
    if(mvBtn && App.view==='review' && Review.data){ Review.setPly(+mvBtn.dataset.ply); return; }
    const gm = e.target.closest('input[data-gm]');
    if(gm){ const i=+gm.dataset.gm; if(gm.checked) App.importState.selected.add(i); else App.importState.selected.delete(i);
      const btn = document.querySelector('[data-act="analyze-selected"]');
      if(btn){ btn.textContent = 'Analyze '+App.importState.selected.size+' selected'; btn.disabled = !App.importState.selected.size; }
      return; }
    const act = e.target.closest('[data-act]');
    if(act) handleAction(act, e);
  });
  view.addEventListener('input', e=>{
    const t=e.target;
    if(t.id==='bb-name'){ if(App.builder) App.builder.name = t.value; savePlaybook(); }
    if(t.id==='review-username'){ App.importState.username = t.value; App.importState.usernameExplicit = true; }
    if(t.id==='s-mt'){ $('#s-mt-lab').textContent = t.value+' ms'; Store.state.settings.reviewMovetime=+t.value; Store.save(); }
    if(t.id==='s-skill'){ Store.state.settings.skill=+t.value; Store.save(); }
    if(t.id==='pf-skill'){ const lab=$('#pf-skill-lab'); if(lab) lab.textContent=skillLabel(+t.value); }
    if(t.matches && t.matches('[data-setting]')){
      const key=t.dataset.setting;
      if(key==='boardFlipped') Store.state.settings[key]=t.value==='1';
      else if(key==='showEvalInReview' || key==='autoSyncChessCom'){
        Store.state.settings[key]=t.checked;
        if(key==='autoSyncChessCom'){ if(t.checked) App.startAutoSync(3000); else App.stopAutoSync(); }
      }
      Store.save();
    }
  });
  if(document && !document._kb){
    document._kb = true;
    document.addEventListener('keydown', e=>{
      if(App.view!=='review'||!Review.data) return;
      if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const h = Review.hist.length;
      if(e.key==='ArrowRight'){ e.preventDefault(); Review.setPly(Review.nav+1); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); Review.setPly(Review.nav-1); }
      if(e.key==='Home'){ e.preventDefault(); Review.setPly(0); }
      if(e.key==='End'){ e.preventDefault(); Review.setPly(h); }
    });
  }
}
/* =================== ACTIONS =================== */
function handleAction(t, e){
  const act = t.dataset.act;
  switch(act){
    case 'start-play': {
      const line = $('#pf-line') ? $('#pf-line').value : '';
      const pfSkill = $('#pf-skill');
      const skill = pfSkill ? Math.max(0, Math.min(20, +pfSkill.value || 0)) : Store.state.settings.skill;
      Play.start({ color:Store.state.settings.color, skill, lineMoves:line });
      break;
    }
    case 'new-game': Play.cancel(); go('play'); break;
    case 'flip-board': {
      const S=Play.session;
      if(S){
        S.flipped=!S.flipped;
        Board.color=S.flipped ? (S.color==='w'?'b':'w') : S.color;
        Board.render();
        const label=document.querySelector('[data-act="flip-board"]');
        if(label) label.setAttribute('aria-pressed',String(S.flipped));
      }
      break;
    }
    case 'undo-play': Play.undo(); break;
    case 'end-play': {
      const S=Play.session;
      if(S&&!S.finished) Play.finishSession(S,'loss','resignation');
      break;
    }
    case 'review-play': {
      const S=Play.session;
      if(S&&S.pgn) runAnalysis([{url:null, pgn:S.pgn, time_class:'practice'}], {jumpTo:true});
      else toast('Finish or resign the game before reviewing it','err');
      break;
    }
    case 'bb-undo': { const B=ensureBuilderModel(App.builder); if(B){ const before=B.chess.history().join(' '); B.chess.undo(); const branch=activeBuilderBranch(B); if(branch && B.chess.history().join(' ')!==before) branch.moves=B.chess.history().join(' '); B._restored=true; Board.selected=null; B.selected=null; savePlaybook(); refreshBuilderUI(); } break; }
    case 'bb-branch': { const B=ensureBuilderModel(App.builder); if(B){ createBuilderBranch(B); savePlaybook(); refreshBuilderUI(); toast('Branch created'); } break; }
    case 'bb-switch': { const B=ensureBuilderModel(App.builder); if(B && switchBuilderBranch(B, t.dataset.id)){ savePlaybook(); refreshBuilderUI(); } break; }
    case 'bb-seek': {
      const B=ensureBuilderModel(App.builder); const target=+t.dataset.ply;
      if(B){ while(B.chess.history().length >= target && B.chess.history().length>0) B.chess.undo();
        B._restored=true; B.selected=null; Board.selected=null; savePlaybook(); refreshBuilderUI(); }
      break;
    }
    case 'bb-flip': { Store.state.settings.boardFlipped=!Store.state.settings.boardFlipped; Store.save(); refreshBuilderUI(); break; }
    case 'bb-clear': { const B=ensureBuilderModel(App.builder); if(B){ B.chess=new Chess(); B.branches=[{id:'main',name:'Main line',moves:''}]; B.activeBranchId='main'; B.selected=null; B._restored=true; Board.selected=null; Store.state.playbook=null; Store.save(); refreshBuilderUI(); } break; }
    case 'bb-save': saveBuilderLine(); break;
    case 'bb-practice': practiceFromChess(); break;
    case 'practice-line': {
      const line = Store.state.openingLines.find(l=>l.id===t.dataset.id);
      if(line){ Play.start({color:Store.state.settings.color, skill:Store.state.settings.skill, lineName:line.name, lineFen:line.fen, lineMoves:line.moves, deriveColorFromLine:true}); }
      break;
    }
    case 'del-line': {
      Store.state.openingLines = Store.state.openingLines.filter(l=>l.id!==t.dataset.id);
      Store.save(); render(); toast('Line deleted');
      break;
    }
    case 'load-games': {
      const username=reviewUsername();
      if(!username){ App.importState={...App.importState,username,usernameExplicit:true,loading:false,games:null,error:'Enter a chess.com username first.',errorKind:'validation'}; render(); break; }
      if(Engine.offline){ App.importState={...App.importState,username,usernameExplicit:true,loading:false,games:null,error:'Engine offline — game import is unavailable until the engine is ready.',errorKind:'validation'}; render(); break; }
      const now=new Date();
      const requestId = ++App.importRequestId;
      if(App.importAbort) App.importAbort.abort();
      const controller = new AbortController(); App.importAbort = controller;
      App.importState = {year:now.getFullYear(), month:now.getMonth(), username, loadedUsername:username, usernameExplicit:true, games:null, filter:'all', selected:new Set(), loading:true, error:null, errorKind:null, requestId};
      render();
      Importer.month(username, App.importState.year, App.importState.month, controller.signal)
        .then(g=>{ if(App.importState.requestId!==requestId) return; App.importState.games=g; App.importState.loading=false; render(); })
        .catch(err=>{ if(err.name==='AbortError' || App.importState.requestId!==requestId) return; App.importState.loading=false; App.importState.error=err.message||String(err); render(); });
      break;
    }
    case 'prev-month': case 'next-month': {
      const imp=App.importState;
      let {year,month}=imp;
      month += act==='prev-month'?-1:1;
      if(month<0){month=11;year--;} if(month>11){month=0;year++;}
      const username=reviewUsername();
      if(!username){ App.importState={...App.importState,username,usernameExplicit:true,loading:false,games:null,error:'Enter a chess.com username first.',errorKind:'validation'}; render(); break; }
      if(Engine.offline){ App.importState={...App.importState,username,usernameExplicit:true,loading:false,games:null,error:'Engine offline — game import is unavailable until the engine is ready.',errorKind:'validation'}; render(); break; }
      Object.assign(imp,{username,loadedUsername:username,usernameExplicit:true,year,month,games:null,loading:true,selected:new Set(),error:null,errorKind:null});
      const requestId=++App.importRequestId;
      if(App.importAbort) App.importAbort.abort();
      const controller=new AbortController(); App.importAbort=controller; imp.requestId=requestId;
      render();
      Importer.month(username, year, month, controller.signal)
        .then(g=>{ if(imp.requestId!==requestId) return; imp.games=g; imp.loading=false; render(); })
        .catch(err=>{ if(err.name==='AbortError' || imp.requestId!==requestId) return; imp.loading=false; imp.error=err.message||String(err); render(); });
      break;
    }
    case 'analyze-selected': {
      const imp=App.importState;
      const picked=[...imp.selected].map(i=>imp.games[i]).filter(Boolean);
      const owner=String(imp.loadedUsername||imp.username||'').trim() || Store.state.settings.username;
      if(picked.length) runAnalysis(picked, {username:owner});
      break;
    }
    case 'paste-pgn': openPasteModal(); break;
    case 'open-analyzed': {
      const key = String(t.dataset.key||'');
      const rec = key && Object.prototype.hasOwnProperty.call(Store.state.analyzed,key) ? Store.state.analyzed[key] : null;
      if(rec) Review.open(rec);
      break;
    }
    case 'back-list': Review.data=null; Review.branch=null; Review._altRequestId=(Review._altRequestId||0)+1; go('review'); break;
    case 'nav-start': if(Review.data) Review.setPly(0); break;
    case 'nav-end': if(Review.data) Review.setPly(Review.hist.length); break;
    case 'nav-prev': if(Review.data) Review.setPly(Review.nav-1); break;
    case 'nav-next': if(Review.data) Review.setPly(Review.nav+1); break;
    case 'play-best': if(Review.data && !Review.playBest()) toast('No legal best move at this position','err'); break;
    case 'clear-arrows': Board.clearArrows(); break;
    case 'flip-review': if(Review.data) Review.flip(); break;
    case 'cancel-analysis':
      App.analysisCancelled = true;
      App.analysisRunId++;
      App.analyzing = null;
      render();
      break;
    case 'save-settings': {
      const u = $('#s-user').value.trim();
      if(u){ Store.state.settings.username=u; Store.save(); refreshAccountChip(); App.startAutoSync(3000); toast('Saved'); }
      break;
    }
    case 'sync-now':
      App.syncNow().then(n=>toast(n ? 'Analyzed '+n+' new finished game'+(n===1?'':'s') : 'No new finished games found')).catch(()=>toast('Could not check chess.com games','err'));
      break;
    case 'export': {
      const blob=new Blob([JSON.stringify(Store.state,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='chesslab-export.json'; a.click();
      URL.revokeObjectURL(a.href); toast('Exported');
      break;
    }
    case 'import-json': {
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
        const r=new FileReader();
        r.onload=()=>{ try{
          const d=validateState(JSON.parse(r.result), {strict:true});
          Store.state=d; Store.save({immediate:true}); applyTheme(); render(); toast('Imported');
        }
          catch(e){ toast('Invalid file','err'); } };
        r.readAsText(f); };
      inp.click(); break;
    }
    case 'reset-data': {
      openModal('Clear all data?','<p class="muted">Deletes analyzed games, saved lines and settings.</p>',(root,close)=>{
        root.querySelector('.modal-body').insertAdjacentHTML('beforeend','<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-ghost btn-sm" data-x>Cancel</button><button class="btn btn-danger btn-sm" id="do-reset">Delete everything</button></div>');
        root.querySelector('[data-x]').addEventListener('click',()=>root.querySelector('[data-close]').click());
        root.querySelector('#do-reset').addEventListener('click',()=>{ Store.reset(); close(); applyTheme(); render(); toast('All data cleared'); });
      });
      break;
    }
    case 'progress-scope': {
      const u=String(t.dataset.username||'').trim().slice(0,80);
      App.progressScope=u;
      render();
      const head=document.getElementById('progress-scope-current');
      if(head && typeof head.focus==='function'){ try{ head.focus({preventScroll:true}); }catch(e){ head.focus(); } }
      break;
    }
    case 'progress-scope-clear': {
      App.progressScope='';
      render();
      const head=document.getElementById('progress-scope-current');
      if(head && typeof head.focus==='function'){ try{ head.focus({preventScroll:true}); }catch(e){ head.focus(); } }
      break;
    }
    case 'go-openings': go('openings'); break;
  }
}

/* =================== ANALYSIS RUNNER =================== */
async function runAnalysis(list, {jumpTo=false, background=false, username=''}={}){
  if(!Engine.ready){ if(!background) toast('Engine not ready yet','err'); return 0; }
  if(background && App.analyzing) return 0;
  const runId = ++App.analysisRunId;
  App.analysisCancelled = false;
  const mt = Store.state.settings.reviewMovetime;
  let completed = 0;
  const currentRun = ()=>App.analysisRunId===runId && !App.analysisCancelled;
  for(const gm of list){
    if(!gm || typeof gm.pgn!=='string' || !gm.pgn.trim()){ if(!background) toast('Invalid game data','err'); continue; }
    const rawKey = typeof gm.url==='string' ? gm.url : '';
    const fallbackKey = 'pgn:'+hashStr(gm.pgn);
    const key = safeRecordKey(rawKey || fallbackKey, fallbackKey);
    const white = gm.white && typeof gm.white.username==='string' ? gm.white.username : 'Unknown';
    const black = gm.black && typeof gm.black.username==='string' ? gm.black.username : 'Unknown';
    const label = gm.white || gm.black ? white+' vs '+black : 'Pasted game';
    const rawDate = Number(gm.end_time);
    const date = Number.isFinite(rawDate) && Math.abs(rawDate) <= 8640000000000
      ? new Date(rawDate*1000).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
    if(!currentRun()) return 0;
    if(background) App.syncState.running=true;
    else{
      App.analyzing = {runId, label, done:0, total:1};
      App.view='review'; render();
    }
    try{
        const res = await analyzeGame(gm.pgn, {
      movetime: mt,
      onProgress:(d,tot)=>{ if(!currentRun()) return; if(background) return; if(!App.analyzing || App.analyzing.runId!==runId) return; App.analyzing.done=d; App.analyzing.total=tot;
        const bar=document.querySelector('.progress-wrap i'); if(bar) bar.style.width=Math.round(d/tot*100)+'%';
        const lbl=document.querySelector('#ana-count'); if(lbl) lbl.textContent='position '+d+'/'+tot; },
        isCancelled:()=>!currentRun(),
      });
      const normalized = validateState({settings:Store.state.settings, analyzed:{[key]:{ key, url:rawKey||null, username, pgn:gm.pgn,
                date, headers:res.headers, plies:res.plies, summary:res.summary, movetime:mt }}}, {strict:true}).analyzed[key];
      if(!currentRun()) return 0;
      if(!normalized) throw new Error('Analysis record failed validation');
      Store.state.analyzed[key] = normalized;
      completed++;
      Store.save();
      if(!background){
        if(App.analyzing && App.analyzing.runId===runId) App.analyzing=null;
        if(jumpTo) Review.open(Store.state.analyzed[key]);
        else render();
      }
    }catch(err){
      if(String(err.message)==='cancelled'){
        if(!background && App.analyzing && App.analyzing.runId===runId) App.analyzing=null;
        if(currentRun() && !background){ toast('Analysis cancelled'); render(); }
        return 0;
      }
      if(!currentRun()) return 0;
      if(!background){
        if(App.analyzing && App.analyzing.runId===runId) App.analyzing=null;
        toast('Analysis failed: '+err.message,'err');
        render();
      }
    }
  }
  return completed;
}

/* =================== BUILDER / PRACTICE HELPERS =================== */
function ensureBuilderModel(B){
  if(!B) return null;
  if(!Array.isArray(B.branches)) B.branches=[];
  if(!B.branches.length){
    B.branches.push({id:'main', name:'Main line', moves:B.chess.history().join(' ')});
  }
  if(!B.activeBranchId || !B.branches.some(b=>b.id===B.activeBranchId)) B.activeBranchId=B.branches[0].id;
  return B;
}
function activeBuilderBranch(B){
  ensureBuilderModel(B);
  return B.branches.find(b=>b.id===B.activeBranchId) || B.branches[0];
}
function syncBuilderBranch(B){
  const branch=activeBuilderBranch(B);
  if(branch) branch.moves=B.chess.history().join(' ');
  return branch;
}
function createBuilderBranch(B, name){
  ensureBuilderModel(B);
  const branch={id:uid(), name:String(name||('Branch '+(B.branches.length+1))).slice(0,120), moves:B.chess.history().join(' ')};
  B.branches.push(branch); B.activeBranchId=branch.id; B.selected=null; Board.selected=null;
  return branch;
}
function switchBuilderBranch(B, id){
  ensureBuilderModel(B);
  const branch=B.branches.find(b=>b.id===id); if(!branch) return false;
  const g=new Chess();
  for(const tok of sanitizeMoves(branch.moves||'')){ try{ const mv=g.move(tok); if(!mv) break; }catch(e){ break; } }
  B.chess=g; B.activeBranchId=branch.id; B.selected=null; B._restored=true; Board.selected=null;
  return true;
}
function recordBuilderMove(B, san){
  ensureBuilderModel(B);
  const branch=activeBuilderBranch(B);
  const tokens=String(branch.moves||'').split(/\s+/).filter(Boolean);
  const pos=B.chess.history().length;
  const expected=tokens[pos];
  const diverged=!!expected && expected!==san;
  const legal=B.chess.moves({verbose:true}).find(m=>m.san===san);
  if(!legal) return false;
  if(diverged) createBuilderBranch(B, 'Alternative');
  const applied=B.chess.move({from:legal.from,to:legal.to,promotion:legal.promotion});
  if(!applied) return false;
  // Replaying an existing continuation must not erase its stored suffix;
  // a newly-created divergent branch must be committed with the new move.
  if(diverged || !expected) syncBuilderBranch(B);
  B._restored=true; return true;
}
function builderDiverges(B, move){
  const branch=activeBuilderBranch(B); if(!branch) return false;
  const tokens=String(branch.moves||'').split(/\s+/).filter(Boolean);
  const expected=tokens[B.chess.history().length];
  return !!expected && expected!==move.san;
}
function commitBuilderBoard(B){
  ensureBuilderModel(B);
  const branch=activeBuilderBranch(B);
  if(!branch) return null;
  const live=B.chess.history();
  const stored=sanitizeMoves(branch.moves||'');
  const isPrefixOfStored=stored.length>=live.length && stored.slice(0,live.length).every((tok,i)=>tok===live[i]);
  if(isPrefixOfStored && live.length<stored.length) return branch; // seeking: keep the committed suffix
  if(stored.length===live.length && stored.every((tok,i)=>tok===live[i])) return branch;
  branch.moves=live.join(' ');
  return branch;
}
function savePlaybook(){
  const B = ensureBuilderModel(App.builder); if(!B) return;
  // Persist the committed branch lines. The live board may be a prefix while
  // the user is seeking; seeking must not truncate the stored line.
  commitBuilderBoard(B);
  const branch = activeBuilderBranch(B);
  if(!branch) return;
  const nameInput = $('#bb-name');
  const branchFen=(()=>{ const g=new Chess(); for(const tok of sanitizeMoves(branch.moves||'')){ if(!g.move(tok)) break; } return g.fen(); })();
  Store.state.playbook = { name: (nameInput && nameInput.value.trim()) || B.name || '',
    moves: branch.moves, fen: branchFen, branches: B.branches.map(b=>({id:b.id,name:b.name,moves:b.moves})), activeBranchId: B.activeBranchId, updated: Date.now() };
  Store.save();
}
function restorePlaybook(){
  const B = ensureBuilderModel(App.builder); if(!B) return;
  const pb = Store.state.playbook;
  if(!pb) return;
  if(B.chess.history().length || B._restored) return;          // live board wins over the draft
  try{
    if(Array.isArray(pb.branches) && pb.branches.length){
      B.branches=pb.branches.filter(b=>b && typeof b.id==='string').map((b,i)=>({id:b.id,name:String(b.name||('Branch '+(i+1))).slice(0,120),moves:String(b.moves||'')}));
      B.activeBranchId=pb.activeBranchId && B.branches.some(b=>b.id===pb.activeBranchId) ? pb.activeBranchId : B.branches[0].id;
      switchBuilderBranch(B, B.activeBranchId);
    } else {
      for(const tok of sanitizeMoves(pb.moves || '')){
        try{ if(!B.chess.move(tok)) break; }catch(e){ break; }
      }
    }
    if(pb.name && !B.name) B.name = pb.name;
    B._restored=true;
  }catch(e){}
}
function saveBuilderLine(){
  const B = ensureBuilderModel(App.builder);
  if(!B || !B.chess.history().length){ toast('Play some moves first','err'); return; }
  const name = ($('#bb-name')&&$('#bb-name').value.trim()) || 'My line';
  Store.state.openingLines.push({ id:uid(), name, fen:null, moves:B.chess.history().join(' '), created:Date.now() });
  savePlaybook();
  Store.save(); toast('Line "'+name+'" saved'); render();
}
function practiceFromChess(){
  const B = ensureBuilderModel(App.builder);
  if(!B || !B.chess.history().length){ toast('Play some moves first (or practice from start)','err'); return; }
  const branch=activeBuilderBranch(B);
  if(!branch) return;
  const lineFen=null;
  const lineMoves=B.chess.history().join(' ');
  savePlaybook();
  Play.start({ color:Store.state.settings.color, skill:Store.state.settings.skill, lineName:branch.name||'My line', lineFen, lineMoves, deriveColorFromLine:true });
}

/* =================== IMPORTER =================== */
const Importer = {
  async _get(url, signal){
    const attempts = [
      ()=>fetch(url, {headers:{'Accept':'application/json'}, signal}),
      ()=>fetch('https://corsproxy.io/?'+encodeURIComponent(url), {signal}),
      ()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url), {signal}),
    ];
    let lastErr;
    for(const a of attempts){
      try{ const r = await a(); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
      catch(e){ lastErr=e; if(e && e.name==='AbortError') throw e; }
    }
    throw lastErr||new Error('network error');
  },
  month(u,y,m,signal){ return this._get(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/games/${y}/${String(m+1).padStart(2,'0')}`, signal).then(j=>Array.isArray(j.games)?j.games:[]); },
  stats(u){ return this._get(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/stats`).catch(()=>null); },
};

/* =================== APP STATE + NAV + RENDER + PLAY + OPENINGS BUILDER =================== */

  { id:'play', label:'Play' },

  { id:'progress', label:'Progress' },
  { id:'settings', label:'Settings' },

const App = {
  view:'play',
  play:null,
  builder:null,       // {chess, name, selected}
  progressScope:'',
  importState:{year:null, month:null, games:null, filter:'all', selected:new Set(), loading:false, error:null, requestId:0, username:'', loadedUsername:'', usernameExplicit:false},
  importRequestId:0, importAbort:null, accountRequestId:0,
  analysisRunId:0, analysisCancelled:false,
  syncState:{running:false,lastChecked:0,lastError:null,lastAdded:0},
  syncTimer:null,
  startAutoSync(delay=30000){
    this.stopAutoSync();
    if(!Store.state.settings.autoSyncChessCom || !Store.state.settings.username) return;
    const run=()=>{
      this.syncTimer=null;
      this.syncChessComGames().finally(()=>{ if(Store.state.settings.autoSyncChessCom) this.startAutoSync(300000); });
    };
    this.syncTimer=setTimeout(run, Math.max(1000, Number(delay)||30000));
    if(this.syncTimer && typeof this.syncTimer.unref==='function') this.syncTimer.unref();
  },
  stopAutoSync(){ if(this.syncTimer){ clearTimeout(this.syncTimer); this.syncTimer=null; } },
  async syncNow(){ return this.syncChessComGames({force:true}); },
  async syncChessComGames({force=false, analyze=null}={}){
    if(this.syncState.running) return 0;
    const username=Store.state.settings.username;
    if(!force && !Store.state.settings.autoSyncChessCom) return 0;
    if(!username) return 0;
    if(!analyze && (!Engine.ready || Engine.offline)){ this.syncState.lastError='Engine not ready'; return 0; }
    this.syncState.running=true; this.syncState.lastError=null;
    try{
      const now=new Date();
      const games=await Importer.month(username, now.getFullYear(), now.getMonth());
      const fresh=(Array.isArray(games)?games:[]).filter(gm=>{
        if(!gm || typeof gm.pgn!=='string') return false;
        const pgn=gm.pgn.trim();
        if(!pgn || /\bnoresult\b|\*\s*$/.test(pgn)) return false;
        const moveText = pgn.replace(/\{[^}]*\}/g,' ').replace(/\[[^\]]*\]/g,' ').replace(/\$\d+/g,' ').replace(/;[^\n]*/g,' ').trim();
        if(!/\b(1-0|0-1|1\/2-1\/2)\b/.test(moveText)) return false;
        if(!Number.isFinite(Number(gm.end_time)) || Number(gm.end_time)<=0) return false;
        const key=safeRecordKey(typeof gm.url==='string'&&gm.url?gm.url:'pgn:'+hashStr(pgn),'record');
        return !Object.prototype.hasOwnProperty.call(Store.state.analyzed,key);
      }).slice(0,5);
      if(!fresh.length){ this.syncState.lastAdded=0; return 0; }
      const added=analyze ? await analyze(fresh) : await runAnalysis(fresh,{background:true});
      this.syncState.lastAdded=Math.max(0, Number(added)||0);
      if(App.view==='review' && !App.analyzing) render();
      return this.syncState.lastAdded;
    }catch(e){
      this.syncState.lastError=String(e && e.message ? e.message : e).slice(0,200);
      return 0;
    }finally{
      this.syncState.running=false;
      this.syncState.lastChecked=Date.now();
    }
  },
  onEngineStatus(){
    const chip = document.getElementById('chip-engine');
    if(chip){
      const cls = Engine.status==='ready'?'ok':Engine.status==='offline'?'err':'warn';
      chip.innerHTML = '<span class="dot '+cls+'"></span>Engine: '+Engine.status;
    }
    if(Engine.status==='ready' && Store.state.settings.autoSyncChessCom && !this.syncTimer) this.startAutoSync(3000);
  },
};
const Play = {
  session:null, _thinking:false, _generation:0, _turnToken:0,
  cancel(){
    this._generation++;
    this._turnToken++;
    Engine.cancelPlay();
    this._thinking=false;
    if(this.session) this.session.cancelled=true;
    this.session=null;
  },
  start({color, skill, lineName, lineFen, lineMoves, deriveColorFromLine=false}){
    let chess;
    try{ chess = lineFen? new Chess(lineFen) : new Chess(); }
    catch(e){ toast('Invalid start position','err'); return; }
    const tokens = sanitizeMoves(lineMoves||'');
    let err=null; const lineUci=[];
    for(const tok of tokens){
      let mv=null;
      try{ mv = chess.move(tok); }catch(e){}
      if(!mv && /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(tok)){
        mv = chess.move({from:tok.slice(0,2), to:tok.slice(2,4), promotion:tok[4]||undefined});
      }
      if(!mv){ err = 'Move "'+tok+'" is not legal in this position.'; break; }
      lineUci.push(mv.from+mv.to+(mv.promotion||''));
    }
    if(err){ toast(err,'err'); return; }
    const history = chess.history({verbose:true});
    const lastLineMove = history.length ? history[history.length-1] : null;
    const requestedColor = color==='b' ? 'b' : 'w';
    const playerColor = deriveColorFromLine && lastLineMove
      ? (lastLineMove.color==='b' ? 'b' : 'w')
      : requestedColor;
    const engineColor = playerColor==='w' ? 'b' : 'w';
    const generation=++this._generation;
    const turnToken=++this._turnToken;
    this.session = { id:uid(), generation, turnToken, chess, color:playerColor, engineColor, skill:Math.max(0,Math.min(20,+skill||0)), lineName:lineName||null, lineUci, lineErr:err, lineLastMover:lastLineMove ? (lastLineMove.color==='b'?'b':'w') : null, finished:false, cancelled:false, result:null, termination:null, pgn:null, flipped:false };
    this._thinking=false;
    this.checkEnd(this.session);
    App.view='play'; render();
    if(!this.session.finished) this.engineTurn();
  },
  _valid(S){ return !!(S && this.session===S && S.generation===this._generation && !S.cancelled); },
  undo(){
    const S=this.session;
    if(!this._valid(S) || S.finished) return false;
    const beforeLen=S.chess.history().length;
    if(!beforeLen) return false;
    const previousLinePly=beforeLen;
    Engine.cancelPlay();
    this._turnToken++;
    S.turnToken=this._turnToken;
    this._thinking=false;
    const hist=S.chess.history({verbose:true});
    // Undo one complete turn: the engine reply and the human move that led to it.
    // If the human has just moved and the engine is still thinking, only take back that ply.
    if(hist.length>=2 && hist[hist.length-1].color===S.engineColor && hist[hist.length-2].color===S.color) S.chess.undo();
    S.chess.undo();
    // A scripted opening line must not immediately replay the move just taken back.
    if(S.lineUci && S.lineUci.length>previousLinePly) S.lineUci=S.lineUci.slice(0,previousLinePly);
    S.pgn=null; S.result=null; S.termination=null;
    this.renderBoard();
    if(!S.finished) this.engineTurn();
    return true;
  },
  engineTurn(){
    const S=this.session;
    if(!this._valid(S) || S.finished || S.chess.turn()!==S.engineColor) return;
    const ply = S.chess.history().length;
    if(ply < S.lineUci.length){
      const scripted = S.lineUci[ply];
      const legal = S.chess.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===scripted);
      if(legal){
        const generation=S.generation;
        const turnToken=S.turnToken;
        this._thinking=true; updatePlayPanels();
        setTimeout(()=>{ if(this._valid(S) && S.generation===generation && this._turnToken===turnToken){ this._thinking=false; this._apply(scripted); } }, 350);
        return;
      }
    }
    this._thinking = true; updatePlayPanels();
    const generation=S.generation;
    const turnToken=S.turnToken;
    Engine.playMove(S.chess.fen(), S.skill).then(uci=>{
      if(!this._valid(S) || S.generation!==generation || this._turnToken!==turnToken) return;
      this._thinking=false;
      if(uci){ this._apply(uci); return; }
      const ms = S.chess.moves({verbose:true});
      if(ms.length){
        const caps = ms.filter(m=>m.captured);
        const pick = (caps.length && Math.random()<0.7) ? caps[Math.floor(Math.random()*caps.length)] : ms[Math.floor(Math.random()*ms.length)];
        this._apply(pick.from+pick.to+(pick.promotion||''));
      } else updatePlayPanels();
    }).catch(()=>{
      if(!this._valid(S) || S.generation!==generation || this._turnToken!==turnToken) return;
      const ms=S.chess.moves({verbose:true}).filter(m=>m && m.from && m.to);
      if(ms.length){
        const captures=ms.filter(m=>S.chess.isAttacked(m.to,m.color));
        const pool=captures.length?captures:ms;
        const pick=pool[Math.floor(Math.random()*pool.length)];
        this._apply(pick.from+pick.to+(pick.promotion||''));
      } else { this._thinking=false; updatePlayPanels(); }
    });
  },
  _apply(uci){
    const S=this.session;
    if(!this._valid(S) || S.finished) return;
    this._thinking=false;
    let mv = S.chess.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===uci);
    if(!mv){
      const legal=S.chess.moves({verbose:true});
      const caps=legal.filter(m=>m && m.from && m.to && m.captured);
      const pool=caps.length && Math.random()<0.7 ? caps : legal;
      mv=pool[Math.floor(Math.random()*pool.length)];
    }
    if(!mv){ this.checkEnd(S); this.renderBoard(); return; }
    try{ S.chess.move({from:mv.from,to:mv.to,promotion:mv.promotion}); }catch(e){ return; }
    this.checkEnd(S);
    this.renderBoard();
    if(!S.finished) this.engineTurn();
  },
  userPlay(from,to){
    const S=this.session;
    if(!this._valid(S) || S.finished || this._thinking) return false;
    if(S.chess.turn()!==S.color) return false;
    const mv = S.chess.moves({verbose:true}).find(m=>m.from===from&&m.to===to);
    if(!mv) return false;
    S.chess.move({from,to,promotion:mv.promotion});
    this.checkEnd(S);
    this.renderBoard();
    if(!S.finished) this.engineTurn();
    return true;
  },
  finishSession(S, result, termination='normal'){
    if(!S || S.finished) return false;
    const g=S.chess;
    S.finished=true; S.result=result; S.termination=termination;
    const resultMarker = result==='draw' ? '1/2-1/2' : (result==='win' ? (S.color==='w'?'1-0':'0-1') : (S.color==='w'?'0-1':'1-0'));
    g.header('Event','ChessLab','White', S.color==='w'?'You':'Stockfish ('+S.skill+')',
      'Black', S.color==='b'?'You':'Stockfish ('+S.skill+')',
      'Date', new Date().toISOString().slice(0,10).replace(/-/g,'.'),
      'Termination', termination, 'Result', resultMarker);
    S.pgn=g.pgn(); savePlayGameLocal(S); this._thinking=false; updatePlayPanels();
    return true;
  },
  checkEnd(S){
    const g=S.chess;
    if(g.in_checkmate()) this.finishSession(S, g.turn()===S.color?'loss':'win', 'checkmate');
    else if(g.in_draw()||g.in_stalemate()||g.in_threefold_repetition()||g.insufficient_material()) this.finishSession(S, 'draw', g.in_stalemate()?'stalemate':g.insufficient_material()?'insufficient material':g.in_threefold_repetition()?'threefold repetition':'draw');
  },
  renderBoard(){
    const b=document.getElementById('board');
    if(!b||!this.session) return;
    const hist=this.session.chess.history({verbose:true});
    const last = hist.length? {from:hist[hist.length-1].from,to:hist[hist.length-1].to} : null;
    Board.render({lastMove:last}); updatePlayPanels();
  },
};
function savePlayGameLocal(S){
  if(!S || !S.pgn) return;
  const list=Array.isArray(Store.state.practiceGames)?Store.state.practiceGames:[];
  const rec={id:S.id || uid(), date:new Date().toISOString(), pgn:S.pgn, result:S.result || ''};
  Store.state.practiceGames=[rec, ...list.filter(x=>x.id!==rec.id)].slice(0,50);
  Store.save();
}

  return '<h1>Openings Workshop</h1>'+
    '<p class="muted mt-8">Play the moves you want to practice (for both sides), save the line, then practice it: the engine answers along your line and takes over where it ends.</p>'+
    '<div class="game-grid mt-14"><div class="board-col">'+
    '<div class="players-strip"><span class="avatar">&#9998;</span><span>Move builder &mdash; play moves for <b>both sides</b> in order</span></div>'+
    '<div id="builder-board"></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-ghost btn-sm" data-act="bb-undo">&#8630; Undo</button>'+
    '<button class="btn btn-ghost btn-sm" data-act="bb-flip">&#8645; Flip</button>'+
    '<button class="btn btn-ghost btn-sm" data-act="bb-clear">Clear</button>'+
    '<button class="btn btn-green btn-sm" data-act="bb-save">Save line</button>'+
    '<button class="btn btn-green btn-sm" data-act="bb-practice">Practice from here</button>'+
    '</div></div><div class="panel">'+
    '<div class="card card-pad"><div class="field"><span class="field-label">Practice sides</span><div data-opening-sides class="small muted">You: <b>'+derivedSides.you+'</b> · Engine: <b>'+derivedSides.engine+'</b></div><div class="small faint">Derived from the last move in your line; the engine takes the next turn.</div></div>'+
    '<div class="field"><label for="bb-name">Line name</label>'+
    '<input class="input" id="bb-name" placeholder="e.g. My Alapin setup" value="'+esc(B.name||'')+'"></div>'+
    '<div class="small muted">Moves: <b id="bb-count">'+B.chess.history().length+'</b> plies</div></div>'+
    '<div class="moves-box" style="max-height:240px"><div class="moves-grid">'+(rows||'<p class="small muted" style="grid-column:1/-1;padding:12px">Play moves on the board to build your line.</p>')+'</div></div>'+
    branchList+
    linesHTML+
    '</div></div>';
}
</script>
