<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessLab — Openings Trainer &amp; Free Game Review</title>
<meta name="description" content="Practice openings against Stockfish from your own move orders, and review your chess.com games automatically — free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2381b64c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='19' fill='white'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
/* ================= TOKENS (chess.com palette) ================= */
:root{
  --green:#81b64c; --green-dark:#5d8534; --green-soft:rgba(129,182,76,.14);
  --bg:#f7f6f5; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f5f3f1;
  --border:#e3e1df; --border-soft:#edebe9;
  --text:#312e2b; --text-2:#6b6a67; --text-3:#9a9894;
  --nav-bg:#262421; --nav-text:#c8c6c4; --nav-text-active:#ffffff;
  --shadow:0 1px 2px rgba(49,46,43,.06),0 4px 16px -6px rgba(49,46,43,.10);
  --shadow-lg:0 8px 30px -8px rgba(49,46,43,.22);
  --r:10px; --r-lg:14px;
  --sq-l:#f0d9b5; --sq-d:#b58863; --board-border:#3d3933;
  --best:#81b64c; --brill:#26c2a3; --great:#26c2a3; --exc:#95bb4a;
  --good:#95bb4a; --book:#a88865; --inac:#f7c631; --mist:#ffa459; --blun:#fa412d;
  --eval-white:#f7f6f5; --eval-black:#4b4847;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="dark"] .coord-file,html[data-theme="dark"] .coord-rank{color:inherit}
html[data-theme="dark"]{
  --bg:#21201e; --bg-2:#2a2826; --surface:#2a2826; --surface-2:#312e2c;
  --border:#3d3a37; --border-soft:#3a3734;
  --text:#f0f0ee; --text-2:#b3b0ad; --text-3:#8a8784;
  --nav-bg:#262421; --nav-text:#c8c6c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px -6px rgba(0,0,0,.35);
  --sq-l:#ebecd0; --sq-d:#739552; --board-border:#3d3933;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.skip{position:absolute;left:-9999px;top:0;background:var(--green);color:#fff;padding:8px 14px;border-radius:8px;z-index:300}
.skip:focus{left:12px;top:12px}

/* ================= TOP NAV (chess.com style) ================= */
.topnav{background:var(--nav-bg);height:56px;display:flex;align-items:center;padding:0 20px;gap:8px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:0 14px 0 4px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:17px}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{color:var(--nav-text);font-weight:600;font-size:14px;padding:0 16px;height:100%;position:relative;transition:color .15s}
.tabs button:hover{color:var(--nav-text-active)}
.tabs button[aria-current="page"]{color:var(--nav-text-active)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--green);border-radius:3px 3px 0 0}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ver-badge{color:rgba(255,255,255,.45);font-size:11px;font-weight:700;padding:0 6px}
.nav-chip{color:var(--nav-text);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);padding:5px 11px;border-radius:999px}
.nav-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3,#8a8784)}
.nav-chip .dot.ok{background:var(--green)}
.nav-chip .dot.err{background:#fa412d}
.nav-chip .dot.warn{background:#f7c631}
html,body{overflow-x:hidden}
.pagewrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}

/* ================= GENERIC ================= */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:18px}
h1{font-size:22px;letter-spacing:-.02em}
h2{font-size:16px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:12.5px}
.mt-8{margin-top:8px}.mt-14{margin-top:14px}.mt-20{margin-top:20px}
hr.sep{border:none;border-top:1px solid var(--border-soft);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;min-height:40px;transition:filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dark)}
.btn-ghost{border-color:var(--border);color:var(--text);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{border-color:#f0c4bd;color:#d63c1e;background:var(--surface)}
.btn-danger:hover{background:#fdf1ee}
.btn-sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;min-height:40px;font-size:14px}
.input:focus{outline:none;border-color:var(--green)}
textarea.input{resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
label,.field-label{font-size:13px;font-weight:600;color:var(--text-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text-2)}
.err{color:#d63a2f;font-size:12.5px;font-weight:600;display:none}
.err.show{display:block}
.empty{padding:40px 20px;text-align:center}
.empty h3{font-size:16px;margin-bottom:4px}
.empty p{color:var(--text-2);font-size:14px;max-width:420px;margin:0 auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--border-soft)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border-soft)}
table.tbl tr:last-child td{border-bottom:none}

/* toast + modal */
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;justify-items:center}
.toast{background:var(--nav-bg);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:tIn .22s ease both}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.out{animation:tOut .22s ease both}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(30,28,26,.55);z-index:90;display:grid;place-items:center;padding:20px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:540px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.modal-head h2{font-size:16px}
.modal-body{padding:14px 20px 20px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);cursor:pointer;font-size:16px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* ================= BOARD (chess.com style) ================= */
.board-wrap{display:flex;gap:12px;align-items:stretch}
.board-outer{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px -6px rgba(49,46,43,.35);flex:none}
/* --bw must be declared on all three boards, beside the width rule that
   defines it. It was only ever set on #board inside the 880px media query, so
   #review-board and #builder-board saw an undefined var() and every calc()
   built on it resolved against a fixed 560px fallback instead of the real
   board width -- which on a narrow screen means oversized chrome. */
#board,#builder-board,#review-board{position:relative;width:min(560px,92vw);--bw:min(560px,92vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
#board .squares,#builder-board .squares,#review-board .squares{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
#board .sq,#builder-board .sq,#review-board .sq{position:relative}
#board .sq.l,#builder-board .sq.l,#review-board .sq.l{background:var(--sq-l)} #board .sq.d,#builder-board .sq.d,#review-board .sq.d{background:var(--sq-d)}
#board .sq .coord-f,#board .sq .coord-r{position:absolute;font-size:calc(var(--bw,560px)/56);font-weight:700;opacity:.9}
#board .coord-file{bottom:2%;right:4%}
#board .coord-rank{top:3%;left:5%}
#board .sq.l .coord{color:var(--sq-d)} #board .sq.d .coord{color:var(--sq-l)}
#board .hl,#builder-board .hl,#review-board .hl{position:absolute;inset:0;background:rgba(255,255,51,.42)}
#board .hl-sel,#builder-board .hl-sel,#review-board .hl-sel{position:absolute;inset:0;background:rgba(255,255,51,.5)}
#board .hl-check,#builder-board .hl-check,#review-board .hl-check{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,60,40,.75) 20%,rgba(255,60,40,.28) 55%,transparent 75%)}
#board .hint-dot,#builder-board .hint-dot,#review-board .hint-dot{position:absolute;width:31%;height:31%;left:34.5%;top:34.5%;border-radius:50%;background:rgba(20,20,10,.22)}
#board .hint-ring,#builder-board .hint-ring,#review-board .hint-ring{position:absolute;inset:5%;border-radius:50%;border:6px solid rgba(20,20,10,.28);background:none}
/* pieces: absolutely-positioned divs, transformed — CSS transition makes moves glide */
.piece{position:absolute;width:12.5%;height:12.5%;left:0;top:0;z-index:10;will-change:transform;pointer-events:none}
.piece svg{width:100%;height:100%;display:block;pointer-events:none}
.piece.dragging{z-index:30;transition:none!important;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.piece.snapped{transition:transform .13s ease}
.piece.moving{transition:transform .16s cubic-bezier(.2,.85,.3,1)}
.piece.captured{transition:opacity .12s ease,transform .16s ease;opacity:0}
#board .arrow-layer,#builder-board .arrow-layer,#review-board .arrow-layer{position:absolute;inset:0;z-index:20;pointer-events:none}
#board .coord-layer,#builder-board .coord-layer,#review-board .coord-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.piece svg .pc-w{--pc-fill:#ffffff;--pc-stroke:#2b2926;--pc-detail:#2b2926}
.piece svg .pc-b{--pc-fill:#3d3a37;--pc-stroke:#211f1d;--pc-detail:#e8e4dc}
.piece svg path[stroke],.piece svg path:not([stroke]){stroke-width:1.45;stroke-linejoin:round}
.evalbar{width:20px;border-radius:5px;overflow:hidden;background:var(--eval-black);position:relative;flex:none;border:1px solid var(--border-soft)}
.evalbar .white{position:absolute;bottom:0;left:0;right:0;background:var(--eval-white);transition:height .35s ease}
.eval-num{font-weight:800;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}

/* game layout */
.game-grid{display:grid;grid-template-columns:minmax(auto,600px) minmax(320px,400px);gap:22px;justify-content:center;align-items:start}
.board-col{display:flex;flex-direction:column;gap:10px}
.players-strip{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.players-strip .avatar{width:34px;height:34px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;border:1px solid var(--border)}
.panel{display:flex;flex-direction:column;gap:12px}
.moves-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);max-height:400px;overflow:auto}
.moves-grid{display:grid;grid-template-columns:38px 1fr 1fr;font-size:14px}
.moves-grid .mv-row{display:contents}
.mv-num{color:var(--text-3);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.mv{padding:6px 10px;font-weight:600;display:flex;align-items:center;gap:7px;border-radius:0;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-size:14px}
.mv:hover{background:var(--surface-2)}
.mv.cur{background:rgba(129,182,76,.16);box-shadow:inset 0 0 0 2px var(--green)}
.mv-dot{width:9px;height:9px;border-radius:50%;flex:none}
.mv-ico{font-size:11px;line-height:1;flex:none;width:14px;text-align:center;font-weight:700;overflow:hidden;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Segoe UI Emoji",system-ui,sans-serif}
.cls-ink-brilliant{color:#00695c}.cls-ink-great{color:#166534}.cls-ink-best{color:#3f6212}
.cls-ink-excellent{color:#854d0e}.cls-ink-good{color:#7c3f06}.cls-ink-book{color:#5b21b6}
.cls-ink-inaccuracy{color:#9a3412}.cls-ink-mistake{color:#991b1b}.cls-ink-blunder{color:#7f1d1d}
.cls-ink-q{color:#374151}
html[data-theme="dark"] .cls-ink-brilliant{color:#5eead4}
html[data-theme="dark"] .cls-ink-great{color:#86efac}
html[data-theme="dark"] .cls-ink-best{color:#bef264}
html[data-theme="dark"] .cls-ink-excellent{color:#fde047}
html[data-theme="dark"] .cls-ink-good{color:#fcd34d}
html[data-theme="dark"] .cls-ink-book{color:#c4b5fd}
html[data-theme="dark"] .cls-ink-inaccuracy{color:#fdba74}
html[data-theme="dark"] .cls-ink-mistake{color:#fca5a5}
html[data-theme="dark"] .cls-ink-blunder{color:#fecaca}
html[data-theme="dark"] .cls-ink-q{color:#b0b8c4}
.mv-badge{
  /* Sized against ONE SQUARE, not the board: this element is absolutely
     positioned inside .badge-layer, which is inset:0 on the whole board, so a
     bare 26% would be 26% of 560px = 2.08 squares and would spill over the
     neighbours. One square is 12.5% of the board; 30% of that is a small
     corner mark that clears the piece glyph.
     The glyph MUST track the same box. A font size derived from the board
     (--bw/16) left a 35px glyph in this 21px box, which overflow:hidden
     clipped into an unreadable disc -- and the error grew on narrow screens.
     Sizing both off the board at a fixed ratio keeps the glyph ~0.62x the box
     at every board size. */
  position:absolute;width:var(--mv-badge,3.75%);height:var(--mv-badge,3.75%);
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;pointer-events:none;
  /* 3.75% of the board * 0.62 = a glyph that fits the 3.75% box.
     The fallback is required only if --bw is somehow unset; it is declared
     on all three board ids. */
  font-size:calc(var(--bw,560px) * 0.02325);line-height:1;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 1px 3px rgba(0,0,0,.4);
  /* Segoe UI Symbol / Apple Symbols carry the MONOCHROME (text-presentation)
     forms of U+2B50, U+1F44D and U+1F4D6, which is what the badge needs: a
     white glyph that inherits the badge colour. Segoe UI Emoji is listed last
     purely as a fallback -- it would render colour emoji that ignore the badge
     background, which is the failure mode U+FE0E exists to prevent. */
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Segoe UI Emoji",system-ui,sans-serif;
  overflow:hidden
}
.cls-brilliant{background:#0f766e}.cls-great{background:#15803d}.cls-best{background:#4d7c0f}
.cls-excellent{background:#a16207}.cls-good{background:#b45309}.cls-book{background:#6d28d9}
.cls-inaccuracy{background:#c2410c}.cls-mistake{background:#b91c1c}.cls-blunder{background:#991b1b}
.cls-q{background:#4b5563}
html[data-theme="dark"] .cls-brilliant{background:#00d9c0}
html[data-theme="dark"] .cls-great{background:#4ade80}
html[data-theme="dark"] .cls-best{background:#a3e635}
html[data-theme="dark"] .cls-excellent{background:#fde047}
html[data-theme="dark"] .cls-good{background:#fbbf24}
html[data-theme="dark"] .cls-book{background:#a78bfa}
html[data-theme="dark"] .cls-inaccuracy{background:#fb923c}
html[data-theme="dark"] .cls-mistake{background:#f87171}
html[data-theme="dark"] .cls-blunder{background:#ef4444}
html[data-theme="dark"] .cls-q{background:#9ca3af}
.cls-badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 13px;border-radius:8px;background:var(--surface-2)}
.cls-badge i{width:10px;height:10px;border-radius:50%}
.review-ctl{display:flex;gap:6px;justify-content:center}
.ctl{width:42px;height:42px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:15px;display:grid;place-items:center;cursor:pointer}
.ctl:hover{border-color:var(--green);color:var(--text)}
.ctl[disabled]{opacity:.4;cursor:default}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

/* cards for lists */
.gm-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:13.5px;cursor:pointer}
.gm-row:last-child{border-bottom:none}
.gm-row:hover{background:var(--surface-2)}
.res-win{color:var(--green);font-weight:700}.res-loss{color:#e0392a;font-weight:700}.res-draw{color:var(--text-2);font-weight:700}
.progress-wrap{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress-wrap i{display:block;height:100%;background:var(--green);transition:width .25s}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(129,182,76,.12);border:1px solid var(--green);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
.banner.warn{background:rgba(247,198,49,.13);border-color:#f7c631}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:16px}
.stat .label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--text-3)}

@media (max-width:980px){
  .game-grid{grid-template-columns:1fr}
  /* --bw must move with the width rule, or the calc()s that consume it
     (badge glyph size, coordinate labels, capture ring) keep measuring
     against the desktop board. */
  #board,#builder-board,#review-board{width:min(94vw,560px);--bw:min(94vw,560px)}
}
@media (max-width:880px){
  .logo span.name{display:none}
  .tabs button{padding:0 10px;font-size:12.5px}
  .nav-chip{display:none}
  .pagewrap{padding:12px 12px 40px}
  /* #board{--bw:...} used to live here and applied to #board only. The 980px
     block above now sets --bw for all three boards, so this is redundant. */
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat .value{font-size:20px}

@media (max-width:560px){
  .topnav{padding:0 8px;gap:2px}
  .tabs{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;min-width:0}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:0 11px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  .pagewrap{padding:10px 10px 36px}
  .game-grid{gap:14px}
}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="topnav">
  <div class="logo"><span class="mark">♞</span><span class="name">ChessLab</span></div>
  <nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
  <div class="nav-right" id="nav-chips"></div>
<span class="ver-badge" title="ChessLab version">v2.7.8</span>
</header>
<main id="main" class="pagewrap" tabindex="-1"></main>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="chess.js"></script>
<script>
'use strict';
/* ChessLab v2 — chess.com-style UI + engine/logic overhaul
   (this script tag intentionally left minimal; layers follow in subsequent script blocks) */
</script>

<script>

const $ = (s, el=document) => el.querySelector(s);

function toast(msg, kind=''){

function openModal(title, bodyHTML, onMount){
  const root = $('#modal-root');
  const previous = document.activeElement;
  // bodyHTML is reserved for trusted, static templates; never pass imported/user data here.
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body"></div></div></div>`;
  root.querySelector('.modal-body').innerHTML=String(bodyHTML||'');
  let closed = false;
  const close = ()=>{
    if(closed) return; closed = true;
    document.removeEventListener('keydown', keydown, true);
    root.innerHTML='';
    if(previous && typeof previous.focus === 'function' && document.contains(previous)) previous.focus();
  };
  const keydown = e=>{
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const focusable = [...root.querySelectorAll('button,input,textarea,select,[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled);
    if(!focusable.length) return;
    const first=focusable[0], last=focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  };
  root.querySelector('[data-close]').addEventListener('click', close);
  root.querySelector('.modal-backdrop').addEventListener('mousedown', e=>{ if(e.target.classList.contains('modal-backdrop')) close(); });
  document.addEventListener('keydown', keydown, true);
  if(onMount) onMount(root, close);

  return close;
}

/* Store — same localStorage key as v1 so analyzed games/settings survive the upgrade */
const STORAGE_VERSION = 3;
const DEFAULT_SETTINGS = { username:'', reviewMovetime:700, theme:'light', skill:8, color:'w', showEvalInReview:true, boardFlipped:false, autoSyncChessCom:true };
const SAFE_ID = /^[A-Za-z0-9_-]{1,96}$/;
const SAFE_UCI = /^[a-h][1-8][a-h][1-8][qrbn]?$/i;
const UNSAFE_OBJECT_KEYS = new Set(['__proto__','prototype','constructor','toString','valueOf','hasOwnProperty','isPrototypeOf','propertyIsEnumerable','toLocaleString']);
const CLASSES = new Set(['brilliant','great','best','excellent','good','book','inaccuracy','mistake','blunder','q','?']);
function defaultState(){
  return { version:STORAGE_VERSION, settings:{...DEFAULT_SETTINGS}, openingLines:[], analyzed:{}, playbook:null, practiceGames:[] };
}
function isRecord(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function boundedInt(v, min, max, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(min, Math.min(max, Math.round(n))) : fallback;
}
function boundedNumber(v, min, max, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
}
function safeString(v, max=500){ return typeof v === 'string' ? v.slice(0, max) : ''; }
function safeRecordKey(value, fallback='record'){
  const s=safeString(value,500).trim();
  return s && !UNSAFE_OBJECT_KEYS.has(s) ? s : fallback;
}
function normalizeEval(raw, strict=false){
  if(raw == null) return null;
  if(!isRecord(raw)){ if(strict) throw new Error('Invalid engine evaluation'); return null; }
  const out = {};
  // v1 used cpWhite/mate/bestUci; v2 uses the explicit best* names.
  const cp = raw.bestCpWhite ?? raw.cpWhite;
  const mate = raw.bestMateWhite ?? raw.mate;
  const best = raw.best ?? raw.bestUci;
  const invalid = value => value != null && (typeof value !== 'string' || !SAFE_UCI.test(value));
  if(strict && (invalid(best) || invalid(raw.best) || invalid(raw.bestUci) || invalid(raw.bestPv) || invalid(raw.secondPv))) throw new Error('Invalid engine move');
  if(cp !== null && cp !== undefined) out.bestCpWhite = boundedNumber(cp, -100000, 100000, null);
  if(mate !== null && mate !== undefined) out.bestMateWhite = boundedNumber(mate, -1000, 1000, null);
  if(typeof best === 'string' && SAFE_UCI.test(best)) out.best = best.toLowerCase();
  if(typeof raw.bestPv === 'string' && SAFE_UCI.test(raw.bestPv)) out.bestPv = raw.bestPv;
  if(typeof raw.secondPv === 'string' && SAFE_UCI.test(raw.secondPv)) out.secondPv = raw.secondPv;
  return Object.keys(out).length ? out : null;
}
function normalizePly(raw, index, strict=false){
  if(!isRecord(raw)) throw new Error('Invalid ply record');
  if(raw.mover != null && raw.mover !== 'w' && raw.mover !== 'b') throw new Error('Invalid ply mover');
  const fenBefore = safeString(raw.fenBefore, 120);
  const uci = typeof raw.uci === 'string' && SAFE_UCI.test(raw.uci) ? raw.uci.toLowerCase() : '';
  const san = safeString(raw.san, 32);
  if(!fenBefore || !san) throw new Error('Invalid ply record');
  const evalBefore = normalizeEval(raw.evalBefore ?? raw.evalBeforeActual, strict);
  const evalAfter = normalizeEval(raw.evalAfter ?? raw.evalAfterActual, strict);
  const out = {
    i: boundedInt(raw.i ?? index, 0, 10000, index), san, uci, fenBefore,
    mover: raw.mover === 'b' ? 'b' : 'w', moveNum: boundedInt(raw.moveNum, 1, 5000, Math.floor(index/2)+1),
    evalBefore, evalAfter, cls: CLASSES.has(raw.cls) ? raw.cls : '?', delta: raw.delta == null ? null : boundedNumber(raw.delta, 0, 100, null),
    wpBefore: raw.wpBefore == null ? null : boundedNumber(raw.wpBefore, 0, 100, null),
    wpAfter: raw.wpAfter == null ? null : boundedNumber(raw.wpAfter, 0, 100, null),
    onlyMoveGap: raw.onlyMoveGap == null ? null : boundedNumber(raw.onlyMoveGap, -100000, 100000, null)
  };
  if(typeof raw.bestSan === 'string') out.bestSan = safeString(raw.bestSan, 32);
  if(strict && raw.bestUci != null && (typeof raw.bestUci !== 'string' || !SAFE_UCI.test(raw.bestUci))) throw new Error('Invalid best move');
  if(typeof raw.bestUci === 'string' && SAFE_UCI.test(raw.bestUci)) out.bestUci = raw.bestUci.toLowerCase();
  if(out.bestUci && !uciToSan(fenBefore,out.bestUci)) throw new Error('Invalid best move');
  if(Number.isFinite(raw.sacPawns)) out.sacPawns = boundedNumber(raw.sacPawns, -100, 100, 0);
  return out;
}
function normalizeSummary(raw){
  if(!isRecord(raw)) return {};
  const out={};
  for(const color of ['white','black']){
    const side=raw[color]; if(!isRecord(side)) continue;
    const s={};
    for(const field of ['accuracy','moves','brilliant','great','best','excellent','good','book','inaccuracy','mistake','blunder']){
      if(side[field] == null) continue;
      const n=Number(side[field]);
      if(Number.isFinite(n)) s[field]=boundedNumber(n, field==='accuracy'?0:0, field==='accuracy'?100:10000, field==='accuracy'?0:0);
    }
    if(Object.keys(s).length) out[color]=s;
  }
  return out;
}
function validateAnalyzedChain(plies, hist, startFen){
  if(!Array.isArray(plies) || !Array.isArray(hist) || plies.length !== hist.length) throw new Error('Analyzed game ply count mismatch');
  const replay = new Chess(startFen);
  for(let i=0;i<hist.length;i++){
    const p=plies[i], expected=hist[i];
    if(!p || !expected || p.san!==expected.san || p.mover!==expected.color || !p.uci || p.fenBefore!==replay.fen()) throw new Error('Analyzed game ply mismatch');
    const vm=replay.moves({verbose:true}).find(m=>m.san===expected.san);
    if(!vm || sanToUci(replay,expected.san)!==p.uci) throw new Error('Analyzed game ply mismatch');
      if(p.evalBefore && p.evalBefore.best && !uciToSan(replay.fen(),p.evalBefore.best)) throw new Error('Invalid engine move');
    if(p.bestUci && !uciToSan(replay.fen(),p.bestUci)) throw new Error('Invalid best move');
    if(p.bestUci && p.evalBefore && p.evalBefore.best && p.bestUci!==p.evalBefore.best) throw new Error('Inconsistent best move');
    if(p.bestSan && p.bestUci && p.bestSan!==uciToSan(replay.fen(),p.bestUci)) throw new Error('Inconsistent best move');
    replay.move({from:vm.from,to:vm.to,promotion:vm.promotion});
    if(p.evalAfter && p.evalAfter.best && !uciToSan(replay.fen(),p.evalAfter.best)) throw new Error('Invalid engine move');
  }

}
function normalizeRecord(raw, key, strict){
  if(!isRecord(raw)) throw new Error('Invalid analyzed game');
    const pgn = safeString(raw.pgn, 200000);
  if(!pgn) throw new Error('Analyzed game has no PGN');
  let parsed;
  try{ parsed = new Chess(); if(!parsed.load_pgn(pgn,{sloppy:true}) || !parsed.history().length) throw new Error('Invalid PGN'); }
  catch(e){ throw new Error('Analyzed game has invalid PGN'); }
  const hist = parsed.history({verbose:true});
  const startFen = pgnStartFen(pgn, parsed.header() || {});
  const plies = Array.isArray(raw.plies) ? raw.plies.map((p,i)=>normalizePly(p,i,strict)) : [];
  if(!plies.length) throw new Error('Analyzed game has no plies');
  if(plies.length !== hist.length) throw new Error('Analyzed game ply count mismatch');
  validateAnalyzedChain(plies, hist, startFen);
  const headers = {};
  if(isRecord(raw.headers)) for(const h of ['White','Black','WhiteElo','BlackElo','Result','ECO','Date','TimeControl','Termination','Link']) if(raw.headers[h] != null) headers[h] = safeString(raw.headers[h], 200);
  const summary = normalizeSummary(raw.summary);
  if(strict && raw.username != null && typeof raw.username !== 'string') throw new Error('Invalid analysis username');
  return { key: safeRecordKey(key || raw.key, 'record'), url: typeof raw.url === 'string' ? safeString(raw.url, 1000) : null, username: safeString(raw.username, 80).trim(), pgn, date: safeString(raw.date, 40), headers, plies, summary, movetime: boundedInt(raw.movetime, 100, 10000, 700) };
}
function validateState(raw, {strict=true}={}){
  if(!isRecord(raw)) throw new Error('Invalid application state');
  const out = defaultState();
  const inputSettings = isRecord(raw.settings) ? raw.settings : {};
  if(strict && raw.settings != null && !isRecord(raw.settings)) throw new Error('Invalid settings');
  const theme = ['light','dark','system'].includes(inputSettings.theme) ? inputSettings.theme : DEFAULT_SETTINGS.theme;
  const username = safeString(inputSettings.username, 80).trim();
  out.settings = {
    username: username,
    reviewMovetime: boundedInt(inputSettings.reviewMovetime, 200, 5000, DEFAULT_SETTINGS.reviewMovetime),
    theme, skill: boundedInt(inputSettings.skill, 0, 20, DEFAULT_SETTINGS.skill),
    color: inputSettings.color === 'b' ? 'b' : 'w', showEvalInReview: inputSettings.showEvalInReview !== false,
    boardFlipped: inputSettings.boardFlipped === true || (inputSettings.boardFlipped == null && inputSettings.color === 'b'),
    autoSyncChessCom: inputSettings.autoSyncChessCom !== false
  };
  if(strict && inputSettings.username != null && typeof inputSettings.username !== 'string') throw new Error('Invalid username');
  if(raw.openingLines != null && !Array.isArray(raw.openingLines) && strict) throw new Error('Invalid opening lines');
  if(raw.analyzed != null && !isRecord(raw.analyzed) && strict) throw new Error('Invalid analyzed games');
  if(raw.practiceGames != null && !Array.isArray(raw.practiceGames) && strict) throw new Error('Invalid practice games');
  const lines = Array.isArray(raw.openingLines) ? raw.openingLines : [];
  for(const line of lines){
    if(!isRecord(line)) { if(strict) throw new Error('Invalid opening line'); continue; }
    const id = safeString(line.id, 96);
    if(!SAFE_ID.test(id)) { if(strict) throw new Error('Invalid opening line id'); continue; }
    const name = safeString(line.name, 120).trim(); const moves = safeString(line.moves, 20000);
    if(!name && !moves) { if(strict) throw new Error('Invalid opening line'); continue; }
    let fen = line.fen == null ? null : safeString(line.fen, 120);
    if(fen){ try{ new Chess(fen); }catch(e){ if(strict) throw new Error('Invalid opening position'); fen=null; } }
    out.openingLines.push({id, name:name || 'My line', fen, moves, created: boundedInt(line.created, 0, Date.now()+86400000, Date.now())});
  }
  const analyzed = isRecord(raw.analyzed) ? raw.analyzed : {};

    if(UNSAFE_OBJECT_KEYS.has(key)){ if(strict) throw new Error('Invalid analyzed game key'); continue; }
    try{ out.analyzed[safeRecordKey(key,'record')] = normalizeRecord(analyzed[key], key, strict); }
    catch(e){ if(strict) throw e; }
  }

    if(!isRecord(raw.playbook)){ if(strict) throw new Error('Invalid playbook'); }
    else {
      const pbMoves = sanitizeMoves(raw.playbook.moves);
      const pbFen = safeString(raw.playbook.fen,120);
      if(pbFen){ try{ new Chess(pbFen); }catch(e){ if(strict) throw new Error('Invalid playbook position'); } }
      const rawBranches = Array.isArray(raw.playbook.branches) ? raw.playbook.branches.slice(0,100) : [];
      const branches = [];
      const branchIds = new Set();
      for(const rawBranch of rawBranches){
        if(!isRecord(rawBranch)){ if(strict) throw new Error('Invalid opening branch'); continue; }
        const id = safeString(rawBranch.id,96);
        if(!SAFE_ID.test(id) || branchIds.has(id)){ if(strict) throw new Error('Invalid opening branch id'); continue; }
        const name = safeString(rawBranch.name,120).trim();
        const rawMoves = safeString(rawBranch.moves,20000).trim();
        const moves = sanitizeMoves(rawMoves).join(' ').slice(0,20000);
        if(rawMoves && !moves){ if(strict) throw new Error('Invalid opening branch moves'); continue; }
        branchIds.add(id);
        branches.push({id, name:name || ('Branch '+branches.length), moves});
      }
      if(!branches.length && (pbMoves.length || safeString(raw.playbook.name,120).trim())){
        branches.push({id:'main', name:'Main line', moves:pbMoves.join(' ')});
      }
      const requestedActive = safeString(raw.playbook.activeBranchId,96);
      const activeBranchId = branches.some(b=>b.id===requestedActive) ? requestedActive : (branches[0] ? branches[0].id : null);
      out.playbook = {name:safeString(raw.playbook.name,120), moves:pbMoves.join(' '), fen:pbFen||null, branches, activeBranchId, updated:boundedInt(raw.playbook.updated,0,Date.now()+8640000000000,Date.now())};
    }
  }
  if(Array.isArray(raw.practiceGames)) out.practiceGames = raw.practiceGames.filter(isRecord).slice(0,50).map(g=>{
    const id=safeString(g.id,96); if(!SAFE_ID.test(id)) return null;
    const pgn=safeString(g.pgn,200000); if(!pgn) return null;
    try{ const parsed=new Chess(); if(!parsed.load_pgn(pgn,{sloppy:true}) || !parsed.history().length) return null; }catch(e){ return null; }
    return {id,date:safeString(g.date,40),pgn,result:safeString(g.result,16)};
  }).filter(Boolean);
  if(strict && Array.isArray(raw.practiceGames) && out.practiceGames.length !== Math.min(50, raw.practiceGames.length)) throw new Error('Invalid practice game');
  return out;
}
const Store = {
  key:'chesslab.v1', state:null, _saveTimer:null,
  defaults(){ return defaultState(); },
  load(){
    try{
      const raw = localStorage.getItem(this.key);
      this.state = raw ? validateState(JSON.parse(raw), {strict:false}) : defaultState();
    }catch(e){ console.warn('store load failed — using safe defaults', e); this.state = defaultState(); }
    return this.state;
  },
  save({immediate=false}={}){
    clearTimeout(this._saveTimer);
    const write = ()=>{ try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(e){ toast('Could not save — storage full?','err'); } };
    if(immediate) write(); else this._saveTimer = setTimeout(write, 180);
  },
  flush(){ clearTimeout(this._saveTimer); try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(e){ toast('Could not save — storage full?','err'); } },
  reset(){ this.state = defaultState(); this.save({immediate:true}); }
};

function applyTheme(){
  const t = Store.state.settings.theme;
  const sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = (t==='system') ? sys : t;
}

/* =================== ENGINE (SF18 asm + MultiPV) =================== */
const Engine = {
  worker:null, ready:false, offline:false, status:'loading',
  _queue:[], _busy:false, _cur:null, _gotUciOk:false, _hsTimer:null, _srcIdx:-1,
  _generation:0, _sourceGeneration:-1, _searchId:0, _stopTimer:null,
  SOURCES:[
    'https://unpkg.com/stockfish@18.0.8/bin/stockfish-18-asm.js',
    'https://cdn.jsdelivr.net/npm/stockfish@18.0.8/bin/stockfish-18-asm.js',
    'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.js',
  ],
  start(){ if(this.status !== 'loading' || this.worker) return; this._try(0); },
  _flushPending(error){
    clearTimeout(this._stopTimer);
    const rejectTask = t=>{
      if(t._settled) return;
      if(t.play) this._settle(t, null); else this._settle(t, null, error || new Error('Engine restarted'));
    };
    if(this._cur){ const c=this._cur; this._cur=null; this._busy=false; rejectTask(c); }
    const q=this._queue.splice(0); for(const t of q) rejectTask(t);
  },
  _try(idx, preserveQueue=false){
    clearTimeout(this._hsTimer);
    this.ready=false; this.offline=false; this._gotUciOk=false;
    const old=this.worker; this.worker=null; if(old){ try{ old.terminate(); }catch(e){} }
    const active=this._cur;
    if(!preserveQueue){
      this._flushPending(new Error('Engine worker restarted'));
    }else if(active && !active._settled){
      if(active.play) this._settle(active, null);
      else {
        clearTimeout(active.timeoutId);
        this._queue.unshift(active);
      }
    }
    this._busy=false; this._cur=null;
    if(idx >= this.SOURCES.length){
      this.offline=true; this.status='offline';
      this._flushPending(new Error('Engine unavailable'));
      App.onEngineStatus();
      return;
    }
    this._srcIdx=idx; this.status='loading'; this._generation++;
    const generation=this._generation; this._sourceGeneration=generation;
    const blobSrc = `try{ importScripts(${JSON.stringify(this.SOURCES[idx])}); }catch(err){ self.postMessage('__fatal:'+String(err)); }`;
    let worker;
    try{ worker = new Worker(URL.createObjectURL(new Blob([blobSrc],{type:'text/javascript'}))); }
    catch(e){ this._try(idx+1, preserveQueue); return; }
    worker.onmessage = e=>{ if(generation !== this._generation || worker !== this.worker) return; this._onMsg(e); };
    worker.onerror = ()=>{ if(generation === this._generation) this._try(idx+1, preserveQueue); };
    this.worker = worker;
    this._hsTimer = setTimeout(()=>{ if(generation === this._generation && !this.ready) this._try(idx+1, preserveQueue); }, 25000);
    worker.postMessage('uci');
  },
  _onMsg(e){
    const line = typeof e.data==='string' ? e.data : (e.data && e.data.data);
    if(typeof line!=='string') return;
    if(line.startsWith('__fatal')){ this._try(this._srcIdx+1, true); return; }
    if(line.startsWith('uciok')){
      this._gotUciOk = true;
      this.worker.postMessage('setoption name MultiPV value 2');
      this.worker.postMessage('setoption name Threads value 1');
      this.worker.postMessage('isready');
      return;
    }
    if(line.startsWith('readyok') && this._gotUciOk && !this.ready){
      clearTimeout(this._hsTimer);
      this.ready = true; this.status = 'ready';
      App.onEngineStatus();
      this._pump();
      return;
    }
    this._dispatch(line);
  },
  /* Serial queue. Each task: {fen, movetime, multiPV} -> resolves
     {moves:[{uci,cpWhite,mate,depth}], best, bestCpWhite, secondCpWhite} */
  _queue:[], _busy:false,
  analyse(fen, movetime=700, multiPV=2){
    return new Promise((resolve,reject)=>{
      this._queue.push({fen, movetime, multiPV, resolve, reject, kind:'analysis'});
      this._pump();
    });
  },
  _pump(){
    if(this._busy || !this._queue.length) return;
    if(this.offline || !this.worker || !this.ready){
      if(this.offline){ const t=this._queue.shift(); t.reject ? t.reject(new Error('Engine offline')) : t.resolve(null); this._pump(); }
      return;
    }
    this._busy = true;
    const t = this._queue.shift(); this._cur = t; t.generation=this._generation; t.searchId=++this._searchId;
    const timeoutMs = Math.max(5000, Number(t.movetime || 700) * 5 + 2000);
    t.timeoutId = setTimeout(()=>{
      if(this._cur !== t) return;
      this._stopCurrent(t, t.play ? null : new Error('Engine search timed out'), t.play ? null : new Error('Engine search timed out'));
    }, timeoutMs);
    try{
      this.worker.postMessage('setoption name MultiPV value '+(t.play ? 1 : Math.max(1, t.multiPV || 2)));
      this.worker.postMessage('setoption name Skill Level value '+(t.play ? Math.max(0,Math.min(20,Number(t.skill ?? 8))) : 20));
      this.worker.postMessage('position fen '+t.fen);
      this.worker.postMessage('go movetime '+Math.max(1, Number(t.movetime || 700)));
    }catch(e){ this._finish(t, t.play ? null : e, t.play ? null : e); }
  },
  _settle(task, result, error){
    if(task._settled) return;
    task._settled=true;
    clearTimeout(task.timeoutId);
    if(error && task.reject) task.reject(error); else task.resolve(result);
  },
  _restartAfterStop(task){
    if(this._cur !== task || !task._stopping) return;
    clearTimeout(this._stopTimer);
    this._cur = null; this._busy = false; task._stopping = false;
    this._try(this._srcIdx, true);
  },
  _stopCurrent(task, result, error){
    if(this._cur !== task) return;
    this._settle(task, result, error);
    task._stopping=true;
    try{ this.worker && this.worker.postMessage('stop'); }catch(e){}
    this._stopTimer=setTimeout(()=>this._restartAfterStop(task), 1000);
  },
  _finish(task, result, error){
    clearTimeout(task.timeoutId);
    clearTimeout(this._stopTimer);
    if(this._cur !== task) return;
    this._cur=null; this._busy=false; task._stopping=false;
    if(!task._settled) this._settle(task, result, error);
    this._pump();
  },
  _dispatch(line){
    const t = this._cur;
    if(!t || t.generation !== this._generation || t.searchId !== this._searchId) return;
    if(t._stopping){
      if(line.startsWith('bestmove')) this._finish(t);
      return;
    }
    if(t.play){
      if(line.startsWith('bestmove')){
        const best = line.split(/\s+/)[1] || null;
        this._finish(t, best && best !== '(none)' ? best : null);
      }
      return;
    }
    // parse multipv info lines
    const mMPV = line.match(/\bmultipv (\d+)/);
    const mScore = line.match(/score (cp|mate) (-?\d+)/);
    const mPv = line.match(/\bpv ([a-h][1-8][a-h][1-8][qrbn]?)/);
    if(mScore && !/ upperbound | lowerbound /.test(line)){
      const kind = mScore[1], v = +mScore[2];
      const whiteToMove = t.fen.split(' ')[1]==='w';
      const cpWhite = kind==='cp' ? (whiteToMove? v : -v) : null;
      const mateWhite = kind==='mate' ? (whiteToMove? v : -v) : null;
      const pvUci = mPv ? mPv[1] : null;
      if(!t._moves) t._moves = [];
      const mpv = mMPV ? +mMPV[1] : 1;
      // keep LAST (deepest) info per multipv line
      if(mpv===1){ t._r1 = {cpWhite, mateWhite, pvUci}; }
      else if(mpv===2){ t._r2 = {cpWhite, mateWhite, pvUci}; }
    }
    if(line.startsWith('bestmove')){
      const bestUci = (line.split(/\s+/)[1]) || null;
      const r1 = t._r1 || {};
      const r2 = t._r2 || {};
      const result = {
        best: bestUci,
        bestCpWhite: r1.cpWhite ?? null,
        bestMateWhite: r1.mateWhite ?? null,
        bestPv: r1.pvUci || null,
        secondCpWhite: r2.cpWhite ?? null,
        secondPv: r2.pvUci || null,
        depth: null,
      };
      this._finish(t, result);
    }
  },
  /* Cancel only play-owned work; analysis requests remain queued. */
  cancelPlay(){
    if(this._cur && this._cur.play){
      this._stopCurrent(this._cur, null, null);
    }
    this._queue=this._queue.filter(t=>{
      if(!t.play) return true;
      this._settle(t, null); return false;
    });
    if(this._cur && this._cur._stopping) return;
    this._pump();
  },
  /* For play: set Skill Level, then a single-PV search */
  playMove(fen, skill){
    return new Promise((resolve,reject)=>{
      this._queue.push({fen, movetime:900, resolve, reject, skill, play:true, kind:'play'});
      this._pump();
    });
  },
};
/* The queue owns the complete task lifecycle: no wrapper may send commands before readiness. */

/* =================== CHESS HELPERS =================== */
function sanToUci(g, san){
  const mv = g.moves({verbose:true}).find(m=>m.san===san);
  return mv ? mv.from+mv.to+(mv.promotion||'') : null;
}
function uciToSan(fen, uci){
  try{
    const g = new Chess(fen);
    const mv = g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===uci);
    if(!mv) return null;
    return mv.san;
  }catch(e){ return null; }
}
function pieceVal(t){ return {p:1,n:3,b:3,r:5,q:9,k:0}[t]||0; }
function materialFor(board, color){
  let m=0; for(const row of board) for(const s of row){ if(s && s.color===color) m+=pieceVal(s.type); }
  return m;
}
/* lichess/chess.com win-probability model */
const WP = cp => 50 + 50*(2/(1+Math.exp(-0.00368208*cp)) - 1);
function wpWhiteOf(ev){ // ev {bestCpWhite, bestMateWhite}
  if(!ev) return 50;
  if(ev.bestMateWhite != null) return ev.bestMateWhite>0 ? 100 : ev.bestMateWhite<0 ? 0 : 50;
  return WP(ev.bestCpWhite||0);
}
function evalLabel(ev){
  if(!ev) return '?';
  if(ev.bestMateWhite != null){
    if(ev.bestMateWhite === 0) return '0.0';
    return ev.bestMateWhite>0 ? '#'+ev.bestMateWhite : '#-'+Math.abs(ev.bestMateWhite);
  }
  const v=(ev.bestCpWhite||0)/100;
  return (v>0?'+':'')+v.toFixed(1);
}
function isEval(ev){ return !!ev && (ev.bestCpWhite!=null || ev.bestMateWhite!=null); }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h>>>0); }

<script>
'use strict';
/* =================== CLASSIFICATION (chess.com model) ===================
   winProb model: lichess conversion; deltas in win% points, mover POV.
   Great move: engine's best is FAR better than its 2nd choice (only-move).
   Brilliant: best move + material sacrifice >= 2 pawns + not already winning. */
function moverCp(ev, field, mover){
  if(!ev || ev[field] == null) return null;
  return mover === 'b' ? -ev[field] : ev[field];
}
function materialBeforeAfter(fen, uci, mover){
  try{
    const g = new Chess(fen); const before=materialFor(g.board(), mover);
    const m=g.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===uci);
    if(!m) return {before, after:before};
    g.move({from:m.from,to:m.to,promotion:m.promotion});
    return {before, after:materialFor(g.board(), mover)};
  }catch(e){ return {before:null, after:null}; }
}
function materialRiskAfter(fen, uci, mover){
  try{
    const g = new Chess(fen);
    const m=g.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===uci);
    if(!m) return 0;
    g.move({from:m.from,to:m.to,promotion:m.promotion});
    // Material at risk = what the opponent can win from the piece this move
    // places, less what this move wins, and only when the defender cannot
    // answer.
    //   * Only captures ON the square we played to count. Material that was
    //     already loose elsewhere is not this move's doing.
    //   * A defender's recapture is credited back at its own value: a pawn
    //     answering a queen saves the pawn, not the queen.
    //   * A recapture that is itself met is no answer at all.
    // This measures material GIVEN, not material won later, so a positional
    // sacrifice that wins back more than it costs (a bishop taken to skewer a
    // queen) reports only the piece offered. The move is still ranked by the
    // engine's evaluation, so the class stays correct; this number is the
    // "Material invested" figure in the detail panel.
    // What this move wins: a capture nets it material, which offsets any
    // material it then risks giving back.
    const won = m.captured ? pieceVal(m.captured) : 0;
    // The opponent's best reply: take the piece we just offered on `to`, less
    // whatever the defender can win back with a recapture that holds.
    let risk = 0;
    for (const r of g.moves({verbose:true})) {
      if(!r.captured || r.to !== m.to) continue;
      const t = new Chess(g.fen());
      t.move({from:r.from,to:r.to,promotion:r.promotion});
      // The defender may recapture on the square the capturer now stands on.
      // That answers the capture, but not for free: a pawn answering a queen
      // still loses the difference, so credit back only what the recapturing
      // piece is worth, and only when the recapture itself holds. A recapture
      // that is itself met is no answer at all -- the threat lands on `a.to`,
      // where the recapturing piece now sits, not on `a.from`, which it has
      // just vacated.
      let recovered = 0;
      for (const a of t.moves({verbose:true})) {
        if(!a.captured || a.to !== r.to) continue;
        const b = new Chess(t.fen());
        b.move({from:a.from,to:a.to,promotion:a.promotion});
        if(b.moves({verbose:true}).some(x => x.captured && x.to === a.to)) continue;
        // The defender answers with whatever saves the most material.
        const val = pieceVal(a.piece);
        if(val > recovered) recovered = val;
      }
      const line = pieceVal(r.captured) - recovered;
      if(line > risk) risk = line;
    }
    const net = risk - won;
    if(net <= 0) return 0;
    return net;
  }catch(e){ return 0; }
}
/* Move-quality glyphs. The classes a player meets most often get a
   pictographic mark they recognise at a glance -- a star for a brilliant
   move, a thumbs-up for a great one, an open book for theory, ?! for an
   inaccuracy -- rather than an abstract tick or bar, which all read alike at
   the 11px this renders in the move list. The rarer classes keep the
   punctuation ladder, which is the convention on every chess site.
   Every glyph must stay DISTINCT: two classes sharing one icon makes the
   legend and the badge meaningless.
   The star, thumb and book are written as \uXXXX escapes carrying an explicit
   U+FE0E VARIATION SELECTOR-15, which forces TEXT presentation. Without it
   those codepoints default to EMOJI presentation and render as full-colour
   pictures -- a yellow star, a brown book -- which fight the badge's own
   background instead of inheriting its white. U+FE0E is invisible in the
   source, which is exactly why it is spelled out here as an escape. */
const CLS_ICON = {
  brilliant:'\u2B50\uFE0E', great:'\uD83D\uDC4D\uFE0E', best:'✓', excellent:'☑', good:'○',
  book:'\uD83D\uDCD6\uFE0E', inaccuracy:'?!', mistake:'✗', blunder:'✕', q:'·'
};
const CLS_LABEL = {brilliant:'Brilliant',great:'Great',best:'Best',excellent:'Excellent',good:'Good',book:'Book',inaccuracy:'Inaccuracy',mistake:'Mistake',blunder:'Blunder',q:'?'};
/* Resolve a stored/derived class to one we can actually render.
   hasOwnProperty, not `!== undefined`: these are object literals, so they
   inherit Object.prototype and 'constructor'/'toString' would otherwise pass
   validation and render native function source as the label. */
function clsOf(v, fallback){
  return Object.prototype.hasOwnProperty.call(CLS_ICON, v) ? v : fallback;
}
/* A move is "as good as the engine's top choice" when the win probability it
   gives up is within the noise floor of the search. Without this tolerance any
   move the engine happened not to rank first was mislabelled Excellent. */
const NEAR_BEST_DELTA = 1.0;
/* "Only move" is a claim about win probability, not raw centipawns: a 300cp
   gap between +15 and +18 is worth nothing, while 300cp across zero is huge. */
const ONLY_MOVE_WP_GAP = 8;
/* Opening book: the UCI moves that continue a standard opening line, keyed by
   the position (FEN) they are played from. A move is "Book" only when it is in
   a real opening AND it is also a sound move -- theory you misplayed is still
   an inaccuracy, a mistake or a blunder, never Book. */
const BOOK_LINES = [
  'e2e4e7e5g1f3b8c6f1b5a7a6e1g1g8f6f1e1',
  'e2e4e7e5g1f3b8c6f1c4f8c5',
  'e2e4e7e5g1f3b8c6d2d4e5d4f3d4g8f6',
  'e2e4e7e5g1f3b8c6d2d4e5d4',
  'e2e4e7e5g1f3b8c6b1c3',
  'e2e4e7e5g1f3g8f6f3e5',
  'e2e4c7c5g1f3d7d6d2d4c5d4f3d4g8f6b1c3a7a6',
  'e2e4c7c5g1f3b8c6d2d4c5d4f3d4g8f6b1c3d7d6',
  'e2e4c7c5c2c4g8f6b1c3d7d6d2d4c5d4g2g3',
  'e2e4c7c5g1f3d7d6d2d4c5d4f3d4g8f6b1c3a7a6c1g5',
  'e2e4e7e6d2d4d7d5e4e5c7c5c2c4b8c6b1c3g8f6',
  'e2e4e7e6d2d4d7d5b1c3g8f6c1g5f8e7d1d2e8g8',
  'e2e4c7c6d2d4d7d5b1c3g8f6c1g5e7e6g1f3',
  'e2e4c7c6d2d4d7d5b1c3g8f6',
  'd2d4d7d5c2c4c7c6g1f3g8f6c1g5e7e6e2e3f8e7',
  'd2d4d7d5c2c4c7c6',
  'e2e4d7d5e4d5d8d5',
  'c2c4e7e5g1f3g8f6g2g3',
  'g1f3d7d5g2g3',
  'e2e4g8f6e4e5f6d5d2d4d7d6',
  'e2e4d7d6d2d4g8f6b1c3g7g6g1f3f8g7',
  'd2d4g8f6c2c4g7g6b1c3f8g7e2e4d7d6g1f3',
  'd2d4g8f6c2c4g7g6b1c3d7d5c4d5f6d5e2e4d5c3',
  'd2d4g8f6c2c4e7e6b1c3f8b4e2e3e8g8',
  'd2d4d7d5g1f3g8f6c1f4',
  'd2d4d7d5c2c4e7e6b1c3g8f6c1g5f8e7g1f3e8g8',
  'e2e4e7e5b1c3g8f6f1c4f8c5',
  'e2e4e7e5g1f3b8c6d2d4e5d4f3d4g8f6d4c6b7c6',
  'd2d4d7d5c2c4e7e6g1f3g8f6c1g5f8e7d1d2e8g8',
  'd2d4d7d5c2c4e7e6b1c3g8f6c1g5f8e7d1d2e8g8'
];
let BOOK_MAP = null;
function bookMap(){
  if(BOOK_MAP) return BOOK_MAP;
  BOOK_MAP = new Map();
  try{
    for(const line of BOOK_LINES){
      const g = new Chess();
      for(let i=0;i<line.length;i+=4){
        const uci = line.slice(i,i+4);
        const m = g.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===uci);
        if(!m) break;
        // Key on piece placement, side to move and castling rights only. The
        // halfmove clock and the en passant square differ between move orders
        // that reach the same position, so including them missed most games.
        const key = g.fen().split(' ').slice(0, 3).join(' ');
        if(!BOOK_MAP.has(key)) BOOK_MAP.set(key, new Set());
        BOOK_MAP.get(key).add(uci);
        g.move({from:m.from,to:m.to,promotion:m.promotion});
      }
    }
  }catch(e){ BOOK_MAP = new Map(); }
  return BOOK_MAP;
}
function isBookMove(fen, uci){
  const set = bookMap().get(String(fen || '').split(' ').slice(0, 3).join(' '));
  return !!(set && set.has(uci));
}
function classifyPly(ply, prevEval, curEval, mover, moveNum){
  // prevEval: engine result at position BEFORE the move; curEval: result at position AFTER
  if(!isEval(prevEval) || !isEval(curEval)) return {cls:'?', delta:null};
  const white = mover==='w';
  const wpB = white ? wpWhiteOf(prevEval) : 100-wpWhiteOf(prevEval);
  const wpA = white ? wpWhiteOf(curEval)  : 100-wpWhiteOf(curEval);
  const delta = Math.max(0, Math.round((wpB-wpA)*10)/10);
  const playedUci = ply.uci;
  const bestUci = prevEval.best;
  const isEngineBest = !!bestUci && playedUci===bestUci;
  const playedRisk = materialRiskAfter(ply.fenBefore, playedUci, mover);
  const sacPawns = playedRisk;
  const bestCpMover = moverCp(prevEval, 'bestCpWhite', mover);
  const secondCpMover = moverCp(prevEval, 'secondCpWhite', mover);
  // Only-move gap measured in win-probability points, so it means the same
  // thing in a sharp middlegame and in a position that is already decided.
  const onlyMoveGap = (bestCpMover!=null && secondCpMover!=null)
    ? Math.abs(WP(bestCpMover) - WP(secondCpMover))
    : null;

  let cls;
  if(isEngineBest || delta <= NEAR_BEST_DELTA){
    // Only a real, playable sacrifice counts, and only while the position is
    // still in play: giving material up in a won position is not brilliant.
    if(sacPawns >= 2 && delta <= 2 && wpB >= 35 && wpB <= 85) cls = 'brilliant';
    else if(onlyMoveGap != null && onlyMoveGap >= ONLY_MOVE_WP_GAP && moveNum >= 2) cls = 'great';
    else if(moveNum <= 10 && isBookMove(ply.fenBefore, playedUci)) cls = 'book';
    else cls = 'best';
  }
  else if(delta <= 2) cls = 'excellent';
  else if(delta <= 5) cls = 'good';
  else if(delta <= 10) cls = 'inaccuracy';
  else if(delta <= 20) cls = 'mistake';
  else cls = 'blunder';
  return {cls, delta, wpBefore:Math.round(wpB*10)/10, wpAfter:Math.round(wpA*10)/10, sacPawns, onlyMoveGap};
}

/* =================== ANALYSIS PIPELINE =================== */
function pgnStartFen(pgn, headers){
  const raw = headers && typeof headers.FEN==='string' ? headers.FEN : (String(pgn||'').match(/\[FEN\s+"([^"]+)"\]/i)||[])[1];
  if(!raw) return new Chess().fen();
  const fen=safeString(raw,120);
  try{ return new Chess(fen).fen(); }catch(e){ throw new Error('Invalid PGN start position'); }
}
async function analyzeGame(pgn, { movetime=700, onProgress=()=>{}, isCancelled=()=>false } = {}){
  const g = new Chess();
  if(!g.load_pgn(pgn, {sloppy:true})) throw new Error('Could not parse PGN');
  const headers = g.header() || {};
  const startFen = pgnStartFen(pgn, headers);
  const rep = new Chess(startFen);
  const hist = g.history({verbose:true});
  if(!hist.length) throw new Error('No moves in game');
  const plies = [];
  for(let i=0;i<hist.length;i++){
    const m = hist[i];
    const fenBefore = rep.fen();
    const uci = sanToUci(rep, m.san);
    const mv = rep.moves({verbose:true}).find(x=>x.san===m.san);
    if(!uci || !mv) throw new Error('Could not replay PGN at move '+(i+1));
    rep.move({from:mv.from,to:mv.to,promotion:mv.promotion});
    pliesPush();
    function pliesPush(){
      plies.push({ i, san:m.san, uci, fenBefore, mover:m.color, moveNum:Math.floor(i/2)+1,
                   evalBefore:null, evalAfter:null, cls:'?', delta:null });
    }
  }
  // engine pass: analyse positions 0..N. A terminal final position is represented
  // explicitly so a checkmating move is never left as an unknown classification.
  const positions = plies.map(p=>p.fenBefore);
  positions.push(rep.fen());
  let done = 0;
  const results = new Array(positions.length).fill(null);
  for(let i=0;i<positions.length;i++){
    if(isCancelled()) throw new Error('cancelled');
    const terminal = new Chess(positions[i]);
    if(terminal.in_checkmate()){
      results[i] = {best:null, bestCpWhite:null, bestMateWhite:terminal.turn()==='w' ? -1 : 1};
    }else if(terminal.in_draw() || terminal.in_stalemate() || terminal.insufficient_material()){
      results[i] = {best:null, bestCpWhite:0, bestMateWhite:null};
    }else{
      results[i] = await Engine.analyse(positions[i], movetime, 2);
      if(!isEval(results[i])) throw new Error('Engine returned no evaluation for position '+(i+1));
    }
    onProgress(i+1, positions.length);
  }
  for(let i=0;i<plies.length;i++){
    const prevEval = results[i];
    const curEval = results[i+1];
    plies[i].evalBefore = prevEval;
    plies[i].evalAfter = curEval;
    if(prevEval && prevEval.best){
      const bs = uciToSan(plies[i].fenBefore, prevEval.best);
      if(!bs) throw new Error('Invalid best move at move '+(i+1));
      plies[i].bestSan = bs;
      plies[i].bestUci = prevEval.best;
    }
    if(isEval(prevEval) && isEval(curEval)){
      const c = classifyPly(plies[i], prevEval, curEval, plies[i].mover, plies[i].moveNum);
      Object.assign(plies[i], c);
      if(plies[i].cls === '?') throw new Error('Incomplete analysis at move '+(i+1));
      plies[i].evalAfterShown = { bestCpWhite:curEval.bestCpWhite, bestMateWhite:curEval.bestMateWhite };
    } else {
      throw new Error('Incomplete analysis at move '+(i+1));
    }
  }
  const summarize = color=>{
    const list = plies.filter(p=>p.mover===color && p.cls && p.cls!=='?');
    if(!list.length) return null;
    const acc = 100 - 5*list.reduce((a,p)=>a+Math.min(20,Math.max(0,p.delta||0)),0)/list.length;
    const count = c=>list.filter(p=>p.cls===c).length;
    return { accuracy:Math.round(acc*10)/10, moves:list.length,
      brilliant:count('brilliant'), great:count('great'), best:count('best'),
      excellent:count('excellent'), good:count('good'), book:count('book'),
      inaccuracy:count('inaccuracy'), mistake:count('mistake'), blunder:count('blunder') };
  };
  return {
    headers:{ White:headers.White, Black:headers.Black, WhiteElo:headers.WhiteElo, BlackElo:headers.BlackElo,
      Result:headers.Result, ECO:headers.ECO, Date:headers.Date, TimeControl:headers.TimeControl,
      Termination:headers.Termination, Link:headers.Link },
    plies, summary:{ white:summarize('w'), black:summarize('b') }, movetime,
  };
}
