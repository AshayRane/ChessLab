      if(r==='0-1') return color==='b'?'win':'loss';
      return '';
    }
    function renderReview(){
      const has = Object.keys(Store.state.analyzed);
      if(App.analyzing){
        const a = App.analyzing;
        return `<div style="margin:4px 2px 16px"><h1 style="font-size:24px">Analyzing…</h1></div>
          <div class="card card-pad" style="max-width:560px">
            <div class="row spread"><b>${esc(a.label)}</b><span class="small muted">move ${a.done}/${a.total}</span></div>
            <div class="progress-wrap"><i style="width:${a.total?Math.round(a.done/a.total*100):0}%"></i></div>
            <div class="row mt-14"><button class="btn btn-danger btn-sm" data-act="cancel-analysis">Cancel</button></div>
          </div>`;
      }
      if(App.review){
        return renderReviewReport();
      }
      // import list / picker
      const imp = App.importState;
      let listHTML = '';
      if(imp.loading){
        listHTML = '<div class="card card-pad"><p class="muted">Loading games from chess.com…</p></div>';
      } else if(imp.error){
        listHTML = `<div class="card card-pad"><p class="muted">Could not load games: ${esc(imp.error)}</p>
          <p class="small faint mt-8">chess.com may be blocking the request from a local file. You can still paste a PGN below.</p></div>`;
      } else if(imp.games){
        const filtered = imp.games.filter(g=>imp.filter==='all' || g.time_class===imp.filter);
        const rows = filtered.map(gm=>{
          const color = myColorOf({White:gm.white.username, Black:gm.black.username});
          const res = resultForMe({Result:gm.white.result==='win'?'1-0':(gm.black.result==='win'?'0-1':'1/2-1/2')}, color);
          // chess.com result strings: 'win','resigned','checkmated','timeout','insufficient','stalemate','agreed','repetition','timeout'...
          const mine = color==='w' ? gm.white.result : gm.black.result;
          const resCls = (mine==='win')?'res-win':(['checkmated','resigned','abandoned','timeout','lose'].includes(mine)?'res-loss':'res-draw');
          const resLabel = (mine==='win')?'Win':(resCls==='res-loss'?'Loss':'Draw');
          const opp = color==='w' ? gm.black : gm.white;
          const d = new Date(gm.end_time*1000);
          const analyzed = !!Store.state.analyzed[gameKey(gm)];
          return `<label class="gm-row">
            <input type="checkbox" data-gm-idx="${imp.games.indexOf(gm)}" ${imp.selected.has(imp.games.indexOf(gm))?'checked':''}>
            <span class="gm-date">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
            <span class="dot" style="width:10px;height:10px;border-radius:50%;background:${color==='w'?'#FAFAF7':'#2B2B28'};border:1px solid var(--border)"></span>
            <span style="flex:1">vs <b>${esc(opp.username)}</b> (${opp.rating||'?'} )</span>
            <span class="chip">${gm.time_class}</span>
            <span class="${resCls}">${resLabel}</span>
            ${analyzed?'<span class="chip ok"><span class="dot"></span>analyzed</span>':''}
          </label>`;
        }).join('');
        listHTML = `<div class="card">
          <div class="row wrap" style="gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-soft);align-items:center">
            <button class="icon-btn" data-act="prev-month" aria-label="Previous month">◀</button>
            <b style="min-width:130px;text-align:center">${MONTH_NAMES[imp.month]} ${imp.year}</b>
            <button class="icon-btn" data-act="next-month" aria-label="Next month">▶</button>
            <span style="flex:1"></span>
            <div class="seg">${['all','rapid','blitz','bullet'].map(f=>`<button data-tc="${f}" aria-pressed="${imp.filter===f}">${f}</button>`).join('')}</div>
            <button class="link-btn" data-act="sel-all">Select all</button>
          </div>
          ${rows || '<p class="muted" style="padding:16px">No games this month for this filter.</p>'}
        </div>
        <div class="row mt-14 spread wrap">
          <span class="small muted">${imp.selected.size} selected</span>
          <button class="btn btn-primary" data-act="analyze-selected" ${imp.selected.size?'':'disabled'}>Analyze ${imp.selected.size||''} selected</button>
        </div>`;
      }
      return `<div style="margin:4px 2px 16px"><h1 style="font-size:24px">Game Review</h1>
          <p class="muted">Free, automatic Stockfish analysis of your chess.com games — classifications, eval bar, best moves.</p></div>
        ${Engine.offline?`<div class="banner warn">⚠ Engine offline — analysis unavailable. The board and openings practice still work.</div>`:''}
        <div class="row wrap" style="gap:8px;margin-bottom:14px">
          <button class="btn btn-primary" data-act="load-games" ${Engine.ready?'':'disabled'}>Load my chess.com games</button>
          <button class="btn btn-ghost" data-act="paste-pgn">Paste PGN</button>
        </div>
        ${listHTML}
        ${has.length?`<div class="section"><div class="section-head"><h2>Analyzed games</h2></div>
          <div class="card">${Object.values(Store.state.analyzed).sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(g=>{
            const h = g.headers||{};
            return `<div class="gm-row" style="cursor:pointer" data-act="open-analyzed" data-key="${esc(g.key)}">
              <span class="gm-date">${esc((g.date||'').slice(5,10))}</span>
              <span style="flex:1"><b>${esc(h.White||'?')}</b> vs <b>${esc(h.Black||'?')}</b> <span class="faint">· ${esc(h.Result||'')} · ${esc(h.ECO||'')}</span></span>
              <span class="chip">you: ${g.summary && g.summary[myColorOf(h)] ? esc(g.summary[myColorOf(h)].accuracy)+'%' : '?'}</span>
            </div>`;
          }).join('')}</div></div>`:''}`;
    }
    function renderReviewReport(){
      const R = App.review;
      const nav = App.reviewNav;
      const g = R.chess;
      const hist = R.hist;
      const ply = Math.min(nav.ply, hist.length);
      // build scratch board state: replay from start to ply (with scratch branch)
      const rep = new Chess();
      let lastMove=null, checkSq=null;
      const upto = Math.min(ply, hist.length);
      for(let i=0;i<upto;i++){
        const m = hist[i];
        const vm = rep.moves({verbose:true}).find(x=>x.san===m.san);
        if(vm){ rep.move({from:vm.from,to:vm.to,promotion:vm.promotion}); lastMove={from:vm.from,to:vm.to}; }
      }
      const curPly = ply>0 && ply<=R.plies.length ? R.plies[ply-1] : null;
      const nextPly = ply<R.plies.length ? R.plies[ply] : null;
      // eval of current position: if scratch deviation, none
      const ev = ply===0 ? (R.eval0 || null) : (nextPly ? nextPly.evalBefore : (R.plies[R.plies.length-1] ? R.plies[R.plies.length-1].evalAfterActual : null));
      const wp = ev ? wpWhite(ev) : 50;
      const bestUci = nextPly && nextPly.bestUci;
      let bestMove = null;
      if(bestUci && !nav.scratch){
        bestMove = { from:bestUci.slice(0,2), to:bestUci.slice(2,4) };
      }
      if(rep.in_check()){
        const b = rep.board();
        for(let r=0;r<8;r++) for(let c=0;c<8;c++){
          const s=b[r][c];
          if(s && s.type==='k' && s.color===rep.turn()) checkSq = 'abcdefgh'[c]+(8-r);
        }
      }
      const flipped = (myColorOf(R.headers)==='b');
      const myColor = myColorOf(R.headers);
      const mySum = myColor && R.summary ? R.summary[myColor] : null;
      const h = R.headers;
      const cls = curPly ? curPly.cls : null;
      const CLS_LABELS = { brilliant:'Brilliant', best:'Best', excellent:'Excellent', good:'Good', book:'Book', inaccuracy:'Inaccuracy', mistake:'Mistake', blunder:'Blunder', q:'?' };
      const detail = curPly ? `
        <div style="margin-bottom:10px"><span class="cls-badge"><i class="cls-${cls}"></i>${CLS_LABELS[cls]||'?'}</span>
          <b style="margin-left:8px">${curPly.moveNum}${curPly.mover==='w'?'.':'…'} ${esc(curPly.san)}</b></div>
        ${cls==='q' ? '<p class="small muted">Position could not be evaluated (engine timeout).</p>' : `
          <p class="small muted" style="margin-bottom:6px">Best: <b>${esc(curPly.bestSan||'?')}</b> ${curPly.bestUci===curPly.uci?'(this move)':''}</p>
          <p class="small">Eval before: ${evalStr(curPly.evalBefore)} → after: ${evalStr(curPly.evalAfterActual)}</p>
          ${curPly.delta>0?`<p class="small" style="color:${curPly.delta>15?'var(--c-blun)':curPly.delta>8?'var(--c-mist)':'var(--c-inac)'}">You lost ${curPly.delta}% win chance.</p>`:''}
          ${curPly.sacPawns<=-2?`<p class="small faint">Material invested: ${Math.abs(curPly.sacPawns)} pawns.</p>`:''}
        `}` : '<p class="small muted">Starting position — press → to step through the game.</p>';
      const moveRows = hist.map((m,i)=>{
        const p = R.plies[i];
        const c = p ? p.cls : 'q';
        const cur = i+1===ply ? ' cur' : '';
        return { m, c, cur };
      });
      let rows='';
      for(let i=0;i<moveRows.length;i+=2){
        const a=moveRows[i], b=moveRows[i+1];
        rows += `<div class="mv-row">
          <span class="mv-num">${i/2+1}.</span>
          <button class="mv${a.cur}" data-mv-ply="${i+1}"><span class="mv-dot cls-${a.c}"></span>${esc(a.m.san)}</button>
          ${b?`<button class="mv${b.cur}" data-mv-ply="${i+2}"><span class="mv-dot cls-${b.c}"></span>${esc(b.m.san)}</button>`:'<span></span>'}
        </div>`;
      }
      const resLabel = resultForMe(h, myColor);
      return `<div style="margin:4px 2px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
          <div><h1 style="font-size:22px">${esc(h.White||'?')} (${esc(h.WhiteElo||'?')}) vs ${esc(h.Black||'?')} (${esc(h.BlackElo||'?')})</h1>
          <p class="muted small">${esc(h.Result||'')} · ${esc(h.ECO||'opening')} · ${esc(h.TimeControl||'')} · ${esc(h.Date||'')} ${resLabel?`· <span class="${resLabel==='Win'?'res-win':resLabel==='Loss'?'res-loss':'res-draw'}">${resLabel} for you</span>`:''}</p></div>
          <button class="btn btn-ghost btn-sm" data-act="back-to-list">← All games</button>
        </div>
        ${mySum&&mySum.brilliant?`<div class="banner">🎉 This game contained ${mySum.brilliant} brillian${mySum.brilliant>1?'ies':'y'} (rule-based approximation).</div>`:''}
        <div class="game-grid">
          <div class="board-area" id="board-area">
            <div id="board">${renderBoardSVG(rep.fen(), { lastMove, checkSq, flipped, bestMove })}</div>
            <div class="evalbar"><i class="white" style="height:${wp}%"></i><span class="edge" style="bottom:${wp}%"></span></div>
          </div>
          <div class="panel">
            <div class="eval-num" aria-live="polite">${evalStr(ev)}</div>
            <div class="card detail-panel">${detail}</div>
            <div class="review-ctl">
              <button class="ctl-btn" data-act="nav-start" aria-label="First move" title="First (Home)">⏮</button>
              <button class="ctl-btn" data-act="nav-prev" aria-label="Previous move" title="Previous (←)">◀</button>
              <button class="ctl-btn" data-act="nav-next" aria-label="Next move" title="Next (→)">▶</button>
              <button class="ctl-btn" data-act="nav-end" aria-label="Last move" title="Last (End)">⏭</button>
              ${bestMove?`<button class="ctl-btn" data-act="play-best" aria-label="Play best move on board" title="Play best move">✓</button>`:''}
            </div>
            <div class="card" style="padding:12px 4px">
              <div class="movelists" style="max-height:300px" id="review-moves">${rows||'<p class="small muted" style="padding:10px">No moves.</p>'}</div>
            </div>
            ${mySum?`<div class="card card-pad" style="padding:14px 16px">
              <div class="row spread"><span class="eyebrow">Your accuracy</span><span style="font-weight:800;font-size:18px">${mySum.accuracy}%</span></div>
              <div class="legend mt-8">
                <span><i class="cls-brilliant"></i>${mySum.brilliant||0} brilliant</span>
                <span><i class="cls-best"></i>${mySum.best||0} best</span>
                <span><i class="cls-excellent"></i>${mySum.excellent||0} excellent</span>
                <span><i class="cls-good"></i>${mySum.good||0} good</span>
                <span><i class="cls-book"></i>${mySum.book||0} book</span>
                <span><i class="cls-inaccuracy"></i>${mySum.inaccuracy||0} ?!</span>
                <span><i class="cls-mistake"></i>${mySum.mistake||0} ?</span>
                <span><i class="cls-blunder"></i>${mySum.blunder||0} ??</span>
              </div>
            </div>`:''}
          </div>
        </div>`;
    }
    function mySumOf(R){
      const c = myColorOf(R.headers);
      return c && R.summary ? R.summary[c] : null;
    }

    /* =================== PROGRESS VIEW =================== */
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    function renderProgress(){
      const games = Object.values(Store.state.analyzed);
      if(!games.length){
        return `<div style="margin:4px 2px 16px"><h1 style="font-size:24px">Progress</h1></div>
          <div class="card empty"><h3>Nothing to measure yet</h3>
          <p>Analyze games in the Review tab and your accuracy, blunder rate and weak openings will appear here.</p></div>`;
      }
      const myGames = games.map(g=>{
        const c = myColorOf(g.headers);
        return { g, sum: c && g.summary ? g.summary[c] : null, date: g.date };
      }).filter(x=>x.sum);
      myGames.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      const n = myGames.length;
      const avgAcc = myGames.reduce((a,x)=>a+x.sum.accuracy,0)/n;
      const blundersPerGame = myGames.reduce((a,x)=>a+x.sum.blunder,0)/n;
      const mistakesPerGame = myGames.reduce((a,x)=>a+x.sum.mistake,0)/n;
      // accuracy over time
      const labels = myGames.map(x=>{
        const d = (x.date||'').split('-');
        return d.length===3 ? `${d[1]}/${d[2]}` : '?';
      });
      const accChart = lineChart({ series:[{color:'var(--accent)', data:myGames.map(x=>x.sum.accuracy)}], labels, height:180, yFmt:v=>Math.round(v) });
      // weakness table by ECO (fallback: first 6 plies)
      const groups = {};
      for(const x of myGames){
        let key = x.g.headers && x.g.headers.ECO;
        if(!key){
          key = (x.g.plies ? x.g.plies.slice(0,6).map(p=>p.san).join(' ') : '') || '?';
        }
        (groups[key] ||= { name:key, n:0, acc:0, blunders:0 });
        groups[key].n++; groups[key].acc += x.sum.accuracy; groups[key].blunders += x.sum.blunder;
      }
      const weak = Object.values(groups).map(g=>({ ...g, avgAcc: g.acc/g.n, bpg: g.blunders/g.n }))
        .sort((a,b)=>a.avgAcc-b.avgAcc).slice(0,10);
      const worst = weak[0];
      return `<div style="margin:4px 2px 16px"><h1 style="font-size:24px">Progress</h1>
          <p class="muted">${n} game${n===1?'':'s'} analyzed at depth ${games[0].depth}</p></div>
        <div class="stat-grid">
          <div class="card stat"><div class="label">Avg accuracy</div><div class="value">${Math.round(avgAcc)}%</div><div class="sub">lichess win% model</div></div>
          <div class="card stat"><div class="label">Blunders / game</div><div class="value">${blundersPerGame.toFixed(1)}</div><div class="sub">mistakes ${(mistakesPerGame).toFixed(1)}/game</div></div>
          <div class="card stat"><div class="label">Games analyzed</div><div class="value">${n}</div><div class="sub">stored locally</div></div>
        </div>
        ${worst?`<div class="banner mt-14"><span>Your weakest opening: <b>${esc(worst.name)}</b> — ${worst.n} game(s) at ${Math.round(worst.avgAcc)}% avg accuracy, ${worst.bpg.toFixed(1)} blunders/game.</span>
          <button class="btn btn-ghost btn-sm" data-act="nav" data-view="openings">Practice openings</button></div>`:''}
        <div class="section"><div class="section-head"><h2>Accuracy over time</h2></div>
          <div class="card card-pad">${accChart}</div></div>
        <div class="section"><div class="section-head"><h2>Openings by accuracy (worst first)</h2></div>
          <div class="card" style="overflow:auto"><table class="weak">
            <thead><tr><th>Opening</th><th>Games</th><th>Avg accuracy</th><th>Blunders/game</th></tr></thead>
            <tbody>${weak.map(w=>`<tr><td><b>${esc(w.name)}</b></td><td>${w.n}</td><td>${Math.round(w.avgAcc)}%</td><td>${w.bpg.toFixed(1)}</td></tr>`).join('')}</tbody>
          </table></div></div>`;
    }
    /* line chart (SVG) — same visual language as GymTrack */
    function lineChart({ series, labels, height=180, yFmt=v=>Math.round(v), maxTicks=4 }){
      const W=560, H=height, P={l:38,r:8,t:10,b:22};
      const all = series.flatMap(s=>s.data);
      const max = Math.max(...all,1), min=0;
      const iw=W-P.l-P.r, ih=H-P.t-P.b;
      const n = Math.max(...series.map(s=>s.data.length));
      const x = i => P.l + (n<=1?iw/2:(i/(n-1))*iw);
      const y = v => P.t + ih - (v-min)/(max-min||1)*ih;
      let g='';
      for(let t=0;t<=maxTicks;t++){
        const v=min+(max-min)*t/maxTicks;
        g+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="var(--border-soft)"/>`;
        g+=`<text x="${P.l-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10.5" fill="var(--faint)" font-family="var(--font)">${yFmt(v)}</text>`;
      }
      const step=Math.ceil(n/8);
      labels.forEach((l,i)=>{ if(n<=8||i%step===0||i===n-1) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--faint)" font-family="var(--font)">${esc(l)}</text>`; });
      for(const s of series){
        const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
        if(s.data.some(v=>v>0)) g+=`<polygon points="${P.l},${y(min)} ${pts} ${x(s.data.length-1)},${y(min)}" fill="${s.color}" opacity="0.08"/>`;
        g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.data.forEach((v,i)=>{ if(v>0) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"/>`; });
      }
      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="chart">${g}</svg>`;
    }

    /* =================== SETTINGS VIEW =================== */
    function renderSettings(){
      const s = Store.state.settings;
      return `<div style="margin:4px 2px 16px"><h1 style="font-size:24px">Settings</h1>
        <p class="muted">Everything is stored locally in your browser.</p></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
        <div class="card card-pad">
          <h2 style="font-size:15px;margin-bottom:14px">Account</h2>
          <div class="field"><label for="s-user">chess.com username</label>
            <input class="input" id="s-user" value="${esc(s.username)}" autocomplete="off">
            <span class="help">Used only for the public chess.com API (no password, read-only).</span></div>
          <div class="field"><span class="field-label">Theme</span>
            <div class="seg" role="group" aria-label="Theme">
              <button data-theme="light" aria-pressed="${s.theme==='light'}">Light</button>
              <button data-theme="dark" aria-pressed="${s.theme==='dark'}">Dark</button>
              <button data-theme="system" aria-pressed="${s.theme==='system'}">System</button>
            </div></div>
        </div>
        <div class="card card-pad">
          <h2 style="font-size:15px;margin-bottom:14px">Analysis</h2>
          <div class="field"><label for="s-depth">Review depth: <span id="s-depth-lab">${s.depth}</span></label>
            <input type="range" id="s-depth" min="10" max="18" value="${s.depth}" style="width:100%;accent-color:var(--accent)">
            <span class="help">Higher = more accurate but slower. Depth 14 reviews a 40-move game in about a minute.</span></div>
          <div class="field"><label for="s-skill">Default engine strength: <span id="s-skill-lab">${skillLabel(s.skill)}</span></label>
            <input type="range" id="s-skill" min="0" max="20" value="${s.skill}" style="width:100%;accent-color:var(--accent)"></div>
        </div>
        <div class="card card-pad">
          <h2 style="font-size:15px;margin-bottom:6px">Data</h2>
          <p class="small muted" style="margin-bottom:12px">${Object.keys(Store.state.analyzed).length} analyzed games · ${Store.state.openingLines.length} custom lines saved.</p>
          <div class="row wrap" style="gap:8px">
            <button class="btn btn-ghost btn-sm" data-act="export">Export JSON</button>
            <button class="btn btn-ghost btn-sm" data-act="import-json">Import JSON</button>
            <button class="btn btn-danger btn-sm" data-act="reset-data">Clear all data</button>
          </div>
        </div>
      </div>
      <div class="mt-20"><button class="btn btn-primary" data-act="save-settings">Save Settings</button></div>`;
}

/* =================== RENDER ROOT =================== */
const RENDERERS = { play: renderPlay, openings: renderOpenings, review: renderReview, progress: renderProgress, settings: renderSettings };
function render(){
  const main = $('#main');
  main.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  view.innerHTML = RENDERERS[App.view]();
  main.appendChild(view);
  bindView(view);
}
let boundView = null;
function bindView(view){
  if(boundView){ boundView._cleanup && boundView._cleanup(); }
  boundView = view;
  // topbar chips
  $('#top-chips').innerHTML = `<span class="chip" id="chip-engine"><span class="dot"></span>Engine: ${Engine.status}</span>
    <span class="chip" id="chip-account"><span class="dot"></span>${esc(Store.state.settings.username)}</span>`;
  updateEngineChip();
  updateAccountChip();

  /* ---- global clicks ---- */
  view.addEventListener('click', e=>{
    const nav = e.target.closest('[data-view]');
    if(nav){ go(nav.dataset.view); return; }
    const fam = e.target.closest('[data-fam]');
    if(fam){ App.openingsFilter = fam.dataset.fam; render(); return; }
    const tc = e.target.closest('[data-tc]');
    if(tc){ App.importState.filter = tc.dataset.tc; render(); return; }
    const colorBtn = e.target.closest('[data-color]');
    if(colorBtn){ Store.state.settings.color = colorBtn.dataset.color; Store.save(); render(); return; }
    // NOTE: <html data-theme> is an ancestor of everything, so closest('[data-theme]')
    // would match EVERY click. Only match actual theme BUTTONS:
    const themeBtn = e.target.closest('button[data-theme]');
    if(themeBtn){ Store.state.settings.theme = themeBtn.dataset.theme; Store.save(); applyTheme(); render(); return; }
    const mvBtn = e.target.closest('[data-mv-ply]');
    if(mvBtn){ App.reviewNav.ply = Math.min(+mvBtn.dataset.mvPly, App.review.hist.length); App.reviewNav.scratch=null; render(); return; }
    const chk = e.target.closest('[data-gm-idx]');
    if(chk){ const i=+chk.dataset.gmIdx; if(chk.checked) App.importState.selected.add(i); else App.importState.selected.delete(i); render(); return; }
    const t = e.target.closest('[data-act]');
    if(t) handleAction(t, e);
  });

  /* ---- inputs ---- */
  view.addEventListener('input', e=>{
    const t = e.target;
    if(t.id==='open-q'){ App.openingsQuery = t.value; render(); }
    if(t.id==='pf-skill'){ $('#pf-skill-lab').textContent = skillLabel(t.value); Store.state.settings.skill = +t.value; Store.save(); }
    if(t.id==='s-depth'){ $('#s-depth-lab').textContent = t.value; Store.state.settings.depth = +t.value; Store.save(); }
    if(t.id==='s-skill'){ $('#s-skill-lab').textContent = skillLabel(t.value); Store.state.settings.skill = +t.value; Store.save(); }
  });
  // keyboard review navigation is bound ONCE at document level (keystrokes may land on body)
  if(!document._kbBound){
    document._kbBound = true;
    document.addEventListener('keydown', e=>{
      if(App.view!=='review' || !App.review) return;
      if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;
      const h = App.review.hist.length;
      if(e.key==='ArrowRight'){ e.preventDefault(); App.reviewNav.ply=Math.min(App.review.hist.length,App.reviewNav.ply+1); App.reviewNav.scratch=null; render(); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); App.reviewNav.ply=Math.max(0,App.reviewNav.ply-1); App.reviewNav.scratch=null; render(); }
      if(e.key==='Home'){ e.preventDefault(); App.reviewNav.ply=0; App.reviewNav.scratch=null; render(); }
      if(e.key==='End'){ e.preventDefault(); App.reviewNav.ply=App.review.hist.length; App.reviewNav.scratch=null; render(); }
    });
  }
  view.addEventListener('keydown', e=>{
    if(App.view==='review' && App.review){
      if(e.key==='ArrowRight'){ e.preventDefault(); App.reviewNav.ply = Math.min(App.review.hist.length, App.reviewNav.ply+1); App.reviewNav.scratch=null; render(); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); App.reviewNav.ply = Math.max(0, App.reviewNav.ply-1); App.reviewNav.scratch=null; render(); }
      if(e.key==='Home'){ e.preventDefault(); App.reviewNav.ply = 0; App.reviewNav.scratch=null; render(); }
      if(e.key==='End'){ e.preventDefault(); App.reviewNav.ply = App.review.hist.length; App.reviewNav.scratch=null; render(); }
    }
  });

  /* ---- board click-to-move (play view) ---- */
  const boardEl = view.querySelector('#board');
  if(boardEl && App.view==='play' && App.play){
    boardEl.addEventListener('click', e=>{
      const rect = boardEl.getBoundingClientRect();
      const x = (e.clientX-rect.left)/rect.width, y = (e.clientY-rect.top)/rect.height;
      const P = App.play;
      const flipped = P.color==='b';
      let file, rank;
      if(flipped){ file = 'hgfedcba'[Math.min(7,Math.floor(x*8))]; rank = 1+Math.min(7,Math.floor(y*8)); }
      else { file = 'abcdefgh'[Math.min(7,Math.floor(x*8))]; rank = 8-Math.min(7,Math.floor(y*8)); }
      const sq = file+rank;
      const legal = P.g.moves({square:P.play?.sel||undefined, verbose:true}); // noop
      if(P.sel){
        const moved = userPlay(P.sel, sq);
        if(!moved){
          // maybe selecting another own piece
          const own = P.g.moves({verbose:true}).some(m=>m.from===sq);
          P.sel = own ? sq : null;
        } else { P.sel=null; return; }
        renderBoardOnly();
      } else {
        const own = P.g.moves({verbose:true}).some(m=>m.from===sq);
        if(own){ P.sel = sq; renderBoardOnly(); }
      }
    });
  }
}

/* =================== ACTION HANDLER =================== */
function handleAction(t, e){
  const act = t.dataset.act;
  switch(act){
    case 'start-play': {
      const color = Store.state.settings.color;
      const skill = Store.state.settings.skill;
      const line = $('#pf-line') ? $('#pf-line').value : '';
      startPlaySession({ color, skill, lineMoves: line });
      break;
    }
    case 'new-game': App.play=null; render(); break;
    case 'flip-board': Store.state.settings.boardFlipped = !Store.state.settings.boardFlipped; Store.save(); render(); break;
    case 'end-play': {
      const P = App.play;
      if(P && !P.finished){ P.finished=true; P.result='abandoned'; savePlayGame(P); render(); toast('Game ended'); }
      break;
    }
    case 'review-play': {
      const P = App.play;
      if(P && P.pgn) runAnalysis([{ url:null, pgn:P.pgn, time_class:'practice', white:{username:'You'}, black:{username:'Stockfish'} }], { jumpTo:true });
      break;
    }
    case 'practice': {
      startPlaySession({ color:Store.state.settings.color, skill:Store.state.settings.skill, lineName:t.dataset.name, lineMoves:t.dataset.moves, lineFen:t.dataset.fen||null });
      break;
    }
    case 'add-line': openAddLineModal(); break;
    case 'del-line': {
      Store.state.openingLines = Store.state.openingLines.filter(o=>o.id!==t.dataset.id);
      Store.save(); render(); toast('Line deleted');
      break;
    }
    case 'load-games': {
      const now = new Date();
      App.importState = { ...App.importState, year:now.getFullYear(), month:now.getMonth(), games:null, loading:true, error:null, selected:new Set() };
      render();
      Importer.month(Store.state.settings.username, App.importState.year, App.importState.month)
        .then(games=>{ App.importState.games = games; App.importState.loading=false; render(); })
        .catch(err=>{ App.importState.loading=false; App.importState.error = err.message||String(err); render(); });
      break;
    }
    case 'prev-month': case 'next-month': {
      const imp = App.importState;
      let y=imp.year, m=imp.month;
      m += (act==='prev-month' ? -1 : 1);
      if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
      imp.year=y; imp.month=m; imp.games=null; imp.loading=true; imp.selected=new Set();
      render();
      Importer.month(Store.state.settings.username, y, m)
        .then(games=>{ imp.games=games; imp.loading=false; render(); })
        .catch(err=>{ imp.loading=false; imp.error=err.message||String(err); render(); });
      break;
    }
    case 'sel-all': {
      const imp = App.importState;
      imp.games.filter(g=>imp.filter==='all'||g.time_class===imp.filter).forEach(g=>imp.selected.add(imp.games.indexOf(g)));
      render();
      break;
    }
    case 'analyze-selected': {
      const imp = App.importState;
      const picked = [...imp.selected].map(i=>imp.games[i]).filter(Boolean);
      if(picked.length) runAnalysis(picked, { month: `${MONTH_NAMES[imp.month]} ${imp.year}` });
      break;
    }
    case 'paste-pgn': openPastePgnModal(); break;
    case 'open-analyzed': openAnalyzed(t.dataset.key); break;
    case 'back-to-list': App.review=null; App.reviewNav={ply:0,scratch:null}; render(); break;
    case 'nav-start': if(App.review){ App.reviewNav.ply=0; App.reviewNav.scratch=null; render(); } break;
    case 'nav-end': if(App.review){ App.reviewNav.ply=App.review.hist.length; App.reviewNav.scratch=null; render(); } break;
    case 'nav-prev': if(App.review){ App.reviewNav.ply=Math.max(0,App.reviewNav.ply-1); App.reviewNav.scratch=null; render(); } break;
    case 'nav-next': if(App.review){ App.reviewNav.ply=Math.min(App.review.hist.length,App.reviewNav.ply+1); App.reviewNav.scratch=null; render(); } break;
    case 'play-best': {
      const R = App.review;
      if(R && R.plies[App.reviewNav.ply] && R.plies[App.reviewNav.ply].bestUci){
        const uci = R.plies[App.reviewNav.ply].bestUci;
        // build scratch board by replaying to current ply then playing best
        const rep = new Chess();
        const upto = Math.min(App.reviewNav.ply, R.hist.length);
        for(let i=0;i<upto;i++){
          const m = R.hist[i];
          const vm = rep.moves({verbose:true}).find(x=>x.san===m.san);
          if(vm) rep.move({from:vm.from,to:vm.to,promotion:vm.promotion});
        }
        const vm = rep.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===uci);
        if(vm){ rep.move({from:vm.from,to:vm.to,promotion:vm.promotion}); }
        App.reviewNav.scratch = rep;
        render();
        toast('Best move played — explore from here (not saved)');
      }
      break;
    }
    case 'cancel-analysis': App.analyzing.cancelled=true; break;
    case 'save-settings': {
      const u = $('#s-user').value.trim();
      if(u){ Store.state.settings.username = u; Store.save(); updateAccountChip(); toast('Settings saved'); }
      render();
      break;
    }
    case 'export': exportData(); break;
    case 'import-json': importData(); break;
    case 'reset-data': {
      openModal('Clear all data?', '<p class="muted">Deletes analyzed games, custom lines and settings from this browser.</p>',
        (root, close)=>{
          root.querySelector('.modal-body').insertAdjacentHTML('beforeend',
            '<div class="row spread mt-14"><button class="btn btn-ghost" data-close2>Cancel</button><button class="btn btn-danger" id="do-reset">Delete Everything</button></div>');
          root.querySelector('#do-reset').addEventListener('click', ()=>{ Store.reset(); close(); render(); toast('All data cleared'); });
          root.querySelector('[data-close2]').addEventListener('click', close);
        });
      break;
    }
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(Store.state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `chesslab-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported');
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);
        if(!data || !data.settings) throw new Error('bad');
        Store.state = Object.assign(Store.defaults(), data);
        Store.save(); applyTheme(); render(); toast('Imported');
      }catch(err){ toast('Import failed — not a ChessLab export','err'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function openAddLineModal(){
  const body = `<div class="field"><label for="cl-name">Line name</label><input class="input" id="cl-name" placeholder="e.g. My Najdorf attack"></div>
    <div class="field"><label for="cl-fen">Start FEN <span class="faint">(optional)</span></label><input class="input" id="cl-fen" placeholder="leave empty for startpos"></div>
    <div class="field"><label for="cl-moves">Moves (SAN or UCI)</label><textarea class="input" id="cl-moves" rows="3" placeholder="e4 c5 Nf3 d6 d4 cxd4"></textarea></div>
    <div class="err" id="cl-err"></div>
    <div class="row spread mt-14"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="cl-save">Save Line</button></div>`;
  openModal('Add Opening Line', body, (root, close)=>{
    root.querySelector('#cl-save').addEventListener('click', ()=>{
      const name = root.querySelector('#cl-name').value.trim() || 'My line';
      const fen = root.querySelector('#cl-fen').value.trim() || null;
      const moves = root.querySelector('#cl-moves').value.trim();
      const errEl = root.querySelector('#cl-err');
      if(!moves){ errEl.textContent='Enter at least one move.'; errEl.classList.add('show'); return; }
      // validate
      const g = fen ? (()=>{ try{ return new Chess(fen); }catch(e){ return null; } })() : new Chess();
      if(!g){ errEl.textContent='Invalid FEN.'; errEl.classList.add('show'); return; }
      const res = playLine(g, sanitizeMoves(moves));
      if(res.error){ errEl.textContent = res.error; errEl.classList.add('show'); return; }
      Store.state.openingLines.push({ id:uid(), name, fen, moves, created:Date.now() });
      Store.save(); close(); render(); toast(`Line "${name}" saved`);
    });
  });
}
function openPastePgnModal(){
  const body = `<div class="field"><label for="pp-pgn">PGN</label><textarea class="input" id="pp-pgn" rows="8" placeholder='[Event "..."] 1. e4 e5 ...'></textarea></div>
    <div class="err" id="pp-err"></div>
    <div class="row spread mt-14"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="pp-go">Analyze PGN</button></div>`;
  openModal('Paste PGN', body, (root, close)=>{
    root.querySelector('#pp-go').addEventListener('click', ()=>{
      const pgn = root.querySelector('#pp-pgn').value.trim();
      const errEl = root.querySelector('#pp-err');
      if(!pgn){ errEl.textContent='Paste a PGN first.'; errEl.classList.add('show'); return; }
      close();
      runAnalysis([{ url:null, pgn, time_class:'pasted' }], { jumpTo:true });
    });
  });
}
function openAnalyzed(key){
  const g = Store.state.analyzed[key];
  if(!g) return;
  loadReview(g);
}
function loadReview(g){
  const chess = new Chess();
  const ok = chess.load_pgn(g.pgn, {sloppy:true});
  if(!ok){ toast('Could not load game','err'); return; }
  App.review = {
    chess, hist: chess.history({verbose:true}),
    headers: g.headers, plies: g.plies, summary: g.summary, depth: g.depth,
    key: g.key, date: g.date,
  };
  App.reviewNav = { ply:0, scratch:null };
  go('review');
}

/* =================== ANALYSIS RUNNER =================== */
async function runAnalysis(gamesList, { jumpTo=false, labelPrefix='' } = {}){
  if(!Engine.ready){ toast('Engine not ready yet','err'); return; }
  const depth = Store.state.settings.depth;
  const results = [];
  for(let gi=0; gi<gamesList.length; gi++){
    const gm = gamesList[gi];
    const label = gm.white && gm.black
      ? `${gm.white.username||'?'} vs ${gm.black.username||'?'}`
      : 'Pasted game';
    App.analyzing = { label, done:0, total:1, cancelled:false };
    render();
    try{
      const result = await analyzeGame(gm.pgn, {
        depth,
        onProgress:(done,total)=>{ App.analyzing.done=done; App.analyzing.total=total;
          const el = $('.progress-wrap i'); if(el) el.style.width = Math.round(done/total*100)+'%'; },
        isCancelled:()=>App.analyzing && App.analyzing.cancelled,
      });
      const key = gm.url || ('pgn:'+hashStr(gm.pgn));
      const rec = {
        key, url: gm.url||null,
        pgn: gm.pgn,
        date: gm.end_time ? new Date(gm.end_time*1000).toISOString().slice(0,10) : (result.headers.Date ? result.headers.Date.replace(/\./g,'-') : new Date().toISOString().slice(0,10)),
        headers: result.headers, plies: result.plies, summary: result.summary, depth,
      };
      Store.state.analyzed[key] = rec;
      Store.save();
      results.push(rec);
    } catch(err){
      if(String(err.message)==='cancelled'){ toast('Analysis cancelled'); App.analyzing=null; render(); return; }
      toast('Analysis failed: '+err.message,'err');
    }
  }
  App.analyzing = null;
  Store.save();
  if(jumpTo && results.length){
    loadReview(results[results.length-1]);
    toast(`Analysis complete — ${results.length} game(s)`);
  } else {
    render();
    toast(`${results.length} game(s) analyzed 💪`);
  }
}

/* =================== BOOT =================== */
function boot(){
  Store.load();
  applyTheme();
  bindThemeMedia();
  validateOpenings();
  buildNav();
  render();
  Engine.start();
  const now = new Date();
  App.importState.year = now.getFullYear();
  App.importState.month = now.getMonth();
}
boot();
</script>
