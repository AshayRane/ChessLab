<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessLab — Opening Trainer &amp; Free Game Review</title>
<meta name="description" content="Practice openings against Stockfish from custom move orders, and automatically review your chess.com games with move classifications and an evaluation bar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CDFB51'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
/* ============================= TOKENS ============================= */
:root{
  --accent:#CDFB51; --accent-ink:#10130a; --accent-soft:rgba(205,251,81,.12);
  --bg:#0B0D10; --bg-soft:#0F1216; --card:#14171C; --card-2:#191D23;
  --border:#242A32; --border-soft:#1C2127;
  --text:#EDF0F2; --muted:#98A0AA; --faint:#5E6670;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.5);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --nav-w:216px; --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sq-l:#EBECD0; --sq-d:#779556;
  --c-best:#26c2a3; --c-brill:#26c2a3; --c-exc:#26c2a3; --c-good:#95bb4a;
  --c-book:#a88b5b; --c-inac:#f7c631; --c-mist:#ffa459; --c-blun:#ff7769; --c-q:#5E6670;
}
html[data-theme="light"]{
  --accent:#3D6B00; --accent-ink:#f4ffe0; --accent-soft:rgba(61,107,0,.09);
  --bg:#F4F5F2; --bg-soft:#ECEEE9; --card:#FFFFFF; --card-2:#F7F8F5;
  --border:#E2E5DE; --border-soft:#EAECE6;
  --text:#191D14; --muted:#5C6357; --faint:#8B9288;
  --shadow:0 1px 2px rgba(25,29,20,.05),0 10px 28px -14px rgba(25,29,20,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:700;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{left:12px;top:12px}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);position:fixed;inset:0 auto 0 0;background:var(--bg-soft);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:20px 14px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none;color:#0B0D10;font-size:19px;line-height:1}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.snav{display:flex;flex-direction:column;gap:2px;flex:1}
.snav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm,10px);color:var(--muted);font-weight:500;font-size:14px;text-align:left;width:100%;transition:background .15s,color .15s}
.snav button:hover{background:var(--card);color:var(--text)}
.snav button[aria-current="page"]{background:var(--accent-soft);color:var(--text);font-weight:600}
.side-foot{padding:12px 10px;font-size:12px;color:var(--faint)}
.mainwrap{flex:1;margin-left:var(--nav-w);display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 32px 0;max-width:1100px;width:100%;margin:0 auto;flex-wrap:wrap}
.page-title{font-size:15px;font-weight:600;color:var(--muted)}
.top-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card-2);border:1px solid var(--border-soft);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--accent)}
.chip.err .dot{background:#F26D6D}
.chip.warn .dot{background:#F2C14E}
main{width:100%;max-width:1160px;margin:0 auto;padding:14px 32px 60px;flex:1}
.view{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r-lg,20px);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px}
.section-head h2{font-size:16px}
.link-btn{font-size:13px;color:var(--muted);font-weight:600;background:none;border:none;cursor:pointer;padding:0}
.link-btn:hover{color:var(--text)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .12s,filter .15s,background .15s;min-height:44px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--card-2)}
.btn-quiet{color:var(--muted);padding:8px 12px;min-height:40px}
.btn-quiet:hover{color:var(--text)}
.btn-danger{background:transparent;border-color:var(--border);color:#F26D6D}
.btn-sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text)}
.input{width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:10px 13px;min-height:44px;font-size:14.5px}
html[data-theme="light"] .input{background:#fff}
.input:focus{outline:none;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label,.field-label{font-size:13px;font-weight:600;color:var(--muted)}
.err{color:#F26D6D;font-size:12.5px;font-weight:600;display:none}
.err.show{display:block}
.help{font-size:12px;color:var(--faint)}
.seg{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--border);border-radius:11px;padding:4px;width:fit-content}
.seg button{padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
html[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.mt-8{margin-top:8px}.mt-14{margin-top:14px}.mt-20{margin-top:20px}
hr.sep{border:none;border-top:1px solid var(--border-soft);margin:16px 0}

.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottomnav .bn-grid{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:600;border-radius:10px;min-height:44px;width:100%}
.bottomnav button[aria-current="page"]{color:var(--text)}
.bottomnav svg{width:20px;height:20px}

#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toastIn .25s ease both;max-width:min(92vw,440px)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,7,9,.62);z-index:80;display:grid;place-items:center;padding:20px;animation:fadeIn .2s ease;backdrop-filter:blur(3px)}
html[data-theme="light"] .modal-backdrop{background:rgba(40,44,36,.4)}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:560px;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 0}
.modal-head h2{font-size:17px}
.modal-body{padding:16px 22px 22px}
.icon-btn{width:36px;height:36px;min-width:36px;border-radius:9px;display:grid;place-items:center;color:var(--faint);border:1px solid var(--border);background:var(--card);cursor:pointer}

.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty h3{font-size:17px}
.empty p{color:var(--muted);font-size:14px;max-width:420px}

/* ============================= BOARD ============================= */
.board-area{display:grid;grid-template-columns:auto 22px;gap:12px;align-items:stretch}
#board{width:var(--board-w,480px);max-width:100%;aspect-ratio:1;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#board svg{width:100%;height:100%;display:block}
.sq-sel{fill:rgba(205,251,81,.45)}
.sq-last{fill:rgba(205,251,81,.35)}
.sq-check{fill:rgba(255,100,100,.55)}
.sq-hint{fill:rgba(20,23,28,.22)}
html[data-theme="light"] .sq-hint{fill:rgba(25,29,20,.18)}
.coord{font-size:9.5px;font-weight:700;font-family:var(--font)}
.evalbar{border-radius:8px;overflow:hidden;background:#3a3f45;position:relative;border:1px solid var(--border-soft)}
html[data-theme="light"] .evalbar{background:#8B9288}
.evalbar .white{position:absolute;bottom:0;left:0;right:0;background:#F4F6F5;transition:height .3s ease}
.evalbar .edge{position:absolute;left:0;right:0;height:2px;background:var(--accent);transition:bottom .3s ease}
.eval-num{text-align:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin-top:6px}
.eval-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.1em;color:var(--faint);text-align:center;flex:1;display:flex;align-items:center;justify-content:center}

/* play & review layout */
.game-grid{display:grid;grid-template-columns:minmax(320px,560px) minmax(300px,420px);gap:20px;align-items:start;justify-content:center}
.panel{display:flex;flex-direction:column;gap:14px}
.movelists{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:auto;max-height:380px;border:1px solid var(--border-soft);border-radius:12px}
.mv-num{color:var(--faint);font-size:12px;font-weight:700;padding:4px 2px 4px 0}
.mv-row{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center;padding:3px 10px;font-size:14px}
.mv-row:nth-child(odd){background:var(--card-2)}
.mv{padding:4px 8px;border-radius:8px;font-weight:600;cursor:pointer;border:none;background:none;text-align:left;display:flex;align-items:center;gap:6px;width:100%}
.mv:hover{background:var(--border-soft)}
.mv.cur{background:var(--accent-soft);outline:1px solid var(--accent)}
.mv-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cls,#5E6670)}
.cls-best{background:#26c2a3}.cls-brilliant{background:#26c2a3}.cls-excellent{background:#26c2a3}
.cls-good{background:#95bb4a}.cls-book{background:#a88b5b}.cls-inaccuracy{background:#f7c631}
.cls-mistake{background:#ffa459}.cls-blunder{background:#ff7769}.cls-q{background:#5E6670}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.detail-panel{padding:16px 18px}
.cls-badge{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--card-2);border:1px solid var(--border-soft)}
.cls-badge i{width:10px;height:10px;border-radius:50%;display:inline-block}
.review-ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:17px;display:grid;place-items:center;cursor:pointer}
.ctl-btn:hover{color:var(--text);border-color:var(--accent)}
.ctl-btn[disabled]{opacity:.4;cursor:default}
.game-head{display:flex;flex-direction:column;gap:6px;padding:14px 18px}
.game-head .players{font-weight:700;font-size:15px}
.result-chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--border-soft)}
.progress-wrap{height:6px;border-radius:99px;background:var(--bg-soft);overflow:hidden;margin-top:8px}
.progress-wrap i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* openings grid */
.open-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.open-card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.open-name{font-weight:700;font-size:15px}
.open-preview{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:16px 18px}
.stat .label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--faint)}
table.weak{width:100%;border-collapse:collapse;font-size:13.5px}
table.weak th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border-soft)}
table.weak td{padding:9px 10px;border-bottom:1px solid var(--border-soft)}
table.weak tr:last-child td{border-bottom:none}

/* import list */
.gm-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.gm-row:last-child{border-bottom:none}
.gm-row input{width:16px;height:16px;accent-color:var(--accent)}
.gm-date{color:var(--faint);min-width:64px}
.res-win{color:#7ddc9a;font-weight:700}.res-loss{color:#F28C8C;font-weight:700}.res-draw{color:var(--muted);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.banner.warn{background:rgba(242,193,78,.1);border-color:#F2C14E}

@media (max-width:960px){
  .game-grid{grid-template-columns:1fr}
  .board-area{justify-content:center}
  #board{--board-w:min(92vw,480px)}
}
@media (max-width:880px){
  .sidebar{display:none}
  .mainwrap{margin-left:0}
  .topbar{padding:12px 16px 0}
  .page-title{display:none}
  main{padding:10px 14px 110px}
  .bottomnav{display:block}
  #board{--board-w:min(92vw,480px)}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:12px}
  .stat .value{font-size:20px}
  .movelists{max-height:260px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="brand"><span class="brand-mark">♞</span><span class="brand-name">ChessLab</span></div>
    <nav class="snav" id="side-nav" aria-label="Views"></nav>
    <div class="side-foot">ChessLab v1.0 · local · Stockfish</div>
  </aside>
  <div class="mainwrap">
    <header class="topbar">
      <span class="page-title" id="page-title">Play</span>
      <div class="top-chips" id="top-chips"></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottomnav" aria-label="Mobile navigation"><div class="bn-grid" id="bnav"></div></nav>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.js"></script>
<script>
'use strict';
/* ==================================================================
   ChessLab — local chess app
   Layers: Store/Engine (data + UCI worker) → logic (analysis,
   classification, importer) → render (Play / Openings / Review /
   Progress / Settings). All persistence in localStorage.
   ================================================================== */

/* ------------------------- helpers ------------------------- */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = s => String(s??'').replace(/&/g,'\x26amp;').replace(/</g,'\x26lt;').replace(/>/g,'\x26gt;').replace(/"/g,'\x26quot;').replace(/'/g,'\x26#39;');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
function toast(msg, kind=''){
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err' ? ' err' : '');
  el.setAttribute('role','status');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, 2800);
}
function openModal(title, bodyHTML, onMount){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close dialog">✕</button></div>
    <div class="modal-body">${bodyHTML}</div></div></div>`;
  const close = ()=>{ root.innerHTML=''; };
  root.querySelector('[data-close]').addEventListener('click', close);
  root.querySelector('.modal-backdrop').addEventListener('click', e=>{ if(e.target.classList.contains('modal-backdrop')) close(); });
  document.addEventListener('keydown', function onkey(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', onkey); } });
  if(onMount) onMount(root, close);
  const f = root.querySelector('input,textarea,button'); if(f) f.focus();
  return close;
}

/* ------------------------- store ------------------------- */
const Store = {
  key:'chesslab.v1',
  state:null,
  defaults(){ return {
    version:1,
    settings:{ username:'IM_AshayRane', depth:14, theme:'system', skill:8, color:'w', boardFlipped:false },
    openingLines:[],   // {id,name,fen,moves(SAN string),created}
    analyzed:{},       // key (game url or pgn-hash) -> {id,pgn,date,headers,plies:[...],summary}
    reviewDraft:null,
  };},
  load(){
    try{
      const raw = localStorage.getItem(this.key);
      if(raw) this.state = Object.assign(this.defaults(), JSON.parse(raw));
    }catch(e){ console.warn('store load failed', e); }
    if(!this.state) this.state = this.defaults();
    return this.state;
  },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.state)); }catch(e){ toast('Could not save — storage full?','err'); } },
  reset(){ this.state = this.defaults(); this.save(); }
};

/* ------------------------- theme ------------------------- */
function applyTheme(){
  const t = Store.state.settings.theme;
  const sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = (t==='system') ? sys : t;
}
function bindThemeMedia(){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(Store.state.settings.theme==='system') applyTheme(); });
}

/* ------------------------- ENGINE (UCI worker) ------------------------- */
const Engine = {
  worker:null, ready:false, offline:false, status:'loading',
  _queue:[], _busy:false, _cmdId:0,
  start(){
    // stockfish@10.0.2 (asm.js) is a worker-ready script: it installs its own
    // onmessage handler and pipes UCI output via postMessage. A bare
    // importScripts is all the wrapper needs — intercepting would break it.
    this._tryEngine(0);
  },
  _tryEngine(idx){
    const SOURCES = [
      'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.js',
      'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
      'https://unpkg.com/stockfish@10.0.2/src/stockfish.js',
    ];
    if(this.worker && this._currentSourceIdx !== idx){ try{ this.worker.terminate(); }catch(e){} this.worker = null; }
    if(idx >= SOURCES.length){
      this.offline = true; this.status = 'offline'; updateEngineChip(); return;
    }
    const blobSrc = `try{ importScripts(${JSON.stringify(SOURCES[idx])}); }catch(err){ self.postMessage('__fatal:'+String(err)); }`;
    let worker;
    try{
      const blob = new Blob([blobSrc], {type:'text/javascript'});
      worker = new Worker(URL.createObjectURL(blob));
    }catch(e){ this._tryEngine(idx+1); return; }
    this._currentSourceIdx = idx;
    this._gotUciOk = false;
    worker.onmessage = (e)=>this._onMsg(e);
    worker.onerror = (err)=>{ console.warn('engine worker error', (err&&err.message)||err); this._tryEngine(idx+1); };
    this.worker = worker;
    // 20s handshake window per source; on failure destroy and try the next
    this._hsTimer = setTimeout(()=>{ if(this.status!=='ready') this._tryEngine(idx+1); }, 20000);
    if(idx===0) this._handshake();
    this.send('uci');
  },
  _onMsg(e){
    const line = typeof e.data === 'string' ? e.data : (e.data && e.data.data);
    if(typeof line !== 'string') return;
    if(line.startsWith('__fatal')){ this.offline=true; this.status='offline'; updateEngineChip(); return; }
    if(line.startsWith('uciok')) this._gotUciOk = true;
    if(line.startsWith('readyok')) this._gotReadyOk = true;
    this._dispatch(line);
  },
  _handshake(){
    const t0 = Date.now();
    const timer = setInterval(()=>{
      if(this._gotUciOk){
        clearInterval(timer);
        clearTimeout(this._hsTimer);
        this.status='ready'; this.ready=true; updateEngineChip();
        this.send('setoption name MultiPV value 1');
        this.send('isready');
      } else if(Date.now()-t0 > 25000){
        clearInterval(timer);
      }
    }, 250);
  },
  send(str){ try{ this.worker && this.worker.postMessage(str); }catch(e){} },
  /* Serial analysis: run position+go, resolve {cpWhite, mate, bestUci, depth} */
  goDepth(fen, depth, timeoutMs=15000){
    return new Promise((resolve)=>{
      const task = { fen, depth, resolve, timer:null, cp:null, mate:null, best:null, depthSeen:0 };
      task.timer = setTimeout(()=>{ this._finish(task, 'timeout'); }, timeoutMs);
      this._queue.push(task);
      this._pump();
    });
  },
  _pump(){
    if(this._busy || !this._queue.length) return;
    if(this.offline || !this.worker){ const t=this._queue.shift(); t.resolve(null); this._pump(); return; }
    this._busy = true;
    const t = this._queue[0];
    this._cur = t;
    this.send('position fen ' + t.fen);
    this.send('go depth ' + t.depth);
  },
  _finish(task, reason){
    clearTimeout(task.timer);
    this._queue = this._queue.filter(x=>x!==task);
    if(this._cur===task) this._busy=false;
    task.resolve(reason==='timeout' ? null : { cpWhite:task.cpWhite, mate:task.mate, bestUci:task.best, depth:task.depthSeen });
    this._pump();
  },
  _dispatch(line){
    const task = this._cur;
    if(!task) return;
    const mScore = line.match(/score (cp|mate) (-?\d+)/);
    if(mScore && / pv /.test(' '+line)){
      const v = +mScore[2];
      if(mScore[1]==='cp') task.cp = v; else task.mate = v;
      // score is from POV of side to move; convert to white POV
      const whiteToMove = (task.fen.split(' ')[1] === 'w');
      task.cpWhite = mScore[1]==='cp' ? (whiteToMove ? v : -v) : null;
      task.mate = mScore[1]==='mate' ? (whiteToMove ? v : -v) : null;
    }
    const mDepth = line.match(/\bdepth (\d+)/);
    if(mDepth) task.depthSeen = +mDepth[1];
    if(line.startsWith('bestmove')){
      task.best = line.split(/\s+/)[1] || null;
      this._finish(task, 'ok');
    }
  }
};

/* ------------------------- chess helpers ------------------------- */
function sanToUci(g, san){
  const mv = g.moves({verbose:true}).find(m=>m.san===san);
  if(!mv) return null;
  return mv.from + mv.to + (mv.promotion||'');
}
function uciToSan(fen, uci){
  const g = new Chess(fen);
  const mv = g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===uci);
  if(!mv) return null;
  g.move({from:mv.from, to:mv.to, promotion:mv.promotion});
  return mv.san;
}
function pieceVal(type){ return {p:1,n:3,b:3,r:5,q:9,k:0}[type]||0; }
function materialFor(board, color){
  let m = 0;
  for(const row of board) for(const sq of row){
    if(sq && sq.color===color) m += pieceVal(sq.type);
  }
  return m;
}
/* win% from white-POV centipawns (lichess model) */
function wpFromCp(cp){
  return 50 + 50 * (2/(1+Math.exp(-0.00368208*cp)) - 1);
}
function isEval(ev){ return !!ev && (ev.mate!=null || ev.cpWhite!=null); }
function wpWhite(evalWhite){ // evalWhite: {cpWhite} or {mate}
  if(evalWhite.mate != null){
    return evalWhite.mate > 0 ? 100 : 0;
  }
  return wpFromCp(evalWhite.cpWhite||0);
}
function evalStr(ev){
  if(!ev) return '?';
  if(ev.mate != null) return (ev.mate>0?'#':'#-')+Math.abs(ev.mate);
  const v = (ev.cpWhite||0)/100;
  return (v>0?'+':'') + v.toFixed(1);
}

function validateOpenings(){
  VALID_OPENINGS = [];
  for(const op of OPENING_LIBRARY){
    try{
      const g = new Chess();
      for(const san of op.moves.split(/\s+/)){
        if(!g.move(san)) throw new Error('illegal: '+san);
      }
      VALID_OPENINGS.push(op);
    }catch(err){
      console.warn('ChessLab: dropping invalid opening line:', op.name, err.message);

/* ------------------------- move list sanitizer ------------------------- */
function sanitizeMoves(text){
  let s = String(text||'');
  s = s.replace(/\{[^}]*\}/g,' ');           // {} comments
  s = s.replace(/\([^)]*\)/g,' ');           // () variations
  s = s.replace(/;[^\n]*/g,' ');             // ; rest-of-line comments
  s = s.replace(/\$\d+/g,' ');               // NAGs
  s = s.replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g,' ');
  s = s.replace(/\d+\s*\.{1,3}(\.\.)?/g,' '); // move numbers
  return s.split(/[\s,]+/).filter(t=>t && /^[a-zA-Z0-9+#=\-]+$/.test(t));
}
/* play a line on a Chess object; return null or {error} with ply info */
function playLine(g, tokens){
  for(let i=0;i<tokens.length;i++){
    const tok = tokens[i];
    let mv = null;
    try{ mv = g.move(tok); }catch(e){ mv = null; }
    if(!mv){
      // UCI fallback (4 or 5 chars)
      if(/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(tok)){
        const from=tok.slice(0,2), to=tok.slice(2,4), promo=tok.slice(4)||undefined;
        mv = g.move({from,to,promotion:promo});
      }
    }
    if(!mv) return { error:`Move ${Math.floor(i/2)+1}${i%2?'…':'.'} "${tok}" is not legal in this position.` };
  }
  return {};
}

/* ------------------------- analysis pipeline -------------------------
   analyzeGame(pgn) → { plies:[{san,uci,fenBefore,mover,moveNum,evalBefore,
   evalAfter(best eval of pos i+1... no: eval of actual position after),
   ...}], summary }
   For each ply i we run the engine ONCE on fenBefore(i). The played
   move's wpAfter uses the engine eval of fenBefore(i+1). */
async function analyzeGame(pgn, { depth=14, onProgress=()=>{}, isCancelled=()=>false } = {}){
  const g = new Chess();
  if(!g.load_pgn(pgn, {sloppy:true})) throw new Error('Could not parse PGN');
  const headers = g.header() || {};
  const hist = g.history({verbose:true});
  if(!hist.length) throw new Error('No moves in game');

  // replay: build per-ply records with fens + SAN→UCI
  const rep = new Chess();
  const plies = [];
  for(let i=0;i<hist.length;i++){
    const m = hist[i];
    const fenBefore = rep.fen();
    const mover = m.color; // 'w'|'b'
    const mv = rep.moves({verbose:true}).find(x=>x.san===m.san);
    let uci;
    if(mv){ rep.move({from:mv.from,to:mv.to,promotion:mv.promotion}); uci = mv.from+mv.to+(mv.promotion||''); }
    else { rep.move(m.san); const u = rep.undo(); uci = u.from+u.to+(u.promotion||''); rep.move(m.san); }
    plies.push({
      i, san:m.san, uci, fenBefore, mover,
      moveNum: Math.floor(i/2)+1,
      matBefore: materialFor(new Chess(fenBefore).board(), mover),
      evalBefore:null, evalAfterActual:null, bestUci:null, bestSan:null,
      wpBefore:null, wpAfter:null, delta:null, cls:'?', bestLine:null,
    });
  }
  // engine pass (skip final ply's "after" — game over)
  let done = 0;
  for(let i=0;i<plies.length;i++){
    if(isCancelled()) throw new Error('cancelled');
    const p = plies[i];
    const ev = await Engine.goDepth(p.fenBefore, depth);
    p.evalBefore = ev; // {cpWhite, mate, bestUci}
    if(ev){
      p.bestUci = ev.bestUci;
      if(ev.bestUci){
        const repG = new Chess(p.fenBefore);
        const vm = repG.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===ev.bestUci);
        if(vm) p.bestSan = vm.san;
      }
    }
    // wpAfter: engine eval of position AFTER the played move = fenBefore(i+1)
    if(i+1 < plies.length){
      const nextFen = plies[i+1].fenBefore;
      const evNext = await Engine.goDepth(nextFen, depth);
      plies[i].evalAfterActual = evNext;
      // reuse: plies[i+1].evalBefore will be computed next loop — avoid double work:
      plies[i+1]._pre = evNext;
      // if next ply hasn't been analyzed yet, assign directly to save a re-search
      if(!plies[i+1].evalBefore) plies[i+1].evalBefore = evNext;
      // BUT bestUci for next position needs its own search; if evNext had bestUci, keep it
      if(evNext && !plies[i+1].bestUci) plies[i+1].bestUci = evNext.bestUci;
      if(evNext && !plies[i+1].bestSan && evNext.bestUci){
        const rg = new Chess(nextFen);
        const vm = rg.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===evNext.bestUci);
        if(vm) plies[i+1].bestSan = vm.san;
      }
    }
    done++;
    onProgress(done, plies.length);
  }
  /* NOTE on efficiency: the loop above searches each position once via
     the _pre reuse trick. Position j is searched exactly once: it is
     searched as the "after" of ply j-1, or as "before" of ply j when
     j-1 didn't provide it (cancelled engines etc.). The `if(!p.evalBefore)`
     guard makes the following pass a no-op normally. */
  for(let i=0;i<plies.length;i++){
    if(!plies[i].evalBefore){
      const ev = await Engine.goDepth(plies[i].fenBefore, depth);
      plies[i].evalBefore = ev;
      if(ev){
        plies[i].bestUci = ev.bestUci;
        if(ev.bestUci){
          const rg = new Chess(plies[i].fenBefore);
          const vm = rg.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===ev.bestUci);
          if(vm) plies[i].bestSan = vm.san;
        }
      }
      onProgress(done + i, plies.length);
    }
    if(!isEval(plies[i].evalAfterActual) && i+1 < plies.length){
      plies[i].evalAfterActual = plies[i+1].evalBefore;
    }
    if(!isEval(plies[i].evalAfterActual) && i+1 === plies.length){
      // final position: mark eval as draw-ish 0 so the last move can still be classified
      plies[i].evalAfterActual = { cpWhite:0, mate:null };
    }
  }

  // classify
  for(let i=0;i<plies.length;i++){
    const p = plies[i];
    if(!isEval(p.evalBefore) || (i+1<plies.length && !isEval(p.evalAfterActual))){ p.cls='?'; continue; }
    const moverWhite = p.mover==='w';
    const wpB = moverWhite ? wpWhite(p.evalBefore) : 100-wpWhite(p.evalBefore);
    const wpA = moverWhite ? wpWhite(p.evalAfterActual) : 100-wpWhite(p.evalAfterActual);
    p.wpBefore = Math.round(wpB*10)/10;
    p.wpAfter = Math.round(wpA*10)/10;
    p.delta = Math.max(0, Math.round((wpB-wpA)*10)/10);
    const playedUci = p.uci;
    const isBest = p.bestUci && playedUci===p.bestUci;
    // brilliant: material after played vs material after best (mover POV)
    let matAfterPlayed = p.matBefore, matAfterBest = p.matBefore;
    try{
      const gb = new Chess(p.fenBefore);
      const vmP = gb.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===playedUci);
      if(vmP){ gb.move({from:vmP.from,to:vmP.to,promotion:vmP.promotion}); matAfterPlayed = materialFor(gb.board(), p.mover); }
      if(p.bestUci){
        const gb2 = new Chess(p.fenBefore);
        const vmB = gb2.moves({verbose:true}).find(x=>x.from+x.to+(x.promotion||'')===p.bestUci);
        if(vmB){ gb2.move({from:vmB.from,to:vmB.to,promotion:vmB.promotion}); matAfterBest = materialFor(gb2.board(), p.mover); }
      }
    }catch(e){}
    p.sacPawns = Math.round((matAfterPlayed - matAfterBest)*10)/10;
    let cls;
    if(isBest){
      cls = (p.sacPawns <= -2 && wpB <= 85 && wpB >= 35 && p.delta <= 2) ? 'brilliant' : 'best';
    } else if(p.delta <= 2) cls = 'excellent';
    else if(p.delta <= 8) cls = 'good';
    else if(p.delta <= 15) cls = 'inaccuracy';
    else if(p.delta <= 25) cls = 'mistake';
    else cls = 'blunder';
    if((cls==='excellent' || cls==='good') && p.delta <= 2){
      const cpOf = p.evalBefore.mate!=null ? (p.evalBefore.mate>0?600:-600) : (p.evalBefore.cpWhite||0);
      if(p.moveNum <= 8 && Math.abs(cpOf) < 50) cls = 'book';
    }
    p.cls = cls;
  }

  // summary
  const mine = plies.filter(p=>true); // both sides summarized separately later
  const summarize = color=>{
    const list = plies.filter(p=>p.mover===color && p.cls!=='?');
    if(!list.length) return null;
    const acc = 100 - 5*list.reduce((a,p)=>a+Math.min(20,Math.max(0,p.delta)),0)/list.length;
    const count = c=>list.filter(p=>p.cls===c).length;
    return {
      accuracy: Math.round(acc*10)/10,
      best: count('best'), brilliant: count('brilliant'), excellent: count('excellent'),
      good: count('good'), book: count('book'), inaccuracy: count('inaccuracy'),
      mistake: count('mistake'), blunder: count('blunder'),
      moves: list.length,
    };
  };
  return {
    headers: {
      White: headers.White, Black: headers.Black,
      WhiteElo: headers.WhiteElo, BlackElo: headers.BlackElo,
      Result: headers.Result, ECO: headers.ECO, Opening: headers.Opening,
      Date: headers.Date, Termination: headers.Termination, Link: headers.Link,
      TimeControl: headers.TimeControl,
    },
    plies,
    summary: { white: summarize('w'), black: summarize('b') },
    depth,
  };
}

/* ------------------------- chess.com importer ------------------------- */
const Importer = {
  /* chess.com sends Access-Control-Allow-Origin:* but some environments (headless,
     some extensions, strict corporate DNS) still fail the direct request — retry via
     public CORS relays before giving up. */
  async _get(url){
    const attempts = [
      ()=>fetch(url, { headers:{ 'Accept':'application/json' } }),
      ()=>fetch('https://corsproxy.io/?'+encodeURIComponent(url)),
      ()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)),
    ];
    let lastErr;
    for(const a of attempts){
      try{
        const r = await a();
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('network error');
  },
  async month(username, y, m){
    const j = await this._get(`https://api.chess.com/pub/player/${encodeURIComponent(username)}/games/${y}/${String(m+1).padStart(2,'0')}`);
    return j.games || [];
  },
  async archives(username){
    const j = await this._get(`https://api.chess.com/pub/player/${encodeURIComponent(username)}/games/archives`);
    return j.archives || [];
  },
  async stats(username){
    return this._get(`https://api.chess.com/pub/player/${encodeURIComponent(username)}/stats`);
  },
};
function gameKey(gm){ return gm.url || ('pgn:'+hashStr(gm.pgn)); }
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return String(h>>>0);
}

<script>
'use strict';
/* =================== BOARD RENDERING =================== */
/* SVG board: 8x8 rects + unicode solid glyphs with paint-order stroke */
const GLYPHS = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
function renderBoardSVG(fen, opts={}){
  const { lastMove=null, selected=null, hints=[], checkSq=null, flipped=false, bestMove=null } = opts;
  const g = new Chess(fen);
  const board = g.board(); // board()[0] = rank 8
  const files = flipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
  const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  let out = '';
  const S = 100;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const x=c*S, y=r*S;
      const dark = (r+c)%2===1;
      out += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${dark?'var(--sq-d)':'var(--sq-l)'}"/>`;
    }
  }
  // highlight helper: map square->(x,y)
  const xyOf = sq=>{
    const f = files.indexOf(sq[0]), rk = ranks.indexOf(+sq[1]);
    return [f*S, rk*S];
  };
  if(lastMove){
    for(const sq of [lastMove.from, lastMove.to]){
      if(!sq) continue;
      const [x,y]=xyOf(sq);
      out += `<rect x="${x}" y="${y}" width="${S}" height="${S}" class="sq-last"/>`;
    }
  }
  if(selected){
    const [x,y]=xyOf(selected);
    out += `<rect x="${x}" y="${y}" width="${S}" height="${S}" class="sq-sel"/>`;
  }
  if(checkSq){
    const [x,y]=xyOf(checkSq);
    out += `<rect x="${x}" y="${y}" width="${S}" height="${S}" class="sq-check"/>`;
  }
  // pieces
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq = board[r][c];
      if(!sq) continue;
      const rank = 8-r, file = 'abcdefgh'[c];
      const fx = flipped ? files.indexOf(file) : c;
      const fy = flipped ? ranks.indexOf(rank) : r;
      const x = fx*S, y = fy*S;
      const white = sq.color==='w';
      out += `<text x="${x+S/2}" y="${y+S*0.86}" text-anchor="middle" font-size="${S*0.82}"
        fill="${white?'#FAFAF7':'#2B2B28'}" stroke="${white?'#2B2B28':'#0d0d0c'}" stroke-width="${S*0.055}"
        paint-order="stroke" style="font-family:'Segoe UI Symbol','Noto Sans Symbols 2',sans-serif">${GLYPHS[sq.type]}</text>`;
    }
  }
  // hint dots (on top of pieces = capture rings; empty = dots)
  for(const sq of hints){
    const [x,y]=xyOf(sq);
    const occupied = board.some((row,rr)=>row.some((s,cc)=>{
      if(!s) return false;
      return (('abcdefgh'[cc])+(8-rr))===sq;
    }));
    if(occupied){
      out += `<circle cx="${x+S/2}" cy="${y+S/2}" r="${S*0.46}" fill="none" stroke="rgba(16,19,10,.35)" stroke-width="${S*0.09}"/>`;
    } else {
      out += `<circle cx="${x+S/2}" cy="${y+S/2}" r="${S*0.14}" fill="rgba(16,19,10,.32)"/>`;
    }
  }
  // coordinates
  for(let c=0;c<8;c++){
    const file = files[c];
    const x = c*S + S - 4, y = 8*S - 4;
    out += `<text x="${x}" y="${y}" text-anchor="end" class="coord" fill="${(c%2===1)?'var(--sq-l)':'var(--sq-d)'}">${file}</text>`;
  }
  for(let r=0;r<8;r++){
    const rank = ranks[r];
    const x = 4, y = r*S + 13;
    out += `<text x="${x}" y="${y}" class="coord" fill="${(r%2===0)?'var(--sq-l)':'var(--sq-d)'}">${rank}</text>`;
  }
  // best-move arrow (review mode)
  if(bestMove && bestMove.from && bestMove.to){
    const [x1,y1]=xyOf(bestMove.from), [x2,y2]=xyOf(bestMove.to);
    const cx1=x1+S/2, cy1=y1+S/2, cx2=x2+S/2, cy2=y2+S/2;
    const dx=cx2-cx1, dy=cy2-cy1, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len;
    const sx=cx1+ux*S*0.3, sy=cy1+uy*S*0.3;
    const ex=cx2-ux*S*0.28, ey=cy2-uy*S*0.28;
    out += `<defs><marker id="arrw" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)" opacity="0.85"/></marker></defs>
      <line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--accent)" stroke-width="${S*0.09}" opacity="0.85" marker-end="url(#arrw)" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 800 800" role="img" aria-label="Chess board position">${out}</svg>`;
}

/* =================== FALLBACK BOT =================== */
function fallbackBotMove(g){
  const moves = g.moves({verbose:true});
  if(!moves.length) return null;
  const val = {p:1,n:3,b:3,r:5,q:9,k:0};
  let best = null, bestScore = -1;
  for(const m of moves){
    let score = (m.captured ? val[m.captured] : 0) + Math.random()*0.5;
    if(score > bestScore){ bestScore = score; best = m; }
  }
  return best.from + best.to + (best.promotion||'');
}

function startPlaySession({ color, skill, lineName=null, lineFen=null, lineMoves='' }){
  const g = lineFen ? new Chess(lineFen) : new Chess();
  const tokens = sanitizeMoves(lineMoves);
  let lineUpTo = 0, lineErr = null;
  if(tokens.length){
    const res = playLine(g, tokens);
    if(res.error) lineErr = res.error;
    else lineUpTo = tokens.length;
  }
  App.play = {
    id: uid(),
    color, skill,
    lineName, lineMoves: lineMoves.trim(), lineTokens: tokens,
    lineErr,
    g, lineUpTo,
    started: Date.now(),
    finished: false, result: null,
    botThinking: false,
    history: [], // {san, from, to}
  };
  App.view = 'play';
  buildNav(); render();
  maybeEngineMove();
}
function maybeEngineMove(){
  const P = App.play;
  if(!P || P.finished) return;
  const engineTurn = P.g.turn() !== P.color;
  if(!engineTurn || P.botThinking) return;
  const fenNow = P.g.fen();
  // on-line phase: engine plays scripted move for its side
  const scripted = nextScriptedUci(P);
  P.botThinking = true;
  const finish = (uci)=>{
    P.botThinking = false;
    if(!uci || App.play!==P){ renderBoardOnly(); return; }
    applyEngineMove(P, uci);
  };
  if(scripted){
    setTimeout(()=>finish(scripted), 350); // small pause so the scripted move is visible
  } else if(Engine.ready){
    Engine.send('setoption name Skill Level value ' + P.skill);
    Engine.goDepth(fenNow, 8, 30000).then(ev=>{
      finish(ev && ev.bestUci);
    });
  } else {
    setTimeout(()=>finish(fallbackBotMove(P.g)), 400);
  }
}
function nextScriptedUci(P){
  // if it's the engine's turn, the scripted move is the NEXT line move
  const idx = P.g.history().length; // plies played
  if(idx >= P.lineTokens.length) return null;
  const san = P.lineTokens[idx];
  const uci = sanToUci(P.g, san);
  return uci; // null if user already deviated
}
function applyEngineMove(P, uci){
  const mv = P.g.moves({verbose:true}).find(m=>m.from+m.to+(m.promotion||'')===uci);
  if(!mv){ // engine gave an illegal move (shouldn't happen) — try fallback
    const fb = fallbackBotMove(P.g);
    if(fb){ applyEngineMove(P, fb); }
    return;
  }
  const real = P.g.move({from:mv.from,to:mv.to,promotion:mv.promotion});
  P.history.push({ san:real.san, from:real.from, to:real.to, mover:real.color });
  checkGameEnd(P);
  render();
}
function userPlay(from, to, promotion){
  const P = App.play;
  if(!P || P.finished || P.botThinking) return false;
  if(P.g.turn() !== P.color) return false;
  const mv = P.g.moves({verbose:true}).find(m=>m.from===from && m.to===to);
  if(!mv) return false;
  const real = P.g.move({from,to,promotion:promotion||mv.promotion});
  P.history.push({ san:real.san, from:real.from, to:real.to, mover:real.color });
  checkGameEnd(P);
  render();
  maybeEngineMove();
  return true;
}
function checkGameEnd(P){
  const g = P.g;
  if(g.in_checkmate()){
    P.finished = true;
    P.result = g.turn()===P.color ? 'loss' : 'win';
    savePlayGame(P);
  } else if(g.in_draw() || g.in_stalemate() || g.in_threefold_repetition() || g.insufficient_material()){
    P.finished = true; P.result = 'draw';
    savePlayGame(P);
  }
}
function savePlayGame(P){
  const pg = P.g;
  pg.header('Event','ChessLab practice', 'White', P.color==='w' ? 'You' : `Stockfish (${P.skill})`, 'Black', P.color==='b' ? 'You' : `Stockfish (${P.skill})`, 'Date', new Date().toISOString().slice(0,10).replace(/-/g,'.'), 'Result', P.result==='abandoned' ? '*' : (pg.in_checkmate() ? (pg.turn()==='w' ? '0-1' : '1-0') : '1/2-1/2'));
  P.pgn = pg.pgn();
}
function renderBoardOnly(){
  const el = $('#board');
  if(el && App.play){ el.innerHTML = renderBoardSVG(App.play.g.fen(), boardOpts(App.play)); }
}
function boardOpts(P){
  const hist = P.g.history({verbose:true});
  const last = hist.length ? hist[hist.length-1] : null;
  let checkSq = null;
  if(P.g.in_check()){
    for(const row of P.g.board()) for(const sq of row){
      if(sq && sq.type==='k' && sq.color===P.g.turn()) checkSq = row.indexOf(sq)+''; // placeholder
    }
  }
  // find king square properly
  checkSq = null;
  if(P.g.in_check()){
    const b = P.g.board();
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const s=b[r][c];
      if(s && s.type==='k' && s.color===P.g.turn()) checkSq = 'abcdefgh'[c] + (8-r);
    }
  }
  const hints = App.play.sel ? P.g.moves({square:App.play.sel, verbose:true}).map(m=>m.to) : [];
  const flipped = P.color==='b' && !Store.state.settings.boardFlipped;
  return { lastMove: last?{from:last.from,to:last.to}:null, selected:App.play.sel, hints, checkSq, flipped };
}

function skillLabel(v){
  v = +v;
  const approx = v<=1?'~300':v<=4?'~800':v<=7?'~1100':v<=10?'~1500':v<=13?'~1800':v<=16?'~2100':v<=19?'~2500':'~2900';
  return `Skill ${v} (${approx})`;
}
function moveListHTML(history, lineTokens=[]){
  if(!history.length) return '<p class="small muted" style="padding:10px">No moves yet.</p>';
  let rows = '';
  for(let i=0;i<history.length;i+=2){
    const n = i/2+1;
    const w = history[i], b = history[i+1];
    rows += `<div class="mv-row">
      <span class="mv-num">${n}.</span>
      <button class="mv" data-mv-ply="${i}"><span class="mv-dot" style="--cls:${'var(--faint)'}"></span>${esc(w.san)}</button>
      ${b?`<button class="mv" data-mv-ply="${i+1}"><span class="mv-dot" style="--cls:${'var(--faint)'}"></span>${esc(b.san)}</button>`:'<span></span>'}
    </div>`;
  }
  return rows;
}
